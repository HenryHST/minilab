# Sync Markdown books under docs/bookstack/books/ into BookStack via REST API.
# Requires GitHub Secrets: BOOKSTACK_URL, BOOKSTACK_TOKEN_ID, BOOKSTACK_TOKEN_SECRET
# Token: BookStack → My Account → API Tokens (user with content create/edit).
# Runner: self-hosted (LAN) — book.stadthagen.dev is not public.

name: BookStack import

on:
  push:
    branches: [main]
    paths:
      - "docs/bookstack/books/**"
      - "scripts/bookstack-import/**"
      - ".github/workflows/bookstack-import.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r scripts/bookstack-import/requirements.txt

      - name: Import books
        env:
          BOOKSTACK_URL: ${{ secrets.BOOKSTACK_URL }}
          BOOKSTACK_TOKEN_ID: ${{ secrets.BOOKSTACK_TOKEN_ID }}
          BOOKSTACK_TOKEN_SECRET: ${{ secrets.BOOKSTACK_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${BOOKSTACK_URL:-}" || -z "${BOOKSTACK_TOKEN_ID:-}" || -z "${BOOKSTACK_TOKEN_SECRET:-}" ]]; then
            echo "Missing BOOKSTACK_URL / BOOKSTACK_TOKEN_ID / BOOKSTACK_TOKEN_SECRET secrets." >&2
            exit 1
          fi
          python3 scripts/bookstack-import/import_books.py --books-dir docs/bookstack/books
