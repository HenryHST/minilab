name: k8s-toolbox image

# Lab SoT: https://git.stadthagen.dev/ops/k8s-toolbox (.forgejo/workflows/image.yml)
# → git.stadthagen.dev/ops/k8s-toolbox (+ Dist mirror). This GHA workflow is dispatch-only (optional GHCR).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: SemVer override (empty = VERSION file)
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/henryhst/k8s-toolbox

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        variant: [full, slim]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          FILE_VER="$(tr -d '[:space:]' < apps/ops/k8s-toolbox/VERSION)"
          VER=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            VER="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/k8s-toolbox-v* ]]; then
            VER="${GITHUB_REF_NAME#k8s-toolbox-v}"
          else
            VER="${FILE_VER}"
          fi
          if ! [[ "${VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "::error::Invalid SemVer '${VER}' (expected X.Y.Z from VERSION, dispatch, or tag k8s-toolbox-v*)"
            exit 1
          fi
          VARIANT="${{ matrix.variant }}"
          if [ "${VARIANT}" = "slim" ]; then
            TAG="${VER}-slim"
            LATEST_TAG="latest-slim"
          else
            TAG="${VER}"
            LATEST_TAG="latest"
          fi
          MAJOR="${VER%%.*}"
          REST="${VER#*.}"
          MINOR="${REST%%.*}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "variant=${VARIANT}" >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"
          echo "minor=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=${{ steps.version.outputs.latest_tag }}
            type=sha,prefix=sha-,suffix=-${{ matrix.variant }},format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: apps/ops/k8s-toolbox
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VARIANT=${{ steps.version.outputs.variant }}
            VERSION=${{ steps.version.outputs.tag }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.date }}
          cache-from: type=gha,scope=k8s-toolbox-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=k8s-toolbox-${{ matrix.variant }}
          provenance: true
          sbom: true

      - name: Install crane
        uses: imjasonh/setup-crane@v0.7

      - name: Export rootfs for Trivy (avoid OCI SBOM false positives)
        id: rootfs
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          ROOTFS="${{ runner.temp }}/k8s-toolbox-rootfs-${{ matrix.variant }}"
          mkdir -p "$ROOTFS"
          crane export --platform linux/amd64 "${{ env.IMAGE }}@${DIGEST}" - | tar -x -C "$ROOTFS"
          echo "rootfs=${ROOTFS}" >> "$GITHUB_OUTPUT"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ steps.rootfs.outputs.rootfs }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
          scanners: vuln

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image (keyless OIDC)
        if: steps.build.outputs.digest != ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          while IFS= read -r image; do
            [[ -z "${image}" ]] && continue
            cosign sign --yes "${image}@${DIGEST}"
          done <<< "${{ steps.meta.outputs.tags }}"
