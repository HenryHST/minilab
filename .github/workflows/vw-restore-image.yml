name: vw-restore image

on:
  push:
    branches: [main]
    paths:
      - "apps/dev/vaultwarden/restore-ui/**"
      - ".github/workflows/vw-restore-image.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: SemVer image tag
        required: true
        default: "1.0.0"

env:
  REGISTRY: registry.stadthagen.dev
  IMAGE: registry.stadthagen.dev/dev/vw-restore

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to lab registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.0" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/dev/vaultwarden/restore-ui
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ steps.tag.outputs.sha }}
          build-args: |
            VERSION=${{ steps.tag.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.tag.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
