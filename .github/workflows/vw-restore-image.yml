name: vw-restore image

# Image: ghcr.io/henryhst/vw-restore (multi-arch: linux/amd64, linux/arm64)
# SemVer source of truth: apps/dev/vaultwarden/restore-ui/VERSION
# Optional override: workflow_dispatch input tag, or git tag vw-restore-vX.Y.Z

on:
  push:
    branches: [main]
    paths:
      - "apps/dev/vaultwarden/restore-ui/**"
      - ".github/workflows/vw-restore-image.yml"
    tags:
      - "vw-restore-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: SemVer override (empty = VERSION file)
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/henryhst/vw-restore

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          FILE_VER="$(tr -d '[:space:]' < apps/dev/vaultwarden/restore-ui/VERSION)"
          VER=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            VER="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/vw-restore-v* ]]; then
            VER="${GITHUB_REF_NAME#vw-restore-v}"
          else
            VER="${FILE_VER}"
          fi
          if ! [[ "${VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "::error::Invalid SemVer '${VER}' (expected X.Y.Z from VERSION, dispatch, or tag vw-restore-v*)"
            exit 1
          fi
          MAJOR="${VER%%.*}"
          REST="${VER#*.}"
          MINOR="${REST%%.*}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"
          echo "minor=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=${{ steps.version.outputs.major }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/dev/vaultwarden/restore-ui
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # #region agent log
      - name: Debug multi-arch manifest
        if: success()
        run: |
          set -euo pipefail
          MANIFEST="$(docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.version.outputs.version }}" 2>&1 || true)"
          HAS_AMD64=0; HAS_ARM64=0
          echo "$MANIFEST" | grep -q 'linux/amd64' && HAS_AMD64=1 || true
          echo "$MANIFEST" | grep -q 'linux/arm64' && HAS_ARM64=1 || true
          echo "debug_session=1ae980 hypothesisId=M1 runId=multiarch version=${{ steps.version.outputs.version }} amd64=${HAS_AMD64} arm64=${HAS_ARM64}"
          echo "$MANIFEST" | head -n 80
      # #endregion
