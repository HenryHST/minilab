# Reusable NetworkPolicy sketch for minilab app namespaces (Cilium enforces networking.k8s.io).
#
# Copy into apps/<app>/networkpolicy.yaml and replace placeholders:
#   {{NAMESPACE}}  e.g. vaultwarden
#   {{APP_LABEL}}  value for BOTH app and app.kubernetes.io/name (dual-write)
#   {{PORT}}       container/service port the Gateway (or Newt) dials
#
# Label contract (Phase 1 — dual-write):
#   Pod templates MUST set:
#     app: {{APP_LABEL}}
#     app.kubernetes.io/name: {{APP_LABEL}}
#   NetworkPolicy / Service podSelector stays on app: until Phase 2 flips selectors.
#   See docs/bookstack/books/minilab/10-metadata-conventions.md
#
# Modes:
#   A) Ingress-only (recommended start) — egress stays open (OIDC, NFS, DB, …).
#   B) Add egress deny only after listing DNS + every required destination.
#
# Cluster facts (nXk3):
#   - Edge: Cilium Gateway — Envoy uses reserved:ingress / host networking, NOT
#     kube-system pods. Allow the app port with an open ingress rule (ports only).
#   - Newt NS:    newt     (only if Pangolin publish hits this Service)
#   - DNS:        kube-system, labels k8s-app in (kube-dns, node-local-dns), UDP/TCP 53
#
# Do NOT use namespaceSelector kube-system for Gateway ingress (that was Traefik).
# Do NOT apply default-deny without the open Gateway edge port allow (and Newt, if used).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{NAMESPACE}}-ingress
  namespace: {{NAMESPACE}}
  labels:
    app.kubernetes.io/name: {{NAMESPACE}}
    app.kubernetes.io/part-of: {{NAMESPACE}}
spec:
  # Phase 1: select on legacy app: (pods must dual-write app + app.kubernetes.io/name)
  podSelector:
    matchLabels:
      app: {{APP_LABEL}}
  policyTypes:
    - Ingress
  ingress:
    # Same namespace (probes, sidecars, in-NS clients)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{NAMESPACE}}
      ports:
        - protocol: TCP
          port: {{PORT}}
    # Cilium Gateway edge (Envoy = reserved:ingress/host — open port)
    - ports:
        - protocol: TCP
          port: {{PORT}}
    # OPTIONAL — uncomment only if Pangolin Newt publishes this Service
    # - from:
    #     - namespaceSelector:
    #         matchLabels:
    #           kubernetes.io/metadata.name: newt
    #   ports:
    #     - protocol: TCP
    #       port: {{PORT}}
---
# OPTIONAL egress lockdown — enable only after inventory of outbound deps.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{NAMESPACE}}-egress
  namespace: {{NAMESPACE}}
  labels:
    app.kubernetes.io/name: {{NAMESPACE}}
    app.kubernetes.io/part-of: {{NAMESPACE}}
spec:
  podSelector:
    matchLabels:
      app: {{APP_LABEL}}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchExpressions:
              - key: k8s-app
                operator: In
                values:
                  - kube-dns
                  - node-local-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{NAMESPACE}}
