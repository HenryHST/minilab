apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
data:
  alertmanager.yml: |
    global:
      smtp_smarthost: mail.henrstadthagen.de:25
      smtp_from: auto@henrystadthagen.de
    route:
      receiver: email
      group_by: [alertname]
    receivers:
      - name: email
        email_configs:
          - to: info@henrystadthagen.de
