# Alloy syslog: allow Proxmox nodes + same-NS; egress open (push to Loki).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy-syslog-ingress
  namespace: alloy
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: alloy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: alloy
      ports:
        - protocol: TCP
          port: 12345
        - protocol: UDP
          port: 1514
        - protocol: TCP
          port: 1514
    # pve01 / pve02 / pve03
    - from:
        - ipBlock:
            cidr: 192.168.0.110/32
        - ipBlock:
            cidr: 192.168.0.108/32
        - ipBlock:
            cidr: 192.168.0.109/32
      ports:
        - protocol: UDP
          port: 1514
        - protocol: TCP
          port: 1514
