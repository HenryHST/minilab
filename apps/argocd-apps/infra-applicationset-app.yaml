# Deploys ApplicationSet manifests with goTemplate (not valid YAML for kustomize build).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-applicationset
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/HenryHST/minilab
    path: apps/argocd-apps/raw
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
