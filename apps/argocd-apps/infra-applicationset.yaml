apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # Explicit list: reliable destination.namespace (git-directory values templating
    # can render empty on some Argo CD versions). Add new infra/* apps here.
    - list:
        elements:
          - app: cert-manager
            path: infra/cert-manager
            namespace: certmanager
            syncWave: "0"
          - app: metrics-server
            path: infra/metrics-server
            namespace: kube-system
            syncWave: "0"
          - app: registry
            path: infra/registry
            namespace: kube-system
            syncWave: "0"
          - app: newt
            path: infra/newt
            namespace: newt
            syncWave: "0"
          - app: kube-prometheus-stack
            path: infra/kube-prometheus-stack
            namespace: monitoring
            syncWave: "1"
            multiSource: true
          - app: grafana-loki
            path: infra/loki
            namespace: monitoring
            syncWave: "3"
          - app: alloy
            path: infra/alloy
            namespace: alloy
            syncWave: "3"
  template:
    metadata:
      name: "{{ .app }}"
      annotations:
        argocd.argoproj.io/sync-wave: "{{ .syncWave }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: infrastruktur
      {{- if dig "multiSource" false . }}
      sources:
        - repoURL: https://prometheus-community.github.io/helm-charts
          chart: kube-prometheus-stack
          targetRevision: 88.5.4
          helm:
            releaseName: kube-prometheus-stack
            valueFiles:
              - $values/infra/kube-prometheus-stack/values.yaml
        - repoURL: https://github.com/HenryHST/minilab
          targetRevision: main
          ref: values
        - repoURL: https://github.com/HenryHST/minilab
          targetRevision: main
          path: "{{ .path }}"
      {{- else }}
      source:
        repoURL: https://github.com/HenryHST/minilab
        targetRevision: main
        path: "{{ .path }}"
      {{- end }}
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 1
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - PruneLast=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
