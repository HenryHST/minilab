apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/HenryHST/minilab
        revision: main
        directories:
          - path: infra/*
          # Bootstrap stays in apps/argocd-apps/ until self-managed via infra/argocd/.
          - path: infra/argocd
            exclude: true
          - path: infra/kargo
            exclude: true
  template:
    metadata:
      name: '{{ if eq .path.basename "loki" }}grafana-loki{{ else }}{{ .path.basename }}{{ end }}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{ if eq .path.basename "kube-prometheus-stack" }}1{{ else if or (eq .path.basename "loki") (eq .path.basename "alloy") }}3{{ else }}0{{ end }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: infrastruktur
      {{- if eq .path.basename "kube-prometheus-stack" }}
      sources:
        - repoURL: https://prometheus-community.github.io/helm-charts
          chart: kube-prometheus-stack
          targetRevision: 88.5.4
          helm:
            releaseName: kube-prometheus-stack
            valueFiles:
              - $values/infra/kube-prometheus-stack/values.yaml
        - repoURL: https://github.com/HenryHST/minilab
          targetRevision: main
          ref: values
        - repoURL: https://github.com/HenryHST/minilab
          targetRevision: main
          path: infra/kube-prometheus-stack
      {{- else }}
      source:
        repoURL: https://github.com/HenryHST/minilab
        targetRevision: main
        path: "{{ .path.path }}"
      {{- end }}
      destination:
        server: https://kubernetes.default.svc
        {{- if or (eq .path.basename "kube-prometheus-stack") (eq .path.basename "loki") }}
        namespace: monitoring
        {{- else if eq .path.basename "alloy" }}
        namespace: alloy
        {{- end }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 1
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - PruneLast=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
