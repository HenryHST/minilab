apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ops
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - app: cert-manager
            namespace: certmanager
            syncWave: "0"
            helmRepo: https://charts.jetstack.io
            helmChart: cert-manager
            helmVersion: v1.21.1
            helmReleaseName: cert-manager
            helmValuesFile: apps/ops/cert-manager/values.yaml
          - app: cert-manager-webhook-hetzner
            path: apps/ops/cert-manager/webhook
            namespace: certmanager
            syncWave: "1"
          - app: trivy-operator
            namespace: trivy-system
            syncWave: "1"
            helmRepo: https://aquasecurity.github.io/helm-charts/
            helmChart: trivy-operator
            helmVersion: "0.32.1"
            helmReleaseName: trivy-operator
            helmValuesFile: apps/ops/trivy-operator/values.yaml
          - app: registry
            path: apps/ops/registry
            namespace: kube-system
            syncWave: "0"
          - app: registry-ui
            path: apps/ops/registry-ui/manifests
            namespace: registry-ui
            syncWave: "0"
            helmRepo: https://helm.joxit.dev
            helmChart: docker-registry-ui
            helmVersion: "1.1.4"
            helmReleaseName: registry-ui
            helmValuesFile: apps/ops/registry-ui/values.yaml
            extras: true
          - app: newt
            namespace: newt
            syncWave: "0"
            helmRepo: https://charts.fossorial.io
            helmChart: newt
            helmVersion: "1.5.0"
            helmReleaseName: newt
            helmValuesFile: apps/ops/newt/values.yaml
          - app: system-upgrade-controller
            path: apps/ops/system-upgrade-controller
            namespace: system-upgrade
            syncWave: "1"
          - app: kubeconfig-user
            path: apps/ops/kubeconfig-user
            namespace: kubeconfig-user
            syncWave: "1"
          - app: pangolin-publish
            path: apps/ops/pangolin-publish
            namespace: pangolin-publish
            syncWave: "3"
          - app: authentik
            path: apps/ops/authentik
            namespace: authentik
            syncWave: "2"
          - app: headlamp
            path: apps/ops/headlamp
            namespace: kube-system
            syncWave: "2"
          - app: hubble-ui
            path: apps/ops/hubble-ui
            namespace: kube-system
            syncWave: "2"
  template:
    metadata:
      name: "{{ .app }}"
      annotations:
        argocd.argoproj.io/sync-wave: "{{ .syncWave }}"
        pref.argocd.argoproj.io/default-view: tree
        pref.argocd.argoproj.io/default-pod-sort: node
    spec:
      project: ops
      info:
        - name: Source
          value: 'https://github.com/HenryHST/minilab/tree/main/{{ if dig "path" "" . }}{{ dig "path" "" . }}{{ else }}apps/ops/{{ .app }}{{ end }}'
        - name: Project
          value: ops
        - name: Docs
          value: 'https://github.com/HenryHST/minilab/tree/main/docs/bookstack/books/{{ .app }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - PruneLast=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
  templatePatch: |
    {{- if dig "helmChart" "" . }}
    spec:
      sources:
        - repoURL: {{ .helmRepo }}
          chart: {{ .helmChart }}
          targetRevision: {{ .helmVersion }}
          helm:
            releaseName: {{ dig "helmReleaseName" .app . }}
            valueFiles:
              - $values/{{ .helmValuesFile }}
        - repoURL: https://github.com/HenryHST/minilab
          targetRevision: main
          ref: values
        {{- if dig "extras" false . }}
        - repoURL: https://github.com/HenryHST/minilab
          targetRevision: main
          path: {{ .path }}
        {{- end }}
    {{- else }}
    spec:
      source:
        repoURL: https://github.com/HenryHST/minilab
        targetRevision: main
        path: {{ .path }}
    {{- end }}
