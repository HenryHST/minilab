apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infra
  namespace: argocd
  annotations:
    # Applied by Application gitops-bootstrap (path apps/argocd-apps/raw) before ApplicationSets.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: Infra — storage, timezone, NFD, Traefik error-pages (longhorn, k8tz, nfd, error-pages)
  sourceRepos:
    - "*"
  destinations:
    - server: "*"
      namespace: longhorn-system
    - server: "*"
      namespace: k8tz
    - server: "*"
      namespace: node-feature-discovery
    - server: "*"
      namespace: error-pages
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
