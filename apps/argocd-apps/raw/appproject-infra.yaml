apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infra
  namespace: argocd
  annotations:
    # Applied by Application gitops-bootstrap (path apps/argocd-apps/raw) before ApplicationSets.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: Infra — storage, admission (Kyverno), timezone, NFD, Redis, Mosquitto, CloudNativePG, Traefik error-pages (kyverno, longhorn, k8tz, nfd, redis, mosquitto, cloudnative-pg, error-pages)
  sourceRepos:
    - "*"
  destinations:
    - server: "*"
      namespace: longhorn-system
    - server: "*"
      namespace: kyverno
    - server: "*"
      namespace: k8tz
    - server: "*"
      namespace: node-feature-discovery
    - server: "*"
      namespace: redis
    - server: "*"
      namespace: mosquitto
    - server: "*"
      namespace: cnpg-system
    - server: "*"
      namespace: error-pages
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
