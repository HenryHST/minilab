apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infrastruktur
  namespace: argocd
  annotations:
    # Applied by Application infra-applicationset (path apps/argocd-apps/raw) before ApplicationSet.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: Infrastruktur — Homelab platform (ApplicationSet infra + authentik)
  sourceRepos:
    - "*"
  destinations:
    # Wildcard server avoids mismatches (…svc vs …svc:443) that yield
    # "app is not allowed in project infrastruktur".
    - server: "*"
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
