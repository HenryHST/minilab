apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ops
  namespace: argocd
  annotations:
    # Applied by Application gitops-bootstrap (path apps/argocd-apps/raw) before ApplicationSets.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: Ops — platform, IdP, registry, edge
  sourceRepos:
    - "*"
  destinations:
    - server: "*"
      namespace: certmanager
    - server: "*"
      namespace: kube-system
    - server: "*"
      namespace: registry-ui
    - server: "*"
      namespace: newt
    - server: "*"
      namespace: authentik
    - server: "*"
      namespace: system-upgrade
    - server: "*"
      namespace: pangolin-publish
    - server: "*"
      namespace: trivy-system
    - server: "*"
      namespace: kubeconfig-user
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
