apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # helmChart entries use native Argo CD Helm (not kustomize helmCharts).
    # extras adds a git path for Kustomize resources alongside Helm.
    - list:
        elements:
          - app: cert-manager
            namespace: certmanager
            syncWave: "0"
            helmRepo: https://charts.jetstack.io
            helmChart: cert-manager
            helmVersion: v1.21.1
            helmReleaseName: cert-manager
            helmValuesFile: infra/cert-manager/values.yaml
          - app: cert-manager-webhook-hetzner
            namespace: certmanager
            syncWave: "0"
            helmRepo: https://charts.hetzner.cloud
            helmChart: cert-manager-webhook-hetzner
            helmVersion: "0.9.0"
            helmReleaseName: cert-manager-webhook-hetzner
            helmValuesFile: infra/cert-manager/webhook-values.yaml
          - app: metrics-server
            namespace: kube-system
            syncWave: "0"
            helmRepo: https://kubernetes-sigs.github.io/metrics-server/
            helmChart: metrics-server
            helmVersion: "3.14.0"
            helmReleaseName: metrics-server
            helmValuesFile: infra/metrics-server/values.yaml
          - app: registry
            path: infra/registry
            namespace: kube-system
            syncWave: "0"
          - app: newt
            namespace: newt
            syncWave: "0"
            helmRepo: https://charts.fossorial.io
            helmChart: newt
            helmVersion: "1.5.0"
            helmReleaseName: newt
            helmValuesFile: infra/newt/values.yaml
          - app: longhorn
            path: infra/longhorn/manifests
            namespace: longhorn-system
            syncWave: "1"
            helmRepo: https://charts.longhorn.io/
            helmChart: longhorn
            helmVersion: v1.12.1
            helmReleaseName: longhorn
            helmValuesFile: infra/longhorn/values.yaml
            extras: true
          - app: system-upgrade-controller
            path: infra/system-upgrade-controller
            namespace: system-upgrade
            syncWave: "1"
          - app: kube-prometheus-stack
            path: infra/kube-prometheus-stack/manifests
            namespace: monitoring
            syncWave: "1"
            helmRepo: https://prometheus-community.github.io/helm-charts
            helmChart: kube-prometheus-stack
            helmVersion: "88.5.4"
            helmReleaseName: kube-prometheus-stack
            helmValuesFile: infra/kube-prometheus-stack/values.yaml
            extras: true
          - app: grafana-loki
            path: infra/loki/manifests
            namespace: monitoring
            syncWave: "3"
            helmRepo: https://grafana-community.github.io/helm-charts
            helmChart: loki
            helmVersion: "18.11.7"
            helmReleaseName: loki
            helmValuesFile: infra/loki/values.yaml
            extras: true
          - app: alloy
            path: infra/alloy
            namespace: alloy
            syncWave: "3"
  template:
    metadata:
      name: "{{ .app }}"
      annotations:
        argocd.argoproj.io/sync-wave: "{{ .syncWave }}"
    spec:
      project: infrastruktur
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 1
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - PruneLast=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
  templatePatch: |
    {{- if dig "helmChart" "" . }}
    spec:
      sources:
        - repoURL: {{ .helmRepo }}
          chart: {{ .helmChart }}
          targetRevision: {{ .helmVersion }}
          helm:
            releaseName: {{ dig "helmReleaseName" .app . }}
            valueFiles:
              - $values/{{ .helmValuesFile }}
        - repoURL: https://github.com/HenryHST/minilab
          targetRevision: main
          ref: values
        {{- if dig "extras" false . }}
        - repoURL: https://github.com/HenryHST/minilab
          targetRevision: main
          path: {{ .path }}
        {{- end }}
    {{- else }}
    spec:
      source:
        repoURL: https://github.com/HenryHST/minilab
        targetRevision: main
        path: {{ .path }}
    {{- end }}
