# Applied by Infra_LAB: ansible-playbook site.yaml --tags secrets
# SecretSpec keys → this Secret (do not commit real values).
#
# Required stringData keys:
#   AUTHENTIK_SECRET_KEY
#   AUTHENTIK_BOOTSTRAP_EMAIL
#   AUTHENTIK_BOOTSTRAP_PASSWORD
#   AUTHENTIK_POSTGRESQL__PASSWORD
#   password                          # Bitnami PG (same value as AUTHENTIK_POSTGRESQL__PASSWORD)
#   AUTHENTIK_EMAIL__USERNAME         # literal auto@henrystadthagen.de
#   AUTHENTIK_EMAIL__PASSWORD         # SecretSpec AUTHENTIK_EMAIL_PASSWORD
#
# Optional:
#   AUTHENTIK_BOOTSTRAP_TOKEN         # API token for Terraform after first boot
apiVersion: v1
kind: Secret
metadata:
  name: authentik-credentials
  namespace: authentik
type: Opaque
stringData:
  AUTHENTIK_SECRET_KEY: CHANGE_ME
  AUTHENTIK_BOOTSTRAP_EMAIL: admin@stadthagen.dev
  AUTHENTIK_BOOTSTRAP_PASSWORD: CHANGE_ME
  AUTHENTIK_POSTGRESQL__PASSWORD: CHANGE_ME
  password: CHANGE_ME
  AUTHENTIK_EMAIL__USERNAME: auto@henrystadthagen.de
  AUTHENTIK_EMAIL__PASSWORD: CHANGE_ME
