# Example secrets for BookStack (NOT applied by Argo — create via SecretSpec / Ansible).
# Namespace: bookstack
#
# Generate APP_KEY:
#   docker run --rm --entrypoint /bin/bash lscr.io/linuxserver/bookstack:version-v26.05.5 appkey
#
# Authentik: OAuth2/OIDC Provider slug `bookstack`
#   Redirect URI: https://book.stadthagen.dev/oidc/callback
#   Groups (optional, matched to BookStack role names): BookStack Admin, BookStack Editor
---
apiVersion: v1
kind: Secret
metadata:
  name: bookstack-app
  namespace: bookstack
type: Opaque
stringData:
  APP_KEY: "base64:REPLACE_WITH_APPKEY_OUTPUT"
---
apiVersion: v1
kind: Secret
metadata:
  name: bookstack-db
  namespace: bookstack
type: Opaque
stringData:
  MARIADB_PASSWORD: "REPLACE_DB_PASSWORD"
  MARIADB_ROOT_PASSWORD: "REPLACE_ROOT_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: bookstack-oauth
  namespace: bookstack
type: Opaque
stringData:
  client-secret: "REPLACE_AUTHENTIK_CLIENT_SECRET"
---
apiVersion: v1
kind: Secret
metadata:
  name: bookstack-smtp
  namespace: bookstack
type: Opaque
stringData:
  # Optional if relay allows unauthenticated submit from LAN; keep placeholder for SecretSpec
  password: "REPLACE_OR_EMPTY"
