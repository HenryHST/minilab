# BookStack — gabe565 chart (bjw-s common) + linuxserver image
# MariaDB läuft separat als Plain YAML (mariadb.yaml), nicht als Bitnami-Subchart.
# Regenerieren:
#   helm template bookstack ./charts/bookstack -f values.yaml --namespace bookstack > helm-manifest.yaml

image:
  repository: lscr.io/linuxserver/bookstack
  tag: version-v26.05.5
  pullPolicy: IfNotPresent

controller:
  strategy: Recreate
  replicas: 1

env:
  TZ: Europe/Berlin
  PUID: "911"
  PGID: "911"
  APP_URL: https://book.stadthagen.dev
  APP_LANG: de
  APP_THEME: custom
  EXPORT_PAGE_SIZE: a4
  APP_KEY:
    secretKeyRef:
      name: bookstack-app
      key: APP_KEY
  DB_HOST: bookstack-mariadb
  DB_PORT: "3306"
  DB_DATABASE: bookstack
  DB_USERNAME: bookstack
  DB_PASSWORD:
    secretKeyRef:
      name: bookstack-db
      key: MARIADB_PASSWORD
  AUTH_METHOD: oidc
  AUTH_AUTO_INITIATE: "true"
  OIDC_NAME: Authentik
  OIDC_DISPLAY_NAME_CLAIMS: name
  OIDC_CLIENT_ID: bookstack
  OIDC_CLIENT_SECRET:
    secretKeyRef:
      name: bookstack-oauth
      key: client-secret
  OIDC_ISSUER: https://idp.stadthagen.dev/application/o/bookstack/
  OIDC_ISSUER_DISCOVER: "true"
  OIDC_END_SESSION_ENDPOINT: "true"
  OIDC_USER_TO_GROUPS: "true"
  OIDC_GROUPS_CLAIM: groups
  OIDC_REMOVE_FROM_GROUPS: "false"
  OIDC_EXTERNAL_ID_CLAIM: sub
  # SMTP (gleicher Relay wie Authentik: auto@henrystadthagen.de:465)
  MAIL_DRIVER: smtp
  MAIL_HOST: mail.henrystadthagen.de
  MAIL_PORT: "465"
  MAIL_FROM_NAME: BookStack
  MAIL_FROM: auto@henrystadthagen.de
  MAIL_USERNAME: auto@henrystadthagen.de
  MAIL_PASSWORD:
    secretKeyRef:
      name: bookstack-smtp
      key: password
  QUEUE_CONNECTION: database

ingress:
  main:
    enabled: false

persistence:
  config:
    enabled: true
    retain: true
    accessMode: ReadWriteOnce
    size: 5Gi

mariadb:
  enabled: false

shelfPermissionsCron:
  enabled: false

podSecurityContext:
  fsGroup: 911

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 1Gi
