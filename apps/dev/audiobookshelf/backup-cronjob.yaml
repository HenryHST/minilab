---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-runner
  namespace: audiobookshelf
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-runner-role
  namespace: audiobookshelf
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-runner-rolebinding
  namespace: audiobookshelf
subjects:
  - kind: ServiceAccount
    name: backup-runner
    namespace: audiobookshelf
roleRef:
  kind: Role
  name: backup-runner-role
  apiGroup: rbac.authorization.k8s.io
---
# Libraries stay on NFS (not tar'd). Backup = /config (+ optional metadata index).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: audiobookshelf-backups-nfs
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=3
    - nolock
  nfs:
    server: 192.168.0.25
    path: /var/nfs/shared/infra01/audiobookshelf-backups
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-backups
  namespace: audiobookshelf
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: audiobookshelf-backups-nfs
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audiobookshelf-backup-cron
  namespace: audiobookshelf
spec:
  schedule: "0 3 * * *" # 03:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: backup-runner
          restartPolicy: Never
          containers:
            - name: trigger-backup
              image: alpine/k8s:1.32.0
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  POD="$(kubectl -n audiobookshelf get pod -l app=audiobookshelf -o jsonpath='{.items[0].metadata.name}')"
                  if [[ -z "${POD}" ]]; then
                    echo "No audiobookshelf pod found" >&2
                    exit 1
                  fi
                  OUT="/backup/audiobookshelf-$(date -u +%Y%m%d-%H%M%S).tar.gz"
                  echo "Backing up pod/${POD} /config -> ${OUT}"
                  kubectl -n audiobookshelf exec "${POD}" -c audiobookshelf -- tar czf - -C /config . > "${OUT}"
                  ls -lh "${OUT}"
                  ls -1t /backup/audiobookshelf-*.tar.gz 2>/dev/null | tail -n +8 | xargs -r rm -f
                  echo "Done. Archives:"
                  ls -1t /backup/audiobookshelf-*.tar.gz 2>/dev/null || true
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: audiobookshelf-backups
