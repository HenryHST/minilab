# Daily copy of shelf permissions → child books.
# Runs via kubectl exec into the BookStack Deployment (shares /config PVC).
# The Helm chart CronJob (shelfPermissionsCron) cannot mount the same RWO volume
# and fails with "Please provide a valid cache path" / laravel.log open errors.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bookstack-copy-shelf-permissions
  namespace: bookstack
  labels:
    app.kubernetes.io/name: copy-shelf-permissions
    app.kubernetes.io/component: maintenance
spec:
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  schedule: "0 0 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: copy-shelf-permissions
        spec:
          serviceAccountName: bookstack-theme-sync
          imagePullSecrets:
            - name: registry-pull
          restartPolicy: Never
          nodeSelector:
            worker: "true"
          containers:
            - name: copy-shelf
              image: git.stadthagen.dev/ops/k8s-toolbox:1.0.1
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              command:
                - /bin/bash
                - -ceu
                - |
                  NS=bookstack
                  echo "Waiting for deploy/bookstack..."
                  kubectl -n "$NS" rollout status deploy/bookstack --timeout=180s
                  POD=$(kubectl -n "$NS" get pods -l app.kubernetes.io/name=bookstack \
                    -o jsonpath='{.items[0].metadata.name}')
                  echo "Exec copy-shelf-permissions on $POD"
                  kubectl -n "$NS" exec "$POD" -c bookstack -- \
                    php /app/www/artisan bookstack:copy-shelf-permissions --no-interaction --all
                  echo "OK"
