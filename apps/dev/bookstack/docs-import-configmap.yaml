apiVersion: v1
kind: ConfigMap
metadata:
  name: bookstack-import-sources
  namespace: bookstack
  labels:
    app.kubernetes.io/name: bookstack
    app.kubernetes.io/component: docs-import
data:
  sources.yaml: |
    # BookStack docs import sources (cluster CronJob).
    # Add a source = ConfigMap edit only; CronJob stays unchanged.
    sources:
      - id: infra-lab-platform
        type: git
        enabled: true
        git:
          url: https://github.com/HenryHST/Infra_LAB.git
          ref: main
          depth: 1
        books_subdir: docs/bookstack/books
      - id: minilab-docs
        type: git
        enabled: true
        git:
          url: https://github.com/HenryHST/minilab.git
          ref: main
          depth: 1
        books_subdir: docs/bookstack/books
      # Prepared — disabled in v1:
      - id: example-extra-git
        type: git
        enabled: false
        git:
          url: https://github.com/EXAMPLE/other-docs.git
          ref: main
          depth: 1
        books_subdir: docs/bookstack/books
      - id: example-portable-zip
        type: zip
        enabled: false
        zip:
          url: ""
          path: ""
  docs-import-run.sh: |
    #!/bin/sh
    # BookStack docs import — driven by sources.yaml (ConfigMap).
    # Env: BOOKSTACK_URL, BOOKSTACK_TOKEN_ID, BOOKSTACK_TOKEN_SECRET
    # Optional: FORCE_IMPORT=1
    set -eu

    SOURCES_FILE="${SOURCES_FILE:-/config/sources.yaml}"
    STATE_CM="${STATE_CM:-bookstack-import-state}"
    STATE_NS="${STATE_NS:-bookstack}"
    WORK="${WORK_DIR:-/work}"

    mkdir -p "${WORK}/clones" "${WORK}/state"

    if [ -f /state/state.json ]; then
      cp /state/state.json "${WORK}/state/state.json"
    else
      echo '{}' > "${WORK}/state/state.json"
    fi

    export SOURCES_FILE WORK STATE_CM STATE_NS
    python3 - <<'PY'
    import json
    import os
    import subprocess
    import sys
    from pathlib import Path

    try:
        import yaml
    except ImportError:
        print("ERROR: PyYAML required", file=sys.stderr)
        sys.exit(1)

    sources_file = Path(os.environ["SOURCES_FILE"])
    work = Path(os.environ["WORK"])
    state_cm = os.environ["STATE_CM"]
    state_ns = os.environ["STATE_NS"]
    force = os.environ.get("FORCE_IMPORT", "").lower() in ("1", "true", "yes")
    state_path = work / "state" / "state.json"
    git_token = (os.environ.get("GIT_TOKEN") or "").strip()

    cfg = yaml.safe_load(sources_file.read_text(encoding="utf-8")) or {}
    sources = cfg.get("sources") or []


    def run(cmd, **kw):
        # Never print credentials embedded in clone URLs
        safe = []
        for c in cmd:
            s = str(c)
            if "://" in s and "@" in s.split("://", 1)[-1].split("/", 1)[0]:
                scheme, rest = s.split("://", 1)
                safe.append(f"{scheme}://***@{rest.split('@', 1)[-1]}")
            else:
                safe.append(s)
        print("+", " ".join(safe), flush=True)
        subprocess.check_call(cmd, **kw)


    def auth_url(url: str) -> str:
        """Inject x-access-token for https://github.com when GIT_TOKEN is set."""
        if not git_token:
            return url
        prefix = "https://github.com/"
        if url.startswith(prefix):
            return f"https://x-access-token:{git_token}@github.com/" + url[len(prefix) :]
        return url


    def git_clone(url: str, ref: str, depth: str, dest: Path) -> None:
        run(
            [
                "git",
                "clone",
                "--depth",
                depth,
                "--branch",
                ref,
                auth_url(url),
                str(dest),
            ]
        )


    def resolve_script() -> Path:
        for candidate in (
            Path(os.environ.get("SCRIPT_DIR") or "") / "import_books.py",
            Path("/config/import_books.py"),
            work / "clones/infra-lab-platform/scripts/bookstack-import/import_books.py",
            work / "clones/minilab-docs/scripts/bookstack-import/import_books.py",
        ):
            if candidate.is_file():
                return candidate
        print("ERROR: import_books.py not found", file=sys.stderr)
        sys.exit(1)


    # Prefer cloning infra-lab early so /config fallback + fresh script both work
    for src in sources:
        if not src.get("enabled", True):
            continue
        if src.get("id") == "infra-lab-platform" and src.get("type") == "git":
            dest = work / "clones" / src["id"]
            if not dest.exists():
                git = src.get("git") or {}
                git_clone(
                    git["url"],
                    git.get("ref") or "main",
                    str(git.get("depth") or 1),
                    dest,
                )
            break

    script = resolve_script()
    print(f"Using importer: {script}", flush=True)

    for src in sources:
        sid = src.get("id") or "unknown"
        enabled = bool(src.get("enabled", True))
        stype = src.get("type") or "git"
        if not enabled:
            print(f"SKIP source {sid} (disabled)", flush=True)
            continue

        if stype == "zip":
            print(
                f"ERROR: source {sid}: type=zip not implemented in v1 (set enabled: false)",
                file=sys.stderr,
            )
            sys.exit(1)

        if stype == "path":
            books_dir = Path(src.get("books_subdir") or src.get("path") or "")
            if not books_dir.is_dir():
                print(f"ERROR: source {sid}: path {books_dir} missing", file=sys.stderr)
                sys.exit(1)
        elif stype == "git":
            git = src.get("git") or {}
            url = git.get("url")
            if not url:
                print(f"ERROR: source {sid}: git.url required", file=sys.stderr)
                sys.exit(1)
            ref = git.get("ref") or "main"
            depth = str(git.get("depth") or 1)
            dest = work / "clones" / sid
            if not dest.exists():
                git_clone(url, ref, depth, dest)
            else:
                print(f"Reuse clone {dest}", flush=True)
            sub = src.get("books_subdir") or "docs/bookstack/books"
            books_dir = dest / sub
            if not books_dir.is_dir():
                print(f"ERROR: source {sid}: {books_dir} not found after clone", file=sys.stderr)
                sys.exit(1)
        else:
            print(f"ERROR: source {sid}: unknown type {stype!r}", file=sys.stderr)
            sys.exit(1)

        cmd = [
            "python3",
            str(script),
            "--books-dir",
            str(books_dir),
            "--state-file",
            str(state_path),
            "--state-prefix",
            sid,
        ]
        if force:
            cmd.append("--force")
        run(cmd)

    print(f"Writing ConfigMap {state_ns}/{state_cm}", flush=True)
    cm_yaml = work / "state-cm.yaml"
    with cm_yaml.open("w", encoding="utf-8") as fh:
        run(
            [
                "kubectl",
                "-n",
                state_ns,
                "create",
                "configmap",
                state_cm,
                f"--from-file=state.json={state_path}",
                "--dry-run=client",
                "-o",
                "yaml",
            ],
            stdout=fh,
        )
    run(["kubectl", "apply", "-f", str(cm_yaml)])
    print("OK: all sources processed", flush=True)
    PY
  import_books.py: |
    #!/usr/bin/env python3
    """Idempotent BookStack import from docs/bookstack/books/**/meta.yaml + NN-*.md pages.
    
    Supports one nesting level (e.g. familie/wichtige-kontakte/) and shelf-cover.png
    next to nested book folders (books/<shelf-slug>/shelf-cover.png).
    
    Env:
      BOOKSTACK_URL            e.g. https://book.stadthagen.dev or http://bookstack.bookstack.svc
      BOOKSTACK_TOKEN_ID       API token id
      BOOKSTACK_TOKEN_SECRET   API token secret
      FORCE_IMPORT             if "1"/"true", ignore version gate
    
    Usage:
      ./import_books.py [--books-dir PATH] [--dry-run] [--only SLUG]
                        [--state-file PATH] [--state-prefix ID] [--force]
    """
    
    from __future__ import annotations
    
    import argparse
    import hashlib
    import json
    import mimetypes
    import os
    import re
    import sys
    import uuid
    import urllib.error
    import urllib.parse
    import urllib.request
    from pathlib import Path
    from typing import Any
    
    try:
        import yaml  # type: ignore
    except ImportError:
        yaml = None  # minimal fallback parser below
    
    
    FRONTMATTER_RE = re.compile(r"^---\r?\n.*?\r?\n---\r?\n", re.DOTALL)
    H1_RE = re.compile(r"^#\s+(.+)$", re.MULTILINE)
    CHAPTER_MD_RE = re.compile(r"^\d{2}-.+\.md$")
    
    # Content ACL: only these roles see/edit shelf Familie (+ its books).
    FAMILIE_SHELF_NAME = "Familie"
    FAMILIE_ACL_ROLE_NAMES = ("BookStack Admin", "BookStack Familie")
    
    
    def die(msg: str, code: int = 1) -> None:
        print(f"ERROR: {msg}", file=sys.stderr)
        raise SystemExit(code)
    
    
    def load_yaml(text: str) -> dict[str, Any]:
        if yaml is not None:
            data = yaml.safe_load(text) or {}
            if not isinstance(data, dict):
                die("meta.yaml must be a mapping")
            return data
        # Minimal subset: key: value (quoted or plain)
        out: dict[str, Any] = {}
        for line in text.splitlines():
            line = line.strip()
            if not line or line.startswith("#"):
                continue
            if ":" not in line:
                continue
            k, v = line.split(":", 1)
            v = v.strip().strip('"').strip("'")
            out[k.strip()] = v
        return out
    
    
    def strip_frontmatter(md: str) -> str:
        return FRONTMATTER_RE.sub("", md, count=1).lstrip("\n")
    
    
    def page_title(md: str, fallback: str) -> str:
        body = strip_frontmatter(md)
        m = H1_RE.search(body)
        if m:
            return m.group(1).strip()
        return fallback
    
    
    def load_state(path: Path | None) -> dict[str, str]:
        if path is None or not path.is_file():
            return {}
        try:
            data = json.loads(path.read_text(encoding="utf-8"))
        except (OSError, json.JSONDecodeError) as e:
            die(f"cannot read state file {path}: {e}")
        if not isinstance(data, dict):
            die(f"state file {path} must be a JSON object")
        return {str(k): str(v) for k, v in data.items()}
    
    
    def save_state(path: Path | None, state: dict[str, str]) -> None:
        if path is None:
            return
        path.parent.mkdir(parents=True, exist_ok=True)
        path.write_text(json.dumps(state, indent=2, sort_keys=True) + "\n", encoding="utf-8")
    
    
    def state_key(prefix: str, slug: str) -> str:
        slug = slug.strip("/")
        if prefix:
            return f"{prefix}/{slug}"
        return slug
    
    
    def cover_state_key(prefix: str, slug: str, *, book_name: str | None = None) -> str:
        """State key for cover image hash (independent of book_version gate)."""
        base = state_key(prefix, slug)
        if book_name:
            safe = re.sub(r"[^\w.\-]+", "_", book_name.strip())[:80]
            return f"{base}@{safe}@cover"
        return f"{base}@cover"
    
    
    def sha256_file(path: Path) -> str:
        h = hashlib.sha256()
        with path.open("rb") as f:
            for chunk in iter(lambda: f.read(65536), b""):
                h.update(chunk)
        return h.hexdigest()
    
    
    def resolve_cover_path(book_dir: Path, meta: dict[str, Any], *, chapter_stem: str | None = None) -> Path | None:
        """Resolve cover PNG/JPEG for a book or files_as_books chapter."""
        if chapter_stem:
            covers_map = meta.get("covers") or {}
            if isinstance(covers_map, dict):
                mapped = covers_map.get(f"{chapter_stem}.md") or covers_map.get(chapter_stem)
                if mapped:
                    p = book_dir / str(mapped)
                    return p if p.is_file() else None
            for candidate in (
                book_dir / "covers" / f"{chapter_stem}.png",
                book_dir / "covers" / f"{chapter_stem}.jpg",
                book_dir / "covers" / f"{chapter_stem}.webp",
                book_dir / f"{chapter_stem}.cover.png",
            ):
                if candidate.is_file():
                    return candidate
            return None
    
        cover = meta.get("cover")
        if cover:
            p = book_dir / str(cover)
            return p if p.is_file() else None
        for candidate in (
            book_dir / "cover.png",
            book_dir / "cover.jpg",
            book_dir / "cover.webp",
        ):
            if candidate.is_file():
                return candidate
        return None
    
    
    def encode_multipart(fields: dict[str, Any], files: dict[str, tuple[str, bytes, str]]) -> tuple[bytes, str]:
        """Build multipart/form-data body. files: name -> (filename, content, content_type).
    
        List field values are emitted as repeated ``name[]`` parts (Laravel/BookStack).
        """
        boundary = f"----BookStackImport{uuid.uuid4().hex}"
        lines: list[bytes] = []
    
        def _append_field(name: str, value: str) -> None:
            lines.append(f"--{boundary}".encode())
            lines.append(f'Content-Disposition: form-data; name="{name}"'.encode())
            lines.append(b"")
            lines.append(value.encode())
    
        for name, value in fields.items():
            if isinstance(value, list):
                for item in value:
                    _append_field(f"{name}[]", str(item))
                continue
            _append_field(name, str(value))
        for name, (filename, content, content_type) in files.items():
            lines.append(f"--{boundary}".encode())
            lines.append(
                f'Content-Disposition: form-data; name="{name}"; filename="{filename}"'.encode()
            )
            lines.append(f"Content-Type: {content_type}".encode())
            lines.append(b"")
            lines.append(content)
        lines.append(f"--{boundary}--".encode())
        lines.append(b"")
        body = b"\r\n".join(lines)
        return body, f"multipart/form-data; boundary={boundary}"
    
    
    class BookStackClient:
        def __init__(self, base: str, token_id: str, token_secret: str, dry_run: bool = False):
            self.base = base.rstrip("/")
            self.auth = f"Token {token_id}:{token_secret}"
            self.dry_run = dry_run
    
        def _req(self, method: str, path: str, body: dict | None = None) -> Any:
            url = f"{self.base}{path}"
            data = None
            headers = {
                "Authorization": self.auth,
                "Accept": "application/json",
            }
            if body is not None:
                data = json.dumps(body).encode()
                headers["Content-Type"] = "application/json"
            if self.dry_run and method in ("POST", "PUT", "DELETE"):
                print(f"DRY-RUN {method} {path} {json.dumps(body or {}, ensure_ascii=False)[:200]}")
                fake = {"id": 0, "data": [], "dry_run": True}
                if isinstance(body, dict):
                    fake.update({k: body[k] for k in ("name", "description", "books") if k in body})
                return fake
            req = urllib.request.Request(url, data=data, headers=headers, method=method)
            try:
                with urllib.request.urlopen(req, timeout=60) as resp:
                    raw = resp.read().decode()
                    return json.loads(raw) if raw else {}
            except urllib.error.HTTPError as e:
                err = e.read().decode(errors="replace")
                die(f"{method} {path} -> HTTP {e.code}: {err[:500]}")
            except urllib.error.URLError as e:
                die(f"{method} {path} -> {e}")
    
        def _req_multipart(
            self,
            method: str,
            path: str,
            fields: dict[str, str],
            files: dict[str, tuple[str, bytes, str]],
        ) -> Any:
            """POST multipart (use fields['_method']='PUT' for book cover updates)."""
            url = f"{self.base}{path}"
            if self.dry_run:
                print(
                    f"DRY-RUN {method} {path} multipart fields={list(fields)} files={list(files)}"
                )
                return {"id": 0, "dry_run": True, **{k: fields[k] for k in ("name", "description") if k in fields}}
            body, content_type = encode_multipart(fields, files)
            headers = {
                "Authorization": self.auth,
                "Accept": "application/json",
                "Content-Type": content_type,
            }
            req = urllib.request.Request(url, data=body, headers=headers, method=method)
            try:
                with urllib.request.urlopen(req, timeout=120) as resp:
                    raw = resp.read().decode()
                    return json.loads(raw) if raw else {}
            except urllib.error.HTTPError as e:
                err = e.read().decode(errors="replace")
                die(f"{method} {path} (multipart) -> HTTP {e.code}: {err[:500]}")
            except urllib.error.URLError as e:
                die(f"{method} {path} (multipart) -> {e}")
    
        def list_all(self, path: str) -> list[dict]:
            items: list[dict] = []
            page = 1
            while True:
                q = urllib.parse.urlencode({"count": 100, "page": page})
                payload = self._req("GET", f"{path}?{q}")
                batch = payload.get("data") or []
                items.extend(batch)
                total = int(payload.get("total") or len(items))
                if len(items) >= total or not batch:
                    break
                page += 1
            return items
    
        def find_by_name(self, items: list[dict], name: str) -> dict | None:
            for it in items:
                if it.get("name") == name:
                    return it
            return None
    
        def set_book_cover(
            self,
            book_id: int,
            name: str,
            description: str,
            cover_path: Path,
        ) -> dict:
            data = cover_path.read_bytes()
            mime = mimetypes.guess_type(cover_path.name)[0] or "image/png"
            print(f"  set cover: {cover_path.name} ({len(data)} bytes) → book {book_id}")
            # PHP only parses multipart on POST; use _method=PUT for updates.
            return self._req_multipart(
                "POST",
                f"/api/books/{book_id}",
                {
                    "_method": "PUT",
                    "name": name,
                    "description": description or "",
                },
                {"image": (cover_path.name, data, mime)},
            )
    
    
    def discover_book_dirs(books_dir: Path) -> list[Path]:
        """Return dirs that contain meta.yaml (top-level or nested one level)."""
        found: list[Path] = []
        for meta in sorted(books_dir.rglob("meta.yaml")):
            book_dir = meta.parent
            try:
                rel = book_dir.relative_to(books_dir)
            except ValueError:
                continue
            # Allow books/<slug>/ or books/<group>/<slug>/ only
            if len(rel.parts) > 2:
                print(f"WARN: skip deep path {rel}", file=sys.stderr)
                continue
            found.append(book_dir)
        return found
    
    
    def book_slug(books_dir: Path, book_dir: Path) -> str:
        """State key slug: leaf directory name (wichtige-kontakte)."""
        return book_dir.name
    
    
    def resolve_shelf_cover(books_dir: Path, book_dir: Path, shelf_name: str) -> Path | None:
        """books/<shelf-slug>/shelf-cover.png for nested books (folder name ≈ shelf)."""
        try:
            rel = book_dir.relative_to(books_dir)
        except ValueError:
            return None
        if len(rel.parts) < 2:
            return None
        shelf_dir = books_dir / rel.parts[0]
        slug = rel.parts[0]
        # familie ↔ Familie; my-shelf ↔ My Shelf
        slug_as_title = slug.replace("-", " ").title()
        if shelf_name.strip().casefold() not in (slug.casefold(), slug_as_title.casefold()):
            return None
        for name in ("shelf-cover.png", "shelf-cover.jpg", "shelf-cover.webp"):
            p = shelf_dir / name
            if p.is_file():
                return p
        return None
    
    
    def ensure_shelf(
        client: BookStackClient,
        shelves: list[dict],
        name: str,
        *,
        cover_path: Path | None = None,
        state: dict[str, str] | None = None,
        state_prefix: str = "",
    ) -> dict:
        existing = client.find_by_name(shelves, name)
        cover_key = cover_state_key(state_prefix, f"shelf:{name}")
        upload = False
        digest = ""
        if cover_path is not None and cover_path.is_file():
            digest = sha256_file(cover_path)
            upload = state is None or state.get(cover_key) != digest
    
        if existing:
            if upload and cover_path is not None:
                print(f"  set shelf cover: {cover_path.name} → shelf {name}")
                if not client.dry_run:
                    data = cover_path.read_bytes()
                    mime = mimetypes.guess_type(cover_path.name)[0] or "image/png"
                    fresh = client._req("GET", f"/api/shelves/{existing['id']}")
                    book_ids = [b["id"] for b in (fresh.get("books") or [])]
                    updated = client._req_multipart(
                        "POST",
                        f"/api/shelves/{existing['id']}",
                        {
                            "_method": "PUT",
                            "name": fresh.get("name") or name,
                            "description": fresh.get("description") or "",
                            "books": book_ids,
                        },
                        {"image": (cover_path.name, data, mime)},
                    )
                    if isinstance(updated, dict):
                        existing.update(updated)
                if state is not None:
                    state[cover_key] = digest
                    print(f"  STATE {cover_key}={digest[:12]}…")
            return existing
    
        print(f"  create shelf: {name}")
        if upload and cover_path is not None:
            data = cover_path.read_bytes()
            mime = mimetypes.guess_type(cover_path.name)[0] or "image/png"
            print(f"  create shelf with cover: {cover_path.name}")
            created = client._req_multipart(
                "POST",
                "/api/shelves",
                {"name": name, "description": "", "books": []},
                {"image": (cover_path.name, data, mime)},
            )
            if state is not None:
                state[cover_key] = digest
                print(f"  STATE {cover_key}={digest[:12]}…")
        else:
            created = client._req("POST", "/api/shelves", {"name": name, "description": "", "books": []})
        shelves.append(created)
        return created
    
    
    def ensure_book(
        client: BookStackClient,
        books: list[dict],
        name: str,
        description: str,
        *,
        cover_path: Path | None = None,
    ) -> dict:
        existing = client.find_by_name(books, name)
        if existing:
            if (existing.get("description") or "") != (description or "") and not client.dry_run:
                print(f"  update book description: {name}")
                updated = client._req(
                    "PUT",
                    f"/api/books/{existing['id']}",
                    {"name": name, "description": description or ""},
                )
                existing.update(updated)
            if cover_path is not None:
                updated = client.set_book_cover(
                    int(existing["id"]), name, description or "", cover_path
                )
                if isinstance(updated, dict):
                    existing.update(updated)
            return existing
        print(f"  create book: {name}")
        if cover_path is not None:
            data = cover_path.read_bytes()
            mime = mimetypes.guess_type(cover_path.name)[0] or "image/png"
            print(f"  create with cover: {cover_path.name} ({len(data)} bytes)")
            created = client._req_multipart(
                "POST",
                "/api/books",
                {"name": name, "description": description or ""},
                {"image": (cover_path.name, data, mime)},
            )
        else:
            created = client._req(
                "POST",
                "/api/books",
                {"name": name, "description": description or ""},
            )
        books.append(created)
        return created
    
    
    def list_roles(client: BookStackClient) -> list[dict] | None:
        """Return roles or None if the token lacks settings-manage / roles API access."""
        if client.dry_run:
            return [{"id": i + 1, "display_name": n} for i, n in enumerate(FAMILIE_ACL_ROLE_NAMES)]
        url = f"{client.base}/api/roles?count=100&page=1"
        headers = {"Authorization": client.auth, "Accept": "application/json"}
        req = urllib.request.Request(url, headers=headers, method="GET")
        try:
            with urllib.request.urlopen(req, timeout=60) as resp:
                payload = json.loads(resp.read().decode() or "{}")
        except urllib.error.HTTPError as e:
            err = e.read().decode(errors="replace")
            print(
                f"WARN: cannot list roles (HTTP {e.code}); skip content ACL: {err[:200]}",
                file=sys.stderr,
            )
            return None
        except urllib.error.URLError as e:
            print(f"WARN: cannot list roles; skip content ACL: {e}", file=sys.stderr)
            return None
        items: list[dict] = list(payload.get("data") or [])
        total = int(payload.get("total") or len(items))
        page = 2
        while len(items) < total:
            q = urllib.parse.urlencode({"count": 100, "page": page})
            batch_payload = client._req("GET", f"/api/roles?{q}")
            batch = batch_payload.get("data") or []
            if not batch:
                break
            items.extend(batch)
            page += 1
        return items
    
    
    def apply_content_acl(
        client: BookStackClient,
        content_type: str,
        content_id: int,
        role_ids: list[int],
        *,
        label: str,
    ) -> None:
        """Restrict content to role_ids with view+update (no public fallback)."""
        if content_id <= 0 and not client.dry_run:
            return
        role_permissions = [
            {
                "role_id": rid,
                "view": True,
                "create": True,
                "update": True,
                "delete": False,
            }
            for rid in role_ids
        ]
        body = {
            "role_permissions": role_permissions,
            "fallback_permissions": {
                "inheriting": False,
                "view": False,
                "create": False,
                "update": False,
                "delete": False,
            },
        }
        print(f"  content ACL {content_type}/{content_id} ({label}) → roles {role_ids}")
        client._req("PUT", f"/api/content-permissions/{content_type}/{content_id}", body)
    
    
    def apply_familie_acl(client: BookStackClient, shelf: dict, book: dict | None) -> None:
        """Shelf Familie + book: only BookStack Admin / BookStack Familie."""
        roles = list_roles(client)
        if roles is None:
            return
        by_name = {str(r.get("display_name") or ""): r for r in roles}
        missing = [n for n in FAMILIE_ACL_ROLE_NAMES if n not in by_name]
        if missing:
            print(
                f"WARN: missing BookStack roles {missing}; skip Familie content ACL "
                "(run gitops-bootstrap / OIDC login first)",
                file=sys.stderr,
            )
            return
        role_ids = [int(by_name[n]["id"]) for n in FAMILIE_ACL_ROLE_NAMES]
        shelf_id = int(shelf.get("id") or 0)
        if shelf_id or client.dry_run:
            apply_content_acl(
                client,
                "bookshelf",
                shelf_id,
                role_ids,
                label=str(shelf.get("name") or FAMILIE_SHELF_NAME),
            )
        if book is not None:
            book_id = int(book.get("id") or 0)
            if book_id or client.dry_run:
                apply_content_acl(
                    client,
                    "book",
                    book_id,
                    role_ids,
                    label=str(book.get("name") or "book"),
                )
    
    
    def attach_book_to_shelf(client: BookStackClient, shelf: dict, book_id: int) -> None:
        if client.dry_run:
            print(f"DRY-RUN attach book {book_id} → shelf {shelf.get('name')}")
            return
        # Re-fetch shelf for current books list
        fresh = client._req("GET", f"/api/shelves/{shelf['id']}")
        book_ids = [b["id"] for b in (fresh.get("books") or [])]
        if book_id in book_ids:
            return
        book_ids.append(book_id)
        print(f"  attach book {book_id} to shelf {shelf.get('name')}")
        client._req(
            "PUT",
            f"/api/shelves/{shelf['id']}",
            {
                "name": fresh.get("name") or shelf.get("name"),
                "description": fresh.get("description") or "",
                "books": book_ids,
            },
        )
    
    
    def list_pages_for_book(client: BookStackClient, book_id: int) -> list[dict]:
        items: list[dict] = []
        page = 1
        while True:
            q = urllib.parse.urlencode(
                {"count": 100, "page": page, "filter[book_id]": book_id}
            )
            payload = client._req("GET", f"/api/pages?{q}")
            batch = payload.get("data") or []
            items.extend(batch)
            total = int(payload.get("total") or len(items))
            if len(items) >= total or not batch:
                break
            page += 1
        return items
    
    
    def ensure_page(
        client: BookStackClient,
        pages: list[dict],
        book_id: int,
        name: str,
        markdown: str,
        priority: int,
    ) -> None:
        existing = client.find_by_name(pages, name)
        body = {"book_id": book_id, "name": name, "markdown": markdown, "priority": priority}
        if existing:
            print(f"    update page: {name}")
            client._req("PUT", f"/api/pages/{existing['id']}", body)
        else:
            print(f"    create page: {name}")
            created = client._req("POST", "/api/pages", body)
            pages.append(created)
    
    
    def chapter_files(book_dir: Path) -> list[Path]:
        files = sorted(
            p
            for p in book_dir.iterdir()
            if p.is_file() and CHAPTER_MD_RE.match(p.name)
        )
        return files
    
    
    def maybe_apply_cover(
        client: BookStackClient,
        book: dict,
        name: str,
        description: str,
        cover_path: Path | None,
        state: dict[str, str],
        cover_key: str,
    ) -> bool:
        """Upload cover if present and hash differs from state. Returns True if state should be saved."""
        if cover_path is None or book.get("id") is None:
            return False
        digest = sha256_file(cover_path)
        if state.get(cover_key) == digest:
            print(f"  cover unchanged ({cover_path.name})")
            return False
        client.set_book_cover(int(book["id"]), name, description, cover_path)
        state[cover_key] = digest
        print(f"  STATE {cover_key}={digest[:12]}…")
        return True
    
    
    def import_standard_book(
        client: BookStackClient,
        shelves: list[dict],
        books: list[dict],
        book_dir: Path,
        meta: dict[str, Any],
        *,
        books_root: Path,
        state: dict[str, str],
        state_prefix: str,
        pages_only: bool = False,
    ) -> bool:
        """Import book pages (+ cover). Returns True if state was mutated."""
        book_name = str(meta.get("book") or book_dir.name)
        shelf_name = str(meta.get("shelf") or "Plattform")
        description = str(meta.get("description") or "")
        cover_path = resolve_cover_path(book_dir, meta)
        slug = book_slug(books_root, book_dir)
        cover_key = cover_state_key(state_prefix, slug)
        dirty = False
        print(f"==> book {book_name!r} (shelf {shelf_name!r}) from {book_dir}")
        shelf_cover = resolve_shelf_cover(books_root, book_dir, shelf_name)
        shelf_cover_key = cover_state_key(state_prefix, f"shelf:{shelf_name}")
        before_shelf = state.get(shelf_cover_key)
        shelf = ensure_shelf(
            client,
            shelves,
            shelf_name,
            cover_path=shelf_cover,
            state=state,
            state_prefix=state_prefix,
        )
        if state.get(shelf_cover_key) != before_shelf:
            dirty = True
    
        if pages_only:
            book = client.find_by_name(books, book_name)
            if book is None:
                # Cover-only refresh still needs the book to exist
                book = ensure_book(client, books, book_name, description, cover_path=None)
                attach_book_to_shelf(client, shelf, int(book["id"]))
            if maybe_apply_cover(client, book, book_name, description, cover_path, state, cover_key):
                dirty = True
            if shelf_name.strip() == FAMILIE_SHELF_NAME:
                apply_familie_acl(client, shelf, book)
            return dirty
    
        # Pass cover on create; on update upload only when hash differs (avoid re-upload every import)
        existing = client.find_by_name(books, book_name)
        upload_now = False
        if cover_path is not None:
            digest = sha256_file(cover_path)
            upload_now = state.get(cover_key) != digest
        book = ensure_book(
            client,
            books,
            book_name,
            description,
            cover_path=cover_path if (upload_now and existing is None) else None,
        )
        if existing is not None and upload_now and cover_path is not None:
            client.set_book_cover(int(book["id"]), book_name, description, cover_path)
        if cover_path is not None and upload_now:
            state[cover_key] = sha256_file(cover_path)
            dirty = True
            print(f"  STATE {cover_key}={state[cover_key][:12]}…")
    
        attach_book_to_shelf(client, shelf, int(book["id"]))
        pages = list_pages_for_book(client, int(book["id"])) if not client.dry_run else []
        for i, path in enumerate(chapter_files(book_dir), start=1):
            raw = path.read_text(encoding="utf-8")
            title = page_title(raw, path.stem)
            md = strip_frontmatter(raw)
            ensure_page(client, pages, int(book["id"]), title, md, priority=i * 10)
        if shelf_name.strip() == FAMILIE_SHELF_NAME:
            apply_familie_acl(client, shelf, book)
        return dirty
    
    
    def import_files_as_books(
        client: BookStackClient,
        shelves: list[dict],
        books: list[dict],
        book_dir: Path,
        meta: dict[str, Any],
        *,
        books_root: Path,
        state: dict[str, str],
        state_prefix: str,
        pages_only: bool = False,
    ) -> bool:
        shelf_name = str(meta.get("shelf") or "Anleitungen")
        dirty = False
        print(f"==> files_as_books in {book_dir} → shelf {shelf_name!r}")
        shelf_cover = resolve_shelf_cover(books_root, book_dir, shelf_name)
        shelf = ensure_shelf(
            client,
            shelves,
            shelf_name,
            cover_path=shelf_cover,
            state=state,
            state_prefix=state_prefix,
        )
        for path in chapter_files(book_dir):
            raw = path.read_text(encoding="utf-8")
            title = page_title(raw, path.stem)
            md = strip_frontmatter(raw)
            cover_path = resolve_cover_path(book_dir, meta, chapter_stem=path.stem)
            cover_key = cover_state_key(state_prefix, book_dir.name, book_name=title)
            description = str(meta.get("description") or "")
    
            if pages_only:
                book = client.find_by_name(books, title)
                if book is None:
                    book = ensure_book(client, books, title, description, cover_path=None)
                    attach_book_to_shelf(client, shelf, int(book["id"]))
                if maybe_apply_cover(client, book, title, description, cover_path, state, cover_key):
                    dirty = True
                continue
    
            existing = client.find_by_name(books, title)
            upload_now = False
            if cover_path is not None:
                digest = sha256_file(cover_path)
                upload_now = state.get(cover_key) != digest
            book = ensure_book(
                client,
                books,
                title,
                description,
                cover_path=cover_path if (upload_now and existing is None) else None,
            )
            if existing is not None and upload_now and cover_path is not None:
                client.set_book_cover(int(book["id"]), title, description, cover_path)
            if cover_path is not None and upload_now:
                state[cover_key] = sha256_file(cover_path)
                dirty = True
                print(f"  STATE {cover_key}={state[cover_key][:12]}…")
            attach_book_to_shelf(client, shelf, int(book["id"]))
            pages = list_pages_for_book(client, int(book["id"])) if not client.dry_run else []
            ensure_page(client, pages, int(book["id"]), title, md, priority=10)
        return dirty
    
    
    def main() -> None:
        parser = argparse.ArgumentParser(description="Import BookStack books from markdown")
        parser.add_argument(
            "--books-dir",
            type=Path,
            default=None,
            help="Path to docs/bookstack/books (default: auto-detect)",
        )
        parser.add_argument("--dry-run", action="store_true")
        parser.add_argument("--only", action="append", default=[], help="Only import these directory slugs")
        parser.add_argument(
            "--state-file",
            type=Path,
            default=None,
            help="JSON map of state keys → book_version (skip unchanged)",
        )
        parser.add_argument(
            "--state-prefix",
            default="",
            help="Prefix for state keys (source id), e.g. infra-lab-platform",
        )
        parser.add_argument(
            "--force",
            action="store_true",
            help="Ignore version gate (or set FORCE_IMPORT=1)",
        )
        args = parser.parse_args()
    
        force = args.force or os.environ.get("FORCE_IMPORT", "").lower() in ("1", "true", "yes")
    
        root = Path(__file__).resolve()
        candidates = [
            args.books_dir,
            Path.cwd() / "docs/bookstack/books",
            root.parents[2] / "docs/bookstack/books",
            root.parents[1] / "docs/bookstack/books",
        ]
        books_dir = next((p for p in candidates if p and p.is_dir()), None)
        if books_dir is None:
            die("books directory not found; pass --books-dir")
    
        url = os.environ.get("BOOKSTACK_URL", "").rstrip("/")
        token_id = os.environ.get("BOOKSTACK_TOKEN_ID", "")
        token_secret = os.environ.get("BOOKSTACK_TOKEN_SECRET", "")
        if not args.dry_run and (not url or not token_id or not token_secret):
            die("Set BOOKSTACK_URL, BOOKSTACK_TOKEN_ID, BOOKSTACK_TOKEN_SECRET")
    
        client = BookStackClient(
            url or "https://example.invalid",
            token_id or "x",
            token_secret or "y",
            dry_run=args.dry_run,
        )
    
        state = load_state(args.state_file)
        state_dirty = False
    
        shelves = client.list_all("/api/shelves") if not args.dry_run else []
        books = client.list_all("/api/books") if not args.dry_run else []
    
        only = set(args.only)
        dirs = discover_book_dirs(books_dir)
        if only:
            dirs = [
                p
                for p in dirs
                if p.name in only
                or str(p.relative_to(books_dir)).replace("\\", "/") in only
            ]
        if not dirs:
            die(f"no book directories with meta.yaml under {books_dir}")
    
        for book_dir in dirs:
            meta_path = book_dir / "meta.yaml"
            meta = load_yaml(meta_path.read_text(encoding="utf-8"))
            slug = book_slug(books_dir, book_dir)
    
            version = str(meta.get("book_version") or "").strip()
            key = state_key(args.state_prefix, slug)
            mode = str(meta.get("mode") or "book")
            skip_pages = bool(not force and version and state.get(key) == version)
    
            if skip_pages:
                print(f"SKIP pages {slug} (book_version={version} unchanged, key={key})")
                # Still refresh covers when the image hash changed
                if mode == "files_as_books":
                    if import_files_as_books(
                        client,
                        shelves,
                        books,
                        book_dir,
                        meta,
                        books_root=books_dir,
                        state=state,
                        state_prefix=args.state_prefix,
                        pages_only=True,
                    ):
                        state_dirty = True
                else:
                    if import_standard_book(
                        client,
                        shelves,
                        books,
                        book_dir,
                        meta,
                        books_root=books_dir,
                        state=state,
                        state_prefix=args.state_prefix,
                        pages_only=True,
                    ):
                        state_dirty = True
                continue
    
            if mode == "files_as_books":
                if import_files_as_books(
                    client,
                    shelves,
                    books,
                    book_dir,
                    meta,
                    books_root=books_dir,
                    state=state,
                    state_prefix=args.state_prefix,
                ):
                    state_dirty = True
            else:
                if import_standard_book(
                    client,
                    shelves,
                    books,
                    book_dir,
                    meta,
                    books_root=books_dir,
                    state=state,
                    state_prefix=args.state_prefix,
                ):
                    state_dirty = True
    
            if version:
                state[key] = version
                state_dirty = True
                print(f"STATE {key}={version}")
    
        if state_dirty and not args.dry_run:
            save_state(args.state_file, state)
        elif state_dirty and args.dry_run:
            print(f"DRY-RUN would write state → {args.state_file}")
    
        print("OK: import finished")
    
    
    if __name__ == "__main__":
        main()
  gitops-bootstrap.php: |
    <?php
    /**
     * Idempotent BookStack bootstrap for cluster docs-import.
     * Env: BOOKSTACK_TOKEN_ID, BOOKSTACK_TOKEN_SECRET
     * Creates/updates:
     *   - role "GitOps Import" + user gitops-import@localhost + API token "docs-import"
     *   - role "BookStack Familie" (OIDC group display_name; content ACL for Regal Familie)
     */
    declare(strict_types=1);
    
    use BookStack\Api\ApiToken;
    use BookStack\Permissions\PermissionsRepo;
    use BookStack\Users\Models\Role;
    use BookStack\Users\Models\User;
    use BookStack\Users\UserRepo;
    use Illuminate\Support\Facades\Hash;
    use Illuminate\Support\Str;
    
    $tokenId = getenv('BOOKSTACK_TOKEN_ID') ?: '';
    $tokenSecret = getenv('BOOKSTACK_TOKEN_SECRET') ?: '';
    if ($tokenId === '' || $tokenSecret === '') {
        fwrite(STDERR, "ERROR: BOOKSTACK_TOKEN_ID / BOOKSTACK_TOKEN_SECRET required\n");
        exit(1);
    }
    if (strlen($tokenId) < 16 || strlen($tokenSecret) < 16) {
        fwrite(STDERR, "ERROR: token id/secret must be at least 16 chars\n");
        exit(1);
    }
    
    $gitopsPermissions = [
        'access-api',
        'bookshelf-view-all',
        'bookshelf-create-all',
        'bookshelf-update-all',
        'book-view-all',
        'book-create-all',
        'book-update-all',
        'chapter-view-all',
        'chapter-create-all',
        'chapter-update-all',
        'page-view-all',
        'page-create-all',
        'page-update-all',
        // Content ACL for Regal Familie (import_books.py → /api/content-permissions)
        'restrictions-manage-all',
        // List roles for ACL role_id lookup (/api/roles)
        'settings-manage',
    ];
    
    $familiePermissions = [
        'bookshelf-view-all',
        'bookshelf-create-all',
        'bookshelf-update-all',
        'book-view-all',
        'book-create-all',
        'book-update-all',
        'chapter-view-all',
        'chapter-create-all',
        'chapter-update-all',
        'page-view-all',
        'page-create-all',
        'page-update-all',
        'image-create-all',
        'image-update-all',
        'attachment-create-all',
        'attachment-update-all',
        'comment-create-all',
        'comment-update-all',
    ];
    
    $roleName = 'GitOps Import';
    $email = 'gitops-import@localhost';
    $userName = 'gitops-import';
    $tokenName = 'docs-import';
    $familieRoleName = 'BookStack Familie';
    
    /** @var PermissionsRepo $permsRepo */
    $permsRepo = app(PermissionsRepo::class);
    /** @var UserRepo $userRepo */
    $userRepo = app(UserRepo::class);
    
    $role = Role::query()->where('display_name', $roleName)->first();
    if ($role === null) {
        $role = $permsRepo->saveNewRole([
            'display_name' => $roleName,
            'description' => 'Least-privilege API role for cluster docs-import CronJob',
            'permissions' => $gitopsPermissions,
            'mfa_enforced' => false,
        ]);
        echo "ROLE created id={$role->id}\n";
    } else {
        $permsRepo->updateRole($role->id, [
            'description' => 'Least-privilege API role for cluster docs-import CronJob',
            'permissions' => $gitopsPermissions,
            'mfa_enforced' => false,
        ]);
        $role = $permsRepo->getRoleById($role->id);
        echo "ROLE updated id={$role->id}\n";
    }
    
    $familieRole = Role::query()->where('display_name', $familieRoleName)->first();
    if ($familieRole === null) {
        $familieRole = $permsRepo->saveNewRole([
            'display_name' => $familieRoleName,
            'description' => 'OIDC group BookStack Familie — Regal Familie (view/create/update, no delete)',
            'permissions' => $familiePermissions,
            'mfa_enforced' => false,
        ]);
        echo "ROLE created id={$familieRole->id} display_name={$familieRoleName}\n";
    } else {
        $permsRepo->updateRole($familieRole->id, [
            'description' => 'OIDC group BookStack Familie — Regal Familie (view/create/update, no delete)',
            'permissions' => $familiePermissions,
            'mfa_enforced' => false,
        ]);
        $familieRole = $permsRepo->getRoleById($familieRole->id);
        echo "ROLE updated id={$familieRole->id} display_name={$familieRoleName}\n";
    }
    
    $user = User::query()->where('email', $email)->first();
    if ($user === null) {
        $user = $userRepo->create([
            'name' => $userName,
            'email' => $email,
            'password' => Str::random(48),
            'roles' => [$role->id],
        ], false);
        echo "USER created id={$user->id}\n";
    } else {
        $user->email_confirmed = true;
        $user->save();
        $user->roles()->sync([$role->id]);
        echo "USER updated id={$user->id}\n";
    }
    
    $token = ApiToken::query()
        ->where('user_id', $user->id)
        ->where('name', $tokenName)
        ->first();
    
    if ($token === null) {
        $byId = ApiToken::query()->where('token_id', $tokenId)->first();
        if ($byId !== null && (int) $byId->user_id !== (int) $user->id) {
            fwrite(STDERR, "ERROR: token_id already belongs to another user\n");
            exit(1);
        }
        $token = $byId ?? new ApiToken();
    }
    
    $token->forceFill([
        'name' => $tokenName,
        'token_id' => $tokenId,
        'secret' => Hash::make($tokenSecret),
        'user_id' => $user->id,
        'expires_at' => ApiToken::defaultExpiry(),
    ]);
    $token->save();
    echo "TOKEN upserted id={$token->id} token_id={$tokenId}\n";
    echo "OK\n";
  gitops-bootstrap.sh: |
    #!/bin/sh
    # Upsert BookStack role/user/API token via artisan in the app pod.
    # Requires: BOOKSTACK_TOKEN_ID, BOOKSTACK_TOKEN_SECRET, kubectl, /config/gitops-bootstrap.php
    set -eu

    NS="${STATE_NS:-bookstack}"
    SCRIPT="${BOOTSTRAP_SCRIPT:-/config/gitops-bootstrap.php}"

    if [ -z "${BOOKSTACK_TOKEN_ID:-}" ] || [ -z "${BOOKSTACK_TOKEN_SECRET:-}" ]; then
      echo "SKIP gitops-bootstrap: token secret not set"
      exit 0
    fi

    if [ ! -f "${SCRIPT}" ]; then
      echo "ERROR: ${SCRIPT} missing" >&2
      exit 1
    fi

    echo "Waiting for bookstack deployment..."
    kubectl -n "${NS}" rollout status deploy/bookstack --timeout=180s

    # Job pods also label name=bookstack — require the Helm instance and a Running phase.
    POD="$(kubectl -n "${NS}" get pods \
      -l app.kubernetes.io/name=bookstack,app.kubernetes.io/instance=bookstack \
      --field-selector=status.phase=Running \
      -o jsonpath='{.items[0].metadata.name}')"
    if [ -z "${POD}" ]; then
      echo "ERROR: no running bookstack app pod (name+instance=bookstack)" >&2
      exit 1
    fi

    echo "Bootstrap via pod/${POD}"

    # Materialize (ConfigMap mounts are often symlinks; kubectl cp may not follow)
    TMP="/tmp/gitops-bootstrap-$$.php"
    cp -L "${SCRIPT}" "${TMP}"
    kubectl -n "${NS}" cp "${TMP}" "${POD}:/tmp/gitops-bootstrap.php" -c bookstack
    rm -f "${TMP}"

    kubectl -n "${NS}" exec "${POD}" -c bookstack -- \
      env BOOKSTACK_TOKEN_ID="${BOOKSTACK_TOKEN_ID}" BOOKSTACK_TOKEN_SECRET="${BOOKSTACK_TOKEN_SECRET}" \
      sh -ceu 'cd /app/www && php artisan tinker --execute="require \"/tmp/gitops-bootstrap.php\";"'

    kubectl -n "${NS}" exec "${POD}" -c bookstack -- rm -f /tmp/gitops-bootstrap.php || true
    echo "OK: gitops-bootstrap finished"
