# BookStack: ingress allow Cilium Gateway (open port) + Newt (Pangolin book-ext) + in-namespace.
# Egress left open (Authentik OIDC, SMTP, MariaDB).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bookstack-ingress
  namespace: bookstack
  labels:
    app.kubernetes.io/name: bookstack
    app.kubernetes.io/part-of: bookstack
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bookstack
      app.kubernetes.io/instance: bookstack
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bookstack
      ports:
        - protocol: TCP
          port: 80
    # Cilium Gateway edge (Envoy uses reserved:ingress/host — not kube-system pods)
    - ports:
        - protocol: TCP
          port: 80
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: newt
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bookstack-mariadb-ingress
  namespace: bookstack
  labels:
    app.kubernetes.io/name: bookstack-mariadb
    app.kubernetes.io/part-of: bookstack
spec:
  podSelector:
    matchLabels:
      app: bookstack-mariadb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bookstack
      ports:
        - protocol: TCP
          port: 3306
