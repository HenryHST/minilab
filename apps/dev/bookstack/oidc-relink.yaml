# Relink BookStack users.external_auth_id → live Authentik user.uid (email match).
# Run after Authentik restore when SECRET_KEY / user PKs drift (OIDC sub = hashed_user_id).
# Default off — set enabled=true (optionally dry_run=false), Argo Sync, then enabled=false.
#
# Authentik exec RBAC: apps/ops/authentik/bookstack-oidc-relink-rbac.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: bookstack-oidc-relink
  namespace: bookstack
data:
  enabled: "false"
  dry_run: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookstack-oidc-relink
  namespace: bookstack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bookstack-oidc-relink
  namespace: bookstack
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/log"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bookstack-oidc-relink
  namespace: bookstack
subjects:
  - kind: ServiceAccount
    name: bookstack-oidc-relink
    namespace: bookstack
roleRef:
  kind: Role
  name: bookstack-oidc-relink
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bookstack-oidc-relink
  namespace: bookstack
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: bookstack-oidc-relink
      # Public alpine for the default skip path. Toolbox (Forgejo) only needed when enabled=true.
      nodeSelector:
        worker: "true"
        kubernetes.io/arch: amd64
      restartPolicy: Never
      containers:
        - name: relink
          image: alpine:3.22
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: bookstack-db
                  key: MARIADB_PASSWORD
            - name: RELINK_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: bookstack-oidc-relink
                  key: enabled
            - name: RELINK_DRY_RUN
              valueFrom:
                configMapKeyRef:
                  name: bookstack-oidc-relink
                  key: dry_run
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              if [ "${RELINK_ENABLED}" != "true" ]; then
                echo "bookstack-oidc-relink.enabled!=true — skip"
                exit 0
              fi

              echo "ERROR: enabled=true needs git.stadthagen.dev/ops/k8s-toolbox (and working registry-pull)." >&2
              echo "Fix Forgejo pull auth, restore the toolbox image on this Job, then re-sync." >&2
              exit 1
