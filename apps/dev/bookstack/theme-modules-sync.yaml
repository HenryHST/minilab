# Idempotent sync of BookStack theme modules (ZIPs) + dompdf fonts + theme overlay.
# Argo PostSync hook — runs after each sync; skips installs when already present.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookstack-theme-sync
  namespace: bookstack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bookstack-theme-sync
  namespace: bookstack
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/log"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bookstack-theme-sync
  namespace: bookstack
subjects:
  - kind: ServiceAccount
    name: bookstack-theme-sync
    namespace: bookstack
roleRef:
  kind: Role
  name: bookstack-theme-sync
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bookstack-theme-modules-sync
  namespace: bookstack
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: bookstack-theme-sync
      imagePullSecrets:
        - name: registry-pull
      restartPolicy: Never
      volumes:
        - name: hack-offline
          configMap:
            name: bookstack-hack-offline-web-export
        - name: hack-mermaid
          configMap:
            name: bookstack-hack-mermaid-viewer
        # Keep font ConfigMaps minimal: ArgoCD combined manifest limit (~10 MiB).
        - name: font-regular
          configMap:
            name: bookstack-font-notosans
        - name: font-bold
          configMap:
            name: bookstack-font-notosans-bold
        - name: theme-overlay
          configMap:
            name: bookstack-theme-overlay
      containers:
        - name: sync
          image: registry.stadthagen.dev/ops/k8s-toolbox:1.0.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: hack-offline
              mountPath: /hacks/offline
              readOnly: true
            - name: hack-mermaid
              mountPath: /hacks/mermaid
              readOnly: true
            - name: font-regular
              mountPath: /fonts/regular
              readOnly: true
            - name: font-bold
              mountPath: /fonts/bold
              readOnly: true
            - name: theme-overlay
              mountPath: /overlay
              readOnly: true
          command:
            - /bin/bash
            - -ceu
            - |
              NS=bookstack
              echo "Waiting for bookstack deployment..."
              kubectl -n "$NS" rollout status deploy/bookstack --timeout=180s
              # Job pods also label name=bookstack — require Helm instance label + Running.
              POD=$(kubectl -n "$NS" get pods \
                -l app.kubernetes.io/name=bookstack,app.kubernetes.io/instance=bookstack \
                --field-selector=status.phase=Running \
                -o jsonpath='{.items[0].metadata.name}')
              if [ -z "$POD" ]; then
                echo "ERROR: no running bookstack app pod" >&2
                exit 1
              fi
              echo "Using pod $POD"

              # ConfigMap mounts are symlinks; kubectl cp does not follow them — materialize first.
              kcp() {
                local src="$1" dest="$2"
                local tmp="/tmp/kcp-$(basename "$src")"
                cp -L "$src" "$tmp"
                kubectl -n "$NS" cp "$tmp" "$dest"
                rm -f "$tmp"
              }

              install_module() {
                local zip_host="$1"
                local module_dir="$2"
                local zip_name
                zip_name="$(basename "$zip_host")"
                local marker="/config/www/themes/custom/modules/${module_dir}/bookstack-module.json"
                if kubectl -n "$NS" exec "$POD" -- test -f "$marker"; then
                  echo "SKIP module ${module_dir} (already installed)"
                  return 0
                fi
                echo "INSTALL module ${module_dir}"
                kubectl -n "$NS" exec "$POD" -- mkdir -p /tmp/bookstack-hacks
                kcp "$zip_host" "$NS/$POD:/tmp/bookstack-hacks/${zip_name}"
                kubectl -n "$NS" exec -i "$POD" -- sh -c \
                  "cd /app/www && printf 'yes\nyes\n' | php artisan bookstack:install-module /tmp/bookstack-hacks/${zip_name}"
              }

              install_module /hacks/offline/bookstack-offline-web-export.zip offline-web-export
              install_module /hacks/mermaid/mermaid-viewer.zip mermaid-viewer

              echo "Sync dompdf fonts..."
              kubectl -n "$NS" exec "$POD" -- mkdir -p /app/www/storage/fonts/dompdf /config/www/fonts/dompdf
              kcp /fonts/regular/NotoSans.ttf "$NS/$POD:/app/www/storage/fonts/dompdf/NotoSans.ttf"
              kcp /fonts/bold/NotoSans-Bold.ttf "$NS/$POD:/app/www/storage/fonts/dompdf/NotoSans-Bold.ttf"
              kcp /fonts/regular/NotoSans.ttf "$NS/$POD:/config/www/fonts/dompdf/NotoSans.ttf"
              kcp /fonts/bold/NotoSans-Bold.ttf "$NS/$POD:/config/www/fonts/dompdf/NotoSans-Bold.ttf"
              # php-fpm runs as abc (PUID 911); dompdf must write .ufm + installed-fonts.json
              # next to TTFs. Root-owned metrics (e.g. after CLI artisan PDF) break UI export.
              kubectl -n "$NS" exec "$POD" -- sh -c \
                'chown -R abc:abc /app/www/storage/fonts/dompdf /config/www/fonts/dompdf
                 chmod -R u+rwX,g+rwX /app/www/storage/fonts/dompdf /config/www/fonts/dompdf
                 # Drop root-owned metrics so first FPM export regenerates as abc if needed
                 find /app/www/storage/fonts/dompdf -maxdepth 1 \( -name "*.ufm" -o -name "installed-fonts.json" \) ! -user abc -delete 2>/dev/null || true'

              echo "Sync theme overlay (PDF font CSS)..."
              # Theme views resolve from theme_path() root (not views/)
              kcp /overlay/functions.php "$NS/$POD:/config/www/themes/custom/functions.php"
              kcp /overlay/pdf-fonts-head.blade.php "$NS/$POD:/config/www/themes/custom/pdf-fonts-head.blade.php"
              kubectl -n "$NS" exec "$POD" -- rm -f /config/www/themes/custom/views/pdf-fonts-head.blade.php

              # Book covers (docs-import): php-fpm runs as abc; ensure cover_book is writable.
              # Fresh PVCs often have /config/www/uploads/images owned by root without cover_book.
              echo "Ensure uploads/images/cover_book writable by abc..."
              kubectl -n "$NS" exec "$POD" -- sh -c \
                'mkdir -p /config/www/uploads/images/cover_book && chown -R abc:abc /config/www/uploads && chmod -R u+rwX,g+rwX /config/www/uploads'

              # PDF/dompdf: default 128M OOMs; FPM default max_execution_time=30 kills ~53s exports.
              # CLI reads /config/php/php-local.ini (PHP_INI_SCAN_DIR); FPM only includes /config/php/*.conf.
              echo "Ensure PHP memory_limit=512M + max_execution_time=300 (CLI + FPM)..."
              kubectl -n "$NS" exec "$POD" -- sh -c \
                'mkdir -p /config/php
                 f=/config/php/php-local.ini; touch "$f"
                 if grep -q "^memory_limit" "$f"; then sed -i "s/^memory_limit.*/memory_limit = 512M/" "$f"
                 else printf "\n; BookStack PDF/dompdf (CLI)\nmemory_limit = 512M\n" >> "$f"; fi
                 if grep -q "^max_execution_time" "$f"; then sed -i "s/^max_execution_time.*/max_execution_time = 300/" "$f"
                 else printf "max_execution_time = 300\n" >> "$f"; fi
                 w=/config/php/www2.conf
                 if [[ ! -f "$w" ]] || ! grep -q "^\[www\]" "$w"; then
                   printf "; FPM pool overrides\n\n[www]\n" > "$w"
                 fi
                 if grep -q "php_admin_value\[memory_limit\]" "$w"; then
                   sed -i "s/.*php_admin_value\[memory_limit\].*/php_admin_value[memory_limit] = 512M/" "$w"
                 else
                   printf "\n; BookStack PDF/dompdf (FPM)\nphp_admin_value[memory_limit] = 512M\n" >> "$w"
                 fi
                 if grep -q "php_admin_value\[max_execution_time\]" "$w"; then
                   sed -i "s/.*php_admin_value\[max_execution_time\].*/php_admin_value[max_execution_time] = 300/" "$w"
                 else
                   printf "php_admin_value[max_execution_time] = 300\n" >> "$w"
                 fi
                 # Long PDF exports need nginx fastcgi > PHP max_execution_time
                 n=/config/nginx/site-confs/default.conf
                 if [[ -f "$n" ]] && ! grep -q "fastcgi_read_timeout" "$n"; then
                   sed -i "/fastcgi_pass 127.0.0.1:9000;/a\\        fastcgi_read_timeout 300s;\\n        fastcgi_send_timeout 300s;" "$n"
                   nginx -s reload 2>/dev/null || kill -HUP "$(pgrep -o "nginx: master")" 2>/dev/null || true
                 fi
                 grep -E "memory_limit|max_execution_time|fastcgi_.*timeout" "$f" "$w" "$n" 2>/dev/null || true
                 # Hard-restart FPM: USR2 can leave old workers with stale php_admin_value
                 if [[ -d /run/service/svc-php-fpm ]]; then s6-svc -r /run/service/svc-php-fpm
                 else kill -TERM "$(pgrep -o "php-fpm: master")" 2>/dev/null || true; fi'

              kubectl -n "$NS" exec "$POD" -- sh -c 'cd /app/www && php artisan view:clear'
              echo "theme-modules-sync done"
