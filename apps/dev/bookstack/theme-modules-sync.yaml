# Idempotent sync of BookStack theme modules (ZIPs) + dompdf fonts + theme overlay.
# Argo PostSync hook — runs after each sync; skips installs when already present.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookstack-theme-sync
  namespace: bookstack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bookstack-theme-sync
  namespace: bookstack
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/log"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bookstack-theme-sync
  namespace: bookstack
subjects:
  - kind: ServiceAccount
    name: bookstack-theme-sync
    namespace: bookstack
roleRef:
  kind: Role
  name: bookstack-theme-sync
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bookstack-theme-modules-sync
  namespace: bookstack
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: bookstack-theme-sync
      restartPolicy: Never
      volumes:
        - name: hack-offline
          configMap:
            name: bookstack-hack-offline-web-export
        - name: hack-mermaid
          configMap:
            name: bookstack-hack-mermaid-viewer
        # One projected volume: unique TTF keys from each font ConfigMap (≤1 MiB each).
        - name: fonts
          projected:
            sources:
              - configMap:
                  name: bookstack-font-notosans
              - configMap:
                  name: bookstack-font-notosans-bold
              - configMap:
                  name: bookstack-font-notosansmono-black
              - configMap:
                  name: bookstack-font-notosansmono-bold
              - configMap:
                  name: bookstack-font-notosansmono-extrabold
              - configMap:
                  name: bookstack-font-notosansmono-extralight
              - configMap:
                  name: bookstack-font-notosansmono-medium
              - configMap:
                  name: bookstack-font-notosansmono-regular
              - configMap:
                  name: bookstack-font-notosansmono-semibold
              - configMap:
                  name: bookstack-font-notosansmono-thin
              - configMap:
                  name: bookstack-font-notoserif-bold
              - configMap:
                  name: bookstack-font-notoserif-italic
              - configMap:
                  name: bookstack-font-notoserif-light
              - configMap:
                  name: bookstack-font-notoserif-medium
              - configMap:
                  name: bookstack-font-notoserif-regular
        - name: theme-overlay
          configMap:
            name: bookstack-theme-overlay
      containers:
        - name: sync
          image: alpine/k8s:1.32.0
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: hack-offline
              mountPath: /hacks/offline
              readOnly: true
            - name: hack-mermaid
              mountPath: /hacks/mermaid
              readOnly: true
            - name: fonts
              mountPath: /fonts
              readOnly: true
            - name: theme-overlay
              mountPath: /overlay
              readOnly: true
          command:
            - /bin/bash
            - -ceu
            - |
              NS=bookstack
              echo "Waiting for bookstack deployment..."
              kubectl -n "$NS" rollout status deploy/bookstack --timeout=180s
              POD=$(kubectl -n "$NS" get pods -l app.kubernetes.io/name=bookstack -o jsonpath='{.items[0].metadata.name}')
              echo "Using pod $POD"

              # ConfigMap mounts are symlinks; kubectl cp does not follow them — materialize first.
              kcp() {
                local src="$1" dest="$2"
                local tmp="/tmp/kcp-$(basename "$src")"
                cp -L "$src" "$tmp"
                kubectl -n "$NS" cp "$tmp" "$dest"
                rm -f "$tmp"
              }

              install_module() {
                local zip_host="$1"
                local module_dir="$2"
                local zip_name
                zip_name="$(basename "$zip_host")"
                local marker="/config/www/themes/custom/modules/${module_dir}/bookstack-module.json"
                if kubectl -n "$NS" exec "$POD" -- test -f "$marker"; then
                  echo "SKIP module ${module_dir} (already installed)"
                  return 0
                fi
                echo "INSTALL module ${module_dir}"
                kubectl -n "$NS" exec "$POD" -- mkdir -p /tmp/bookstack-hacks
                kcp "$zip_host" "$NS/$POD:/tmp/bookstack-hacks/${zip_name}"
                kubectl -n "$NS" exec -i "$POD" -- sh -c \
                  "cd /app/www && printf 'yes\nyes\n' | php artisan bookstack:install-module /tmp/bookstack-hacks/${zip_name}"
              }

              install_module /hacks/offline/bookstack-offline-web-export.zip offline-web-export
              install_module /hacks/mermaid/mermaid-viewer.zip mermaid-viewer

              echo "Sync dompdf fonts..."
              kubectl -n "$NS" exec "$POD" -- mkdir -p /app/www/storage/fonts/dompdf /config/www/fonts/dompdf
              shopt -s nullglob
              for ttf in /fonts/*.ttf; do
                base="$(basename "$ttf")"
                echo "  $base"
                kcp "$ttf" "$NS/$POD:/app/www/storage/fonts/dompdf/${base}"
                kcp "$ttf" "$NS/$POD:/config/www/fonts/dompdf/${base}"
              done
              # php-fpm runs as abc (PUID 911); dompdf must write .ufm next to TTFs
              kubectl -n "$NS" exec "$POD" -- sh -c 'chown -R abc:abc /app/www/storage/fonts/dompdf /config/www/fonts/dompdf && chmod 775 /app/www/storage/fonts/dompdf /config/www/fonts/dompdf && chmod 664 /app/www/storage/fonts/dompdf/*.ttf /config/www/fonts/dompdf/*.ttf'

              echo "Sync theme overlay (PDF font CSS)..."
              # Theme views resolve from theme_path() root (not views/)
              kcp /overlay/functions.php "$NS/$POD:/config/www/themes/custom/functions.php"
              kcp /overlay/pdf-fonts-head.blade.php "$NS/$POD:/config/www/themes/custom/pdf-fonts-head.blade.php"
              kubectl -n "$NS" exec "$POD" -- rm -f /config/www/themes/custom/views/pdf-fonts-head.blade.php

              kubectl -n "$NS" exec "$POD" -- sh -c 'cd /app/www && php artisan view:clear'
              echo "theme-modules-sync done"
