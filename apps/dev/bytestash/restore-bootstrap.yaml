# Bootstrap restore from NFS (cluster rebuild). Default is off — set ConfigMap enabled=true
# (and force=true if data PVC already has content) then Argo Sync; set enabled=false after.
#
# PostSync Job mounts only RWX NFS so it can start while ByteStash holds the RWO data PVC.
# After scale-to-0 it creates a short-lived worker Pod that mounts data + backup + this script.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bytestash-restore
  namespace: bytestash
data:
  enabled: "false"
  archive: "latest"
  force: "false"
  replicas: "1"
  worker.sh: |
    #!/bin/sh
    set -euo pipefail
    HAS_DATA=0
    if [ "$(ls -A /data 2>/dev/null | wc -l | tr -d ' ')" != "0" ]; then
      HAS_DATA=1
    fi
    echo "data non-empty=${HAS_DATA}"
    if [ "${HAS_DATA}" = "1" ] && [ "${RESTORE_FORCE}" != "true" ]; then
      echo "data not empty and force!=true — abort" >&2
      exit 1
    fi
    if [ "${RESTORE_ARCHIVE}" = "latest" ]; then
      ARCHIVE="$(ls -1t /backup/bytestash-*.tar.gz 2>/dev/null | head -n1 || true)"
    else
      ARCHIVE="/backup/${RESTORE_ARCHIVE}"
    fi
    if [ -z "${ARCHIVE}" ] || [ ! -f "${ARCHIVE}" ]; then
      echo "No backup archive found (archive=${RESTORE_ARCHIVE})" >&2
      exit 1
    fi
    echo "Restoring from ${ARCHIVE}"
    if [ "${HAS_DATA}" = "1" ] || [ "${RESTORE_FORCE}" = "true" ]; then
      echo "Clearing /data..."
      find /data -mindepth 1 -maxdepth 1 -exec rm -rf {} +
    fi
    tar xzf "${ARCHIVE}" -C /data
    ls -la /data
    echo "Restore OK"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bytestash-restore
  namespace: bytestash
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bytestash-restore
  namespace: bytestash
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bytestash-restore
  namespace: bytestash
subjects:
  - kind: ServiceAccount
    name: bytestash-restore
    namespace: bytestash
roleRef:
  kind: Role
  name: bytestash-restore
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bytestash-bootstrap-restore
  namespace: bytestash
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: bytestash-restore
      restartPolicy: Never
      containers:
        - name: restore
          image: alpine/k8s:1.32.0
          imagePullPolicy: IfNotPresent
          env:
            - name: RESTORE_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: bytestash-restore
                  key: enabled
            - name: RESTORE_ARCHIVE
              valueFrom:
                configMapKeyRef:
                  name: bytestash-restore
                  key: archive
            - name: RESTORE_FORCE
              valueFrom:
                configMapKeyRef:
                  name: bytestash-restore
                  key: force
            - name: BS_REPLICAS
              valueFrom:
                configMapKeyRef:
                  name: bytestash-restore
                  key: replicas
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              if [[ "${RESTORE_ENABLED}" != "true" ]]; then
                echo "bytestash-restore.enabled!=true — skip"
                exit 0
              fi

              DEPLOY="bytestash"
              NS="bytestash"
              WORKER="bytestash-restore-worker"

              echo "Scaling ${DEPLOY} to 0..."
              if kubectl -n "${NS}" get deploy "${DEPLOY}" >/dev/null 2>&1; then
                kubectl -n "${NS}" scale deploy/"${DEPLOY}" --replicas=0
                kubectl -n "${NS}" rollout status deploy/"${DEPLOY}" --timeout=120s || true
                for i in $(seq 1 60); do
                  N="$(kubectl -n "${NS}" get pods -l app=bytestash --field-selector=status.phase!=Succeeded,status.phase!=Failed -o name 2>/dev/null | wc -l | tr -d ' ')"
                  [[ "${N}" == "0" ]] && break
                  sleep 2
                done
              fi

              kubectl -n "${NS}" delete pod "${WORKER}" --ignore-not-found --wait=true

              cat <<EOF | kubectl apply -f -
              apiVersion: v1
              kind: Pod
              metadata:
                name: ${WORKER}
                namespace: ${NS}
                labels:
                  app: bytestash-restore-worker
              spec:
                restartPolicy: Never
                nodeSelector:
                  worker: "true"
                containers:
                  - name: restore
                    image: alpine:3.20
                    imagePullPolicy: IfNotPresent
                    env:
                      - name: RESTORE_ARCHIVE
                        value: "${RESTORE_ARCHIVE}"
                      - name: RESTORE_FORCE
                        value: "${RESTORE_FORCE}"
                    command: ["/bin/sh", "/scripts/worker.sh"]
                    volumeMounts:
                      - name: data
                        mountPath: /data
                      - name: backup
                        mountPath: /backup
                      - name: scripts
                        mountPath: /scripts
                volumes:
                  - name: data
                    persistentVolumeClaim:
                      claimName: bytestash-data
                  - name: backup
                    persistentVolumeClaim:
                      claimName: bytestash-backups
                  - name: scripts
                    configMap:
                      name: bytestash-restore
                      defaultMode: 0755
              EOF

              echo "Waiting for worker ${WORKER}..."
              for i in $(seq 1 120); do
                PHASE="$(kubectl -n "${NS}" get pod "${WORKER}" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
                case "${PHASE}" in
                  Succeeded)
                    kubectl -n "${NS}" logs "${WORKER}" || true
                    break
                    ;;
                  Failed)
                    kubectl -n "${NS}" logs "${WORKER}" || true
                    kubectl -n "${NS}" scale deploy/"${DEPLOY}" --replicas="${BS_REPLICAS}" || true
                    kubectl -n "${NS}" delete pod "${WORKER}" --ignore-not-found
                    exit 1
                    ;;
                esac
                sleep 2
              done
              PHASE="$(kubectl -n "${NS}" get pod "${WORKER}" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
              if [[ "${PHASE}" != "Succeeded" ]]; then
                echo "Worker did not succeed (phase=${PHASE})" >&2
                kubectl -n "${NS}" logs "${WORKER}" || true
                kubectl -n "${NS}" scale deploy/"${DEPLOY}" --replicas="${BS_REPLICAS}" || true
                kubectl -n "${NS}" delete pod "${WORKER}" --ignore-not-found
                exit 1
              fi
              kubectl -n "${NS}" delete pod "${WORKER}" --ignore-not-found --wait=true

              echo "Scaling ${DEPLOY} to ${BS_REPLICAS}..."
              if kubectl -n "${NS}" get deploy "${DEPLOY}" >/dev/null 2>&1; then
                kubectl -n "${NS}" scale deploy/"${DEPLOY}" --replicas="${BS_REPLICAS}"
                kubectl -n "${NS}" rollout status deploy/"${DEPLOY}" --timeout=180s
              fi
              echo "Done. Set bytestash-restore.enabled=false in Git immediately."
          volumeMounts:
            - name: backup
              mountPath: /backup
      volumes:
        - name: backup
          persistentVolumeClaim:
            claimName: bytestash-backups
