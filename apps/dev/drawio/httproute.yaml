# Migrated from Traefik IngressRoute → Cilium Gateway API HTTPRoute.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateway-tls-drawio-tls
  namespace: drawio
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: gateway-system
  to:
  - group: ''
    kind: Secret
    name: drawio-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: drawio
  namespace: drawio
  labels:
    app.kubernetes.io/name: drawio
    app.kubernetes.io/part-of: drawio
spec:
  parentRefs:
  - name: nxk3
    namespace: gateway-system
    sectionName: https-drawio
  hostnames:
  - drawio.stadthagen.dev
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: drawio
      port: 8080
