# Allows podcraft SA (namespace podcraft) to scale + observe the drawio Deployment.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: podcraft-scaler
  namespace: drawio
  labels:
    app: drawio
    app.kubernetes.io/component: podcraft
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "replicasets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: podcraft-scaler
  namespace: drawio
  labels:
    app: drawio
    app.kubernetes.io/component: podcraft
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: podcraft-scaler
subjects:
  - kind: ServiceAccount
    name: podcraft
    namespace: podcraft
