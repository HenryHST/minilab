apiVersion: apps/v1
kind: Deployment
metadata:
  name: excalidash-frontend
  namespace: excalidash
  labels:
    app: excalidash-frontend
    app.kubernetes.io/name: excalidash
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: excalidash-frontend
  template:
    metadata:
      labels:
        app: excalidash-frontend
        app.kubernetes.io/name: excalidash
        app.kubernetes.io/component: frontend
    spec:
      nodeSelector:
        worker: "true"
      containers:
        - name: frontend
          image: zimengxiong/excalidash-frontend:0.6.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_URL
              value: excalidash-backend.excalidash.svc.cluster.local:8000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
