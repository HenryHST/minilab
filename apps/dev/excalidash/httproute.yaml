# Migrated from Traefik IngressRoute → Cilium Gateway API HTTPRoute.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateway-tls-excalidash-tls
  namespace: excalidash
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: gateway-system
  to:
  - group: ''
    kind: Secret
    name: excalidash-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: excalidash
  namespace: excalidash
  labels:
    app.kubernetes.io/name: excalidash
    app.kubernetes.io/part-of: excalidash
spec:
  parentRefs:
  - name: nxk3
    namespace: gateway-system
    sectionName: https-excalidash
  hostnames:
  - excalidash.stadthagen.dev
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: excalidash-frontend
      port: 8080
