# Forgejo Actions runner on nxk3-w06 — DinD sidecar (k3s has containerd, no host docker.sock).
# Pattern: https://code.forgejo.org/forgejo/runner (examples/kubernetes/dind-docker.yaml)
# Token: Secret forgejo-runner, or auto-mint via Forgejo admin API using forgejo-admin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-actions-runner
  namespace: forgejo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-actions-runner
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo-actions-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-actions-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-actions-runner
    spec:
      serviceAccountName: forgejo-actions-runner
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: nxk3-w06
      initContainers:
        - name: ensure-token
          image: curlimages/curl:8.12.1
          imagePullPolicy: IfNotPresent
          env:
            - name: RUNNER_SECRET
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner
                  key: token
                  optional: true
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: forgejo-admin
                  key: username
            - name: ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: forgejo-admin
                  key: password
            - name: FORGEJO_INSTANCE_URL
              value: http://forgejo-http.forgejo.svc.cluster.local:3000
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if [ -n "${RUNNER_SECRET:-}" ]; then
                printf '%s' "$RUNNER_SECRET" > /runner-token/token
                echo "using forgejo-runner secret token_len=${#RUNNER_SECRET}"
                exit 0
              fi
              echo "forgejo-runner secret missing/empty — minting via admin API"
              code=$(curl -sS -o /tmp/out -w "%{http_code}" -u "$ADMIN_USER:$ADMIN_PASS" \
                -X GET "$FORGEJO_INSTANCE_URL/api/v1/admin/actions/runners/registration-token")
              echo "admin registration-token HTTP $code"
              tok=$(sed -n 's/.*"token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /tmp/out | head -1)
              if [ -z "$tok" ]; then
                echo "mint failed; body_prefix=$(head -c 120 /tmp/out | tr '\n' ' ')"
                exit 1
              fi
              printf '%s' "$tok" > /runner-token/token
              echo "minted token_len=${#tok}"
          volumeMounts:
            - name: runner-token
              mountPath: /runner-token
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        - name: runner-register
          image: code.forgejo.org/forgejo/runner:6.3.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              RUNNER_SECRET="$(cat /runner-token/token)"
              if [[ -z "${RUNNER_SECRET}" ]]; then
                echo "runner token file empty"
                exit 1
              fi
              while true; do
                # Job image must include docker CLI (node:* does not) — DinD is reached via DOCKER_HOST TLS
                forgejo-runner register --no-interactive \
                  --token "${RUNNER_SECRET}" \
                  --name "${RUNNER_NAME}" \
                  --instance "${FORGEJO_INSTANCE_URL}" \
                  --labels "docker:docker://docker:27.5.1-cli" && break
                echo "register failed; retry in 5s"
                sleep 5
              done
              forgejo-runner generate-config > /data/config.yml
              sed -i -e 's|network: .*|network: host|' /data/config.yml
              sed -i -e 's|^  envs:$|  envs:\n    DOCKER_HOST: tcp://localhost:2376\n    DOCKER_TLS_VERIFY: 1\n    DOCKER_CERT_PATH: /certs/client|' /data/config.yml
              sed -i -e 's|^  options:|  options: -v /certs/client:/certs/client|' /data/config.yml
              sed -i -e 's|  valid_volumes: \[\]$|  valid_volumes:\n    - /certs/client|' /data/config.yml
          env:
            - name: RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: FORGEJO_INSTANCE_URL
              value: http://forgejo-http.forgejo.svc.cluster.local:3000
          volumeMounts:
            - name: data
              mountPath: /data
            - name: runner-token
              mountPath: /runner-token
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      containers:
        - name: runner
          image: code.forgejo.org/forgejo/runner:6.3.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              while ! nc -z localhost 2376 </dev/null; do
                echo 'waiting for docker daemon...'
                sleep 5
              done
              cd /data
              forgejo-runner --config config.yml daemon
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2376
            - name: DOCKER_CERT_PATH
              value: /certs/client
            - name: DOCKER_TLS_VERIFY
              value: "1"
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
        - name: dind
          image: docker:27.5.1-dind
          imagePullPolicy: IfNotPresent
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /certs
          # DinD needs privileged (Forgejo examples/kubernetes/dind-docker.yaml).
          # Trivy AVD-KSV-0017 HIGH is accepted — setting privileged=false breaks Actions builds.
          # Alternatives (Kaniko/Buildah/sysbox) are a separate runner redesign.
          securityContext:
            privileged: true
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            - name: dind-storage
              mountPath: /var/lib/docker
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 4Gi
      volumes:
        - name: docker-certs
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: dind-storage
          emptyDir: {}
        - name: runner-token
          emptyDir: {}
