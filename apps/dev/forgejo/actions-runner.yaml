# Forgejo Actions runner on nxk3-w06 — DinD sidecar (k3s has containerd, no host docker.sock).
# Pattern: https://code.forgejo.org/forgejo/runner (examples/kubernetes/dind-docker.yaml)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-actions-runner
  namespace: forgejo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-actions-runner
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo-actions-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-actions-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-actions-runner
    spec:
      serviceAccountName: forgejo-actions-runner
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: nxk3-w06
      initContainers:
        - name: runner-register
          image: code.forgejo.org/forgejo/runner:6.3.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              if [[ -z "${RUNNER_SECRET:-}" ]]; then
                echo "forgejo-runner secret token empty — create FORGEJO_RUNNER_TOKEN / Secret forgejo-runner"
                sleep infinity
              fi
              while true; do
                forgejo-runner register --no-interactive \
                  --token "${RUNNER_SECRET}" \
                  --name "${RUNNER_NAME}" \
                  --instance "${FORGEJO_INSTANCE_URL}" && break
                echo "register failed; retry in 5s"
                sleep 5
              done
              forgejo-runner generate-config > /data/config.yml
              sed -i -e 's|network: .*|network: host|' /data/config.yml
              sed -i -e 's|^  envs:$|  envs:\n    DOCKER_HOST: tcp://localhost:2376\n    DOCKER_TLS_VERIFY: 1\n    DOCKER_CERT_PATH: /certs/client|' /data/config.yml
              sed -i -e 's|^  options:|  options: -v /certs/client:/certs/client|' /data/config.yml
              sed -i -e 's|  valid_volumes: \[\]$|  valid_volumes:\n    - /certs/client|' /data/config.yml
          env:
            - name: RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUNNER_SECRET
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner
                  key: token
                  optional: true
            - name: FORGEJO_INSTANCE_URL
              value: http://forgejo-http.forgejo.svc.cluster.local:3000
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      containers:
        - name: runner
          image: code.forgejo.org/forgejo/runner:6.3.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              while ! nc -z localhost 2376 </dev/null; do
                echo 'waiting for docker daemon...'
                sleep 5
              done
              cd /data
              forgejo-runner --config config.yml daemon
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2376
            - name: DOCKER_CERT_PATH
              value: /certs/client
            - name: DOCKER_TLS_VERIFY
              value: "1"
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
        - name: dind
          image: docker:27.5.1-dind
          imagePullPolicy: IfNotPresent
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /certs
          securityContext:
            privileged: true
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            - name: dind-storage
              mountPath: /var/lib/docker
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 4Gi
      volumes:
        - name: docker-certs
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: dind-storage
          emptyDir: {}
