# Forgejo Actions runner — only on nxk3-w06
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-actions-runner
  namespace: forgejo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-actions-runner
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo-actions-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-actions-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-actions-runner
    spec:
      serviceAccountName: forgejo-actions-runner
      nodeSelector:
        kubernetes.io/hostname: nxk3-w06
      containers:
        - name: runner
          image: code.forgejo.org/forgejo/runner:6.3.1
          imagePullPolicy: IfNotPresent
          env:
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
            - name: FORGEJO_INSTANCE_URL
              value: http://forgejo-http.forgejo.svc.cluster.local:3000
            - name: FORGEJO_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner
                  key: token
                  optional: true
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: data
          emptyDir: {}
