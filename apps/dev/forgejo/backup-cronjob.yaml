apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-backup
  namespace: forgejo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgejo-backup
  namespace: forgejo
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgejo-backup
  namespace: forgejo
subjects:
  - kind: ServiceAccount
    name: forgejo-backup
    namespace: forgejo
roleRef:
  kind: Role
  name: forgejo-backup
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: forgejo-backup
  namespace: forgejo
spec:
  schedule: "30 2 * * *" # 02:30 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: forgejo-backup
          restartPolicy: Never
          containers:
            - name: backup
              image: alpine/k8s:1.31.2
              envFrom:
                - secretRef:
                    name: forgejo-backup-s3
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  apk add --no-cache aws-cli >/dev/null
                  TS="$(date -u +%Y%m%dT%H%M%SZ)"
                  POD="$(kubectl -n forgejo get pod -l app.kubernetes.io/name=forgejo \
                    --field-selector=status.phase=Running \
                    -o jsonpath='{.items[0].metadata.name}')"
                  test -n "${POD}"
                  kubectl -n forgejo exec "${POD}" -- tar -C /data -czf - . \
                    > "/tmp/forgejo-${TS}.tar.gz"
                  aws s3 cp "/tmp/forgejo-${TS}.tar.gz" \
                    "s3://${S3_BUCKET}/forgejo-${TS}.tar.gz" \
                    --endpoint-url "${AWS_ENDPOINT_URL}"
                  echo "uploaded s3://${S3_BUCKET}/forgejo-${TS}.tar.gz"
