apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: default-headers
  namespace: forgejo
spec:
  headers:
    frameDeny: true
    browserXssFilter: true
    contentTypeNosniff: true
    stsSeconds: 31536000
    stsIncludeSubdomains: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: forgejo
  namespace: forgejo
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`git.stadthagen.dev`)
      kind: Rule
      middlewares:
        - name: default-headers
      services:
        # Helm release name "forgejo" → Service forgejo-http
        - name: forgejo-http
          port: 3000
  tls:
    secretName: forgejo-tls
