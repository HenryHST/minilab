# Forgejo v16.0.6 — chart 17.3.1 (chart version ≠ app version)
# Image pin: codeberg.org/forgejo/forgejo:16.0.6
# Regenerieren / Diff:
#   helm template forgejo oci://code.forgejo.org/forgejo-helm/forgejo --version 17.3.1 \
#     -f values.yaml --namespace forgejo

image:
  registry: codeberg.org
  rootless: true
  repository: forgejo/forgejo
  tag: "16.0.6"
  pullPolicy: IfNotPresent

replicaCount: 1

strategy:
  type: Recreate

# App + registry blobs on Longhorn; pin to Forgejo workers (w05/w06).
deployment:
  env:
    - name: TZ
      value: Europe/Berlin
  labels: {}
  annotations: {}

# Chart uses deployment affinity via nodeSelector on gitea pod — set under gitea
# and also top-level if supported; use affinity for hostname In.

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - nxk3-w05
                - nxk3-w06

# Rootless image UID 1000 — explicit for PSA / defense in depth (SSH in same pod).
podSecurityContext:
  fsGroup: 1000
containerSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

persistence:
  enabled: true
  # Existing PVC is 50Gi (Actual ~2Gi). Kubernetes cannot shrink in place;
  # Longhorn numberOfReplicas=2 cuts scheduled footprint 150→100Gi. Future
  # greenfield / migrate target: 15Gi.
  size: 50Gi
  storageClass: longhorn
  annotations:
    longhorn.io/numberOfReplicas: "2"
  accessModes:
    - ReadWriteOnce

service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    # LAN Git SSH: git@git-ssh.stadthagen.dev (UniFi A → 192.168.0.218)
    # Shared VIP with Mosquitto (1883/8883/9001) via Cilium LB IPAM sharing-key
    type: LoadBalancer
    port: 22
    loadBalancerIP: 192.168.0.218
    annotations:
      lbipam.cilium.io/sharing-key: "lan-218"
      lbipam.cilium.io/sharing-cross-namespace: "mosquitto"

ingress:
  enabled: false

# SQLite for v1 — CNPG cutover prepared via commented postgres block (see README).
postgresql-ha:
  enabled: false
postgresql:
  enabled: false
valkey-cluster:
  enabled: false
valkey:
  enabled: false

gitea:
  admin:
    existingSecret: forgejo-admin
    usernameKey: username
    passwordKey: password
    emailKey: email
  oauth:
    - name: authentik
      provider: openidConnect
      key: forgejo
      existingSecret: forgejo-oauth
      autoDiscoverUrl: https://idp.stadthagen.dev/application/o/forgejo/.well-known/openid-configuration
      scopes: openid email profile
      groupClaimName: groups
      adminGroup: forgejo_admins
  config:
    APP_NAME: Stadthagen Git
    APP_SLOGAN: Lab Git + OCI
    server:
      DOMAIN: git.stadthagen.dev
      ROOT_URL: https://git.stadthagen.dev/
      SSH_DOMAIN: git-ssh.stadthagen.dev
      SSH_PORT: 22
      SSH_LISTEN_PORT: 2222
      DISABLE_SSH: false
      LANDING_PAGE: login
    database:
      DB_TYPE: sqlite3
    # CNPG prep (do not enable until migration):
    # database:
    #   DB_TYPE: postgres
    #   HOST: forgejo-pg-rw.forgejo.svc.cluster.local:5432
    #   NAME: forgejo
    #   USER: forgejo
    #   PASSWD: via additionalConfigSources secret forgejo-db
    actions:
      ENABLED: true
      DEFAULT_ACTIONS_URL: self
    admin:
      DISABLE_REGULAR_ORG_CREATION: true
      DEFAULT_EMAIL_NOTIFICATIONS: enabled
    federation:
      ENABLED: false
    repository:
      ENABLE_PUSH_CREATE_USER: true
      ENABLE_PUSH_CREATE_ORG: true
      DEFAULT_PUSH_CREATE_PRIVATE: true
      DEFAULT_PRIVATE: true
      DEFAULT_REPO_UNITS: repo.code,repo.releases,repo.issues,repo.pulls,repo.packages
    packages:
      ENABLED: true
    service:
      DISABLE_REGISTRATION: true
      ALLOW_ONLY_EXTERNAL_REGISTRATION: true
      SHOW_REGISTRATION_BUTTON: false
      ENABLE_PASSWORD_SIGNIN_FORM: false
      ENABLE_NOTIFY_MAIL: true
    openid:
      ENABLE_OPENID_SIGNIN: false
      ENABLE_OPENID_SIGNUP: false
    oauth2_client:
      ENABLE_AUTO_REGISTRATION: true
      ACCOUNT_LINKING: auto
      USERNAME: email
    mailer:
      ENABLED: true
      PROTOCOL: smtps
      SMTP_ADDR: mail.henrystadthagen.de
      SMTP_PORT: "465"
      FROM: auto@henrystadthagen.de
      USER: auto@henrystadthagen.de
    security:
      MIN_PASSWORD_LENGTH: 12
      PASSWORD_COMPLEXITY: lower,upper
    ui:
      DEFAULT_THEME: gitea-dark
      DEFAULT_SHOW_FULL_NAME: true
    indexer:
      REPO_INDEXER_ENABLED: true
  additionalConfigFromEnvs:
    - name: FORGEJO__MAILER__PASSWD
      valueFrom:
        secretKeyRef:
          name: forgejo-smtp
          key: password
    # Do NOT set nested git.* / git.config.* via FORGEJO__* envs here.
    # Chart/init still materializes dotted names (FORGEJO__git.config__…) which
    # break config_environment.sh `export` → Init CrashLoop → git.stadthagen.dev 503.
    # Prefer app.ini / future chart-native nested config if timeouts/fsck needed.
  metrics:
    enabled: true
    # ServiceMonitor: hand-written apps/dev/forgejo/servicemonitor.yaml (release label)
    serviceMonitor:
      enabled: false

# Actions runner is a separate Deployment in this folder (nodeSelector nxk3-w06).
