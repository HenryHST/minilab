apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: karakeep-meilisearch
  labels:
    helm.sh/chart: meilisearch-0.12.0
    app.kubernetes.io/name: meilisearch
    app.kubernetes.io/instance: karakeep
    app.kubernetes.io/version: "v1.13.0"
    app.kubernetes.io/component: search-engine
    app.kubernetes.io/part-of: meilisearch
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  serviceName: karakeep-meilisearch
  selector:
    matchLabels:
      app.kubernetes.io/name: meilisearch
      app.kubernetes.io/instance: karakeep
  template:
    metadata:
      labels:
        helm.sh/chart: meilisearch-0.12.0
        app.kubernetes.io/name: meilisearch
        app.kubernetes.io/instance: karakeep
        app.kubernetes.io/version: "v1.13.0"
        app.kubernetes.io/component: search-engine
        app.kubernetes.io/part-of: meilisearch
        app.kubernetes.io/managed-by: Helm
      annotations:
        checksum/config: 87186460929524abb1a98fcb0deb528c232cee24aeb7ae42a939fb5c84882977
    spec:
      serviceAccountName: karakeep-meilisearch
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: karakeep-meilisearch

      
            
      containers:
        - name: meilisearch
          image: "getmeili/meilisearch:v1.13.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /meili_data
          envFrom:
          - configMapRef:
              name: karakeep-meilisearch-environment
          - secretRef:
              name: karakeep-meilesearch
          ports:
            - name: http
              containerPort: 7700
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 1
            initialDelaySeconds: 1
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            initialDelaySeconds: 0
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            initialDelaySeconds: 0
          resources:
            {}

