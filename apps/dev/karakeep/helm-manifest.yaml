# Source: karakeep/templates/common.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: karakeep
  labels:
    app.kubernetes.io/component: karakeep
    app.kubernetes.io/instance: karakeep
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: karakeep
    app.kubernetes.io/version: 0.33.1
    helm.sh/chart: karakeep-0.33.1
  namespace: karakeep
spec:
  revisionHistoryLimit: 3
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/component: karakeep
      app.kubernetes.io/name: karakeep
      app.kubernetes.io/instance: karakeep
  serviceName: karakeep
  template:
    metadata:
      labels: 
        app.kubernetes.io/component: karakeep
        app.kubernetes.io/instance: karakeep
        app.kubernetes.io/name: karakeep
    spec: 
      enableServiceLinks: false
      serviceAccountName: default
      automountServiceAccountToken: true
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers: 
        - env:
          - name: AUTH_TRUST_HOST
            value: "true"
          - name: BROWSER_WEB_URL
            value: http://karakeep-chrome:9222
          - name: DATA_DIR
            value: /data
          - name: DISABLE_PASSWORD_AUTH
            value: "true"
          - name: DISABLE_SIGNUPS
            value: "false"
          - name: MEILI_ADDR
            value: http://karakeep-meilisearch:7700
          - name: OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING
            value: "true"
          - name: OAUTH_AUTO_REDIRECT
            value: "true"
          - name: OAUTH_PROVIDER_NAME
            value: authentik
          - name: OAUTH_SCOPE
            value: openid email profile
          - name: OAUTH_WELLKNOWN_URL
            value: https://idp.stadthagen.dev/application/o/karakeep/.well-known/openid-configuration
          envFrom:
          - secretRef:
              name: karakeep
          - secretRef:
              name: karakeep-meilesearch
          image: ghcr.io/karakeep-app/karakeep:0.33.1
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
          name: karakeep
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 512Mi
          volumeMounts:
          - mountPath: /data
            name: data
  volumeClaimTemplates: 
    - metadata:
        annotations:
          longhorn.io/numberOfReplicas: "2"
        name: data
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
        storageClassName: longhorn
