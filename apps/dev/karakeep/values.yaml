# GitOps values — regenerate helm-manifest.yaml after edits:
# helm template karakeep ./charts/karakeep -f values.yaml --namespace karakeep > helm-manifest.yaml
applicationProtocol: https
applicationHost: karakeep.stadthagen.dev
# Secrets come from SecretSpec (do not auto-generate)
applicationSecretKey: null
meilisearchMasterKey: null

controllers:
  karakeep:
    type: statefulset
    replicas: 1
    containers:
      karakeep:
        image:
          repository: ghcr.io/karakeep-app/karakeep
          tag: "0.33.1"
          pullPolicy: IfNotPresent
        env:
          # Host-aware OAuth (LAN + karakeep-ext): do not pin NEXTAUTH_URL
          NEXTAUTH_URL: null
          AUTH_TRUST_HOST: "true"
          DATA_DIR: /data
          MEILI_ADDR: "http://karakeep-meilisearch:7700"
          BROWSER_WEB_URL: "http://karakeep-chrome:9222"
          DISABLE_PASSWORD_AUTH: "true"
          DISABLE_SIGNUPS: "false"
          OAUTH_AUTO_REDIRECT: "true"
          OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: "true"
          OAUTH_PROVIDER_NAME: authentik
          OAUTH_SCOPE: "openid email profile"
          OAUTH_WELLKNOWN_URL: "https://idp.stadthagen.dev/application/o/karakeep/.well-known/openid-configuration"
          # OAUTH_CLIENT_ID / OAUTH_CLIENT_SECRET / NEXTAUTH_SECRET via secretRef karakeep
        envFrom:
          - secretRef:
              name: karakeep
          - secretRef:
              name: karakeep-meilesearch
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              initialDelaySeconds: 10
              httpGet:
                path: /api/health
                port: 3000
          readiness:
            enabled: true
            custom: true
            spec:
              initialDelaySeconds: 10
              httpGet:
                path: /api/health
                port: 3000
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
    statefulset:
      volumeClaimTemplates:
        - name: data
          accessMode: ReadWriteOnce
          size: 5Gi
          storageClass: longhorn
          annotations:
            longhorn.io/numberOfReplicas: "2"
          globalMounts:
            - path: /data

  chrome:
    containers:
      chrome:
        image:
          repository: zenika/alpine-chrome
          tag: "124"
          pullPolicy: IfNotPresent
        args:
          - --remote-debugging-address=0.0.0.0
          - --remote-debugging-port=9222
          - --headless
          - --hide-scrollbars
          - --disable-gpu
          - --disable-dev-shm-usage
        probes:
          liveness:
            enabled: true
            spec:
              httpGet:
                path: /
                port: 9222
          readiness:
            enabled: true
            spec:
              httpGet:
                path: /
                port: 9222
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
              - SYS_ADMIN
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        resources:
          requests:
            memory: 100Mi
            cpu: 100m
          limits:
            memory: 1Gi
            cpu: "1"

service:
  karakeep:
    controller: karakeep
    ports:
      http:
        port: 3000
  chrome:
    controller: chrome
    ports:
      http:
        port: 9222

# Managed by SecretSpec / k3s_secrets — do not render chart Secrets
secrets:
  karakeep:
    enabled: false
  meilesearch:
    enabled: false

# Use Traefik IngressRoute (plain YAML), not chart Ingress
ingress:
  karakeep:
    enabled: false

persistence:
  chrome-tmp:
    type: emptyDir
    advancedMounts:
      chrome:
        chrome:
          - path: /tmp
            readonly: false

meilisearch:
  auth:
    existingMasterKeySecret: karakeep-meilesearch
  environment:
    MEILI_ENV: production
  persistence:
    enabled: true
    size: 2Gi
    storageClass: longhorn
  # skip helm test pod noise in Argo
  tests:
    enabled: false
