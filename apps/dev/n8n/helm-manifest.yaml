# Source: n8n/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
  labels:
    helm.sh/chart: n8n-2.1.1
    app.kubernetes.io/name: n8n
    app.kubernetes.io/instance: n8n
    app.kubernetes.io/version: "2.36.8"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
      app.kubernetes.io/instance: n8n
      app.kubernetes.io/type: master
  template:
    metadata:
      annotations:
        checksum/config: df4f8e8901ea93f8f14287066677ee4257e73ba74853ff35e946f378de1f1074
      labels:
        app.kubernetes.io/name: n8n
        app.kubernetes.io/instance: n8n
        app.kubernetes.io/type: master
    spec:
      serviceAccountName: n8n
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      # hostPath /var/lib/n8n-data is DirectoryOrCreate as root — chown before n8n (UID 1000) starts
      initContainers:
        - name: volume-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /home/node/.n8n"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
      containers:
        - name: n8n
          securityContext:
            {}
          image: "n8nio/n8n:2.44.0"
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: n8n-app-config
          env: 
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: n8n-db
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  key: N8N_ENCRYPTION_KEY
                  name: n8n-app
            - name: N8N_PORT
              value: "5678"
            - name: N8N_SMTP_PASS
              valueFrom:
                secretKeyRef:
                  key: password
                  name: n8n-smtp
          lifecycle:
            {}
          ports:
            - name: http
              containerPort: 5678
              protocol: TCP
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz/readiness
              port: http
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
      nodeSelector:
        kubernetes.io/hostname: nxk3-w01
      terminationGracePeriodSeconds: 30
      volumes:
        - name: "data"
          persistentVolumeClaim:
            claimName: n8n-data
