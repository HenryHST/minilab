apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: n8n
  namespace: n8n
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    # Webhooks / forms without ForwardAuth (external hooks must not hit SSO)
    - match: Host(`n8n.stadthagen.dev`) && (PathPrefix(`/webhook`) || PathPrefix(`/webhook-test`) || PathPrefix(`/form`))
      kind: Rule
      priority: 100
      services:
        - name: n8n
          port: 5678
    # UI + everything else behind Authentik
    - match: Host(`n8n.stadthagen.dev`)
      kind: Rule
      priority: 10
      services:
        - name: n8n
          port: 5678
      middlewares:
        - name: n8n-authentik
  tls:
    secretName: n8n-tls
