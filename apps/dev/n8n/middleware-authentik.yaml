# Traefik ForwardAuth → Authentik Outpost for n8n.stadthagen.dev
# Prerequisite: Day-0 blueprint day0-n8n → Service ak-outpost-n8n
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: n8n-authentik
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: n8n
spec:
  forwardAuth:
    address: http://ak-outpost-n8n.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
