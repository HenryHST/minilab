# Migrated from Traefik IngressRoute → Cilium Gateway API HTTPRoute.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateway-tls-omni-tools-tls
  namespace: omnitools
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: gateway-system
  to:
  - group: ''
    kind: Secret
    name: omni-tools-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: omni-tools
  namespace: omnitools
  labels:
    app.kubernetes.io/name: omni-tools
    app.kubernetes.io/part-of: omnitools
spec:
  parentRefs:
  - name: nxk3
    namespace: gateway-system
    sectionName: https-omni-tools
  hostnames:
  - omni-tools.stadthagen.dev
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: omni-tools
      port: 80
