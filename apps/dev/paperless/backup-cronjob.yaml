---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-runner
  namespace: paperless
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-runner-role
  namespace: paperless
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-runner-rolebinding
  namespace: paperless
subjects:
  - kind: ServiceAccount
    name: backup-runner
    namespace: paperless
roleRef:
  kind: Role
  name: backup-runner-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: paperless-backups-nfs
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=3
    - nolock
  nfs:
    server: 192.168.0.25
    path: /var/nfs/shared/infra01/paperless-backups
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-backups
  namespace: paperless
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: paperless-backups-nfs
  resources:
    requests:
      storage: 50Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-backup-cron
  namespace: paperless
spec:
  schedule: "0 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: backup-runner
          imagePullSecrets:
            - name: registry-pull
          # k8s-toolbox is linux/amd64 — avoid Pi ImagePullBackOff / edge aarch64 apk
          nodeSelector:
            worker: "true"
            kubernetes.io/arch: amd64
          restartPolicy: Never
          containers:
            - name: trigger-backup
              image: git.stadthagen.dev/ops/k8s-toolbox:1.0.0
              env:
                - name: PGHOST
                  value: paperless-pg-rw
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: paperless
                - name: PGDATABASE
                  value: paperless
                - name: PGSSLMODE
                  value: require
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: paperless-db
                      key: password
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  # paperless-pg is CNPG 18.x; package lives on Alpine edge (not default toolbox repos)
                  apk add --no-cache \
                    --repository=https://dl-cdn.alpinelinux.org/alpine/edge/main \
                    --repository=https://dl-cdn.alpinelinux.org/alpine/edge/community \
                    postgresql18-client >/dev/null
                  STAMP="$(date -u +%Y%m%d-%H%M%S)"
                  OUT_DIR="/backup/paperless-${STAMP}"
                  mkdir -p "${OUT_DIR}"
                  # Avoid jsonpath {.items[0]} on empty list (fails under set -e)
                  WEB_POD="$(kubectl -n paperless get pod -l app=paperless \
                    --field-selector=status.phase=Running \
                    -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | head -n1 || true)"
                  if [[ -z "${WEB_POD}" ]]; then
                    echo "Missing Running paperless pod (app=paperless) — is redis up?" >&2
                    exit 1
                  fi
                  echo "Waiting for postgres..."
                  until pg_isready -h "${PGHOST}" -U "${PGUSER}" -d "${PGDATABASE}" -q; do sleep 2; done
                  echo "pg_dump ${PGDATABASE}@${PGHOST}"
                  pg_dump -Fc > "${OUT_DIR}/paperless.dump"
                  echo "media+data from ${WEB_POD}"
                  kubectl -n paperless exec "${WEB_POD}" -c paperless -- \
                    tar czf - -C /usr/src/paperless data media > "${OUT_DIR}/data-media.tar.gz"
                  tar czf "/backup/paperless-${STAMP}.tar.gz" -C /backup "paperless-${STAMP}"
                  rm -rf "${OUT_DIR}"
                  ls -lh "/backup/paperless-${STAMP}.tar.gz"
                  ls -1t /backup/paperless-*.tar.gz 2>/dev/null | tail -n +8 | xargs -r rm -f
                  echo "Done."
                  ls -1t /backup/paperless-*.tar.gz 2>/dev/null || true
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: paperless-backups
