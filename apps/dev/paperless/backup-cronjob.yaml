---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-runner
  namespace: paperless
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-runner-role
  namespace: paperless
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-runner-rolebinding
  namespace: paperless
subjects:
  - kind: ServiceAccount
    name: backup-runner
    namespace: paperless
roleRef:
  kind: Role
  name: backup-runner-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: paperless-backups-nfs
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=3
    - nolock
  nfs:
    server: 192.168.0.25
    path: /var/nfs/shared/infra01/paperless-backups
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-backups
  namespace: paperless
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: paperless-backups-nfs
  resources:
    requests:
      storage: 50Gi
---
# Strategy C: document_exporter ZIP → NFS (canonical DR). CNPG ScheduledBackup stays separate.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-backup-cron
  namespace: paperless
spec:
  schedule: "0 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      template:
        spec:
          serviceAccountName: backup-runner
          imagePullSecrets:
            - name: registry-pull
          # k8s-toolbox is linux/amd64 — avoid Pi ImagePullBackOff / edge aarch64 apk
          nodeSelector:
            worker: "true"
            kubernetes.io/arch: amd64
          restartPolicy: Never
          containers:
            - name: trigger-backup
              image: git.stadthagen.dev/ops/k8s-toolbox:1.0.1
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  NS=paperless
                  STAMP="$(date -u +%Y%m%d-%H%M%S)"
                  ZIP_BASE="paperless-${STAMP}"
                  ZIP_NAME="${ZIP_BASE}.zip"
                  WEB_POD="$(kubectl -n "${NS}" get pod -l app=paperless \
                    --field-selector=status.phase=Running \
                    -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | head -n1 || true)"
                  if [[ -z "${WEB_POD}" ]]; then
                    echo "Missing Running paperless pod (app=paperless) — is redis up?" >&2
                    exit 1
                  fi
                  IMAGE="$(kubectl -n "${NS}" get pod "${WEB_POD}" \
                    -o jsonpath='{.spec.containers[?(@.name=="paperless")].image}')"
                  echo "Exporter on ${WEB_POD} image=${IMAGE}"
                  kubectl -n "${NS}" exec "${WEB_POD}" -c paperless -- \
                    document_exporter /usr/src/paperless/export \
                      -z -zn "${ZIP_BASE}" --no-progress-bar
                  kubectl -n "${NS}" cp -c paperless \
                    "${NS}/${WEB_POD}:/usr/src/paperless/export/${ZIP_NAME}" \
                    "/backup/${ZIP_NAME}"
                  {
                    echo "stamp=${STAMP}"
                    echo "image=${IMAGE}"
                    echo "archive=${ZIP_NAME}"
                    echo "tool=document_exporter"
                    echo "created_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  } > "/backup/${ZIP_BASE}.meta"
                  kubectl -n "${NS}" exec "${WEB_POD}" -c paperless -- \
                    rm -f "/usr/src/paperless/export/${ZIP_NAME}"
                  ls -lh "/backup/${ZIP_NAME}" "/backup/${ZIP_BASE}.meta"
                  ls -1t /backup/paperless-*.zip 2>/dev/null | tail -n +8 | while read -r old; do
                    base="${old%.zip}"
                    rm -f "${old}" "${base}.meta"
                  done
                  ls -1t /backup/paperless-*.tar.gz 2>/dev/null | xargs -r rm -f
                  echo "Done."
                  ls -1t /backup/paperless-*.zip 2>/dev/null || true
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: paperless-backups
