---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-runner
  namespace: paperless
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-runner-role
  namespace: paperless
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-runner-rolebinding
  namespace: paperless
subjects:
  - kind: ServiceAccount
    name: backup-runner
    namespace: paperless
roleRef:
  kind: Role
  name: backup-runner-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: paperless-backups-nfs
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=3
    - nolock
  nfs:
    server: 192.168.0.25
    path: /var/nfs/shared/infra01/paperless-backups
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-backups
  namespace: paperless
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: paperless-backups-nfs
  resources:
    requests:
      storage: 50Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-backup-cron
  namespace: paperless
spec:
  schedule: "0 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: backup-runner
          restartPolicy: Never
          containers:
            - name: trigger-backup
              image: alpine/k8s:1.32.0
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: paperless-db
                      key: POSTGRES_PASSWORD
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  STAMP="$(date -u +%Y%m%d-%H%M%S)"
                  OUT_DIR="/backup/paperless-${STAMP}"
                  mkdir -p "${OUT_DIR}"
                  PG_POD="$(kubectl -n paperless get pod -l app=paperless-postgres -o jsonpath='{.items[0].metadata.name}')"
                  WEB_POD="$(kubectl -n paperless get pod -l app=paperless -o jsonpath='{.items[0].metadata.name}')"
                  if [[ -z "${PG_POD}" || -z "${WEB_POD}" ]]; then
                    echo "Missing postgres or paperless pod" >&2
                    exit 1
                  fi
                  echo "pg_dump from ${PG_POD}"
                  kubectl -n paperless exec "${PG_POD}" -c postgres -- \
                    pg_dump -U paperless -d paperless -Fc > "${OUT_DIR}/paperless.dump"
                  echo "media+data from ${WEB_POD}"
                  kubectl -n paperless exec "${WEB_POD}" -c paperless -- \
                    tar czf - -C /usr/src/paperless data media > "${OUT_DIR}/data-media.tar.gz"
                  tar czf "/backup/paperless-${STAMP}.tar.gz" -C /backup "paperless-${STAMP}"
                  rm -rf "${OUT_DIR}"
                  ls -lh "/backup/paperless-${STAMP}.tar.gz"
                  ls -1t /backup/paperless-*.tar.gz 2>/dev/null | tail -n +8 | xargs -r rm -f
                  echo "Done."
                  ls -1t /backup/paperless-*.tar.gz 2>/dev/null || true
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: paperless-backups
