# Paperless Postgres on CloudNativePG. The one-shot import from paperless-postgres
# is done and removed: a recreated volume must not dial that Service again.
# Recovery point is a Longhorn VolumeSnapshot (ScheduledBackup paperless-pg-snapshot).
# The pg_dump CronJob remains the off-cluster copy.
# hostPath /var/lib/paperless-postgres on nxk3-w01 stays on disk as rollback.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperless-pg
  namespace: paperless
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: paperless
    app.kubernetes.io/part-of: paperless
    app.kubernetes.io/component: postgresql
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  # Server TLS from cert-manager (cnpg-certificates.yaml); client/replication stay operator-managed.
  certificates:
    serverCASecret: paperless-pg-server-tls
    serverTLSSecret: paperless-pg-server-tls
  bootstrap:
    initdb:
      database: paperless
      owner: paperless
      secret:
        name: paperless-db
  storage:
    size: 8Gi
    storageClass: longhorn
  monitoring:
    enablePodMonitor: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  backup:
    target: primary
    volumeSnapshot:
      className: longhorn
      online: true
      snapshotOwnerReference: backup
