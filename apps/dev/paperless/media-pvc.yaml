# Local hostPath volumes on nxk3-w01 (Longhorn disk shortage — same approach as termix).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: paperless-data-host
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-paperless
  local:
    path: /var/lib/paperless-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - nxk3-w01
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-data
  namespace: paperless
  labels:
    app: paperless
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual-paperless
  volumeName: paperless-data-host
  resources:
    requests:
      storage: 5Gi
