# Ingress from Traefik + same namespace. Egress left open (OIDC, SMTP, Redis NS, NFS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paperless-ingress
  namespace: paperless
  labels:
    app: paperless
spec:
  podSelector:
    matchLabels:
      app: paperless
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: paperless
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pangolin-publish
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
