# Celery workers for OCR/tasks — colocated with web (RWO Longhorn media/data).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-worker
  namespace: paperless
  labels:
    app: paperless-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-worker
  template:
    metadata:
      labels:
        app: paperless-worker
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      nodeSelector:
        kubernetes.io/hostname: nxk3-w01
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: paperless
              topologyKey: kubernetes.io/hostname
      containers:
        - name: worker
          image: ghcr.io/paperless-ngx/paperless-ngx:3.0.0
          imagePullPolicy: IfNotPresent
          # Bypass s6 multi-service boot — `args: [worker]` exits with "worker: not found"
          # after init and kills the container. Run Celery directly (same as svc-worker).
          command:
            - /usr/bin/bash
            - -ce
            - |
              until nc -z paperless-postgres 5432; do echo waiting-for-postgres; sleep 3; done
              until nc -z redis.redis.svc.cluster.local 6379; do echo waiting-for-redis; sleep 3; done
              cd /usr/src/paperless/src
              export HOME=/usr/src/paperless
              exec s6-setuidgid paperless /usr/local/bin/celery \
                --app paperless worker --loglevel INFO --without-mingle --without-gossip
          env:
            - name: PAPERLESS_DBHOST
              value: paperless-postgres
            - name: PAPERLESS_DBNAME
              value: paperless
            - name: PAPERLESS_DBUSER
              value: paperless
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: paperless-db
                  key: POSTGRES_PASSWORD
            - name: PAPERLESS_REDIS
              value: redis://redis.redis.svc.cluster.local:6379/0
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-app
                  key: PAPERLESS_SECRET_KEY
            - name: PAPERLESS_URL
              value: https://paperless.stadthagen.dev
            - name: PAPERLESS_TIME_ZONE
              value: Europe/Berlin
            - name: PAPERLESS_OCR_LANGUAGE
              value: deu+eng
            - name: PAPERLESS_OCR_LANGUAGES
              value: deu eng
            - name: PAPERLESS_TIKA_ENABLED
              value: "1"
            - name: PAPERLESS_TIKA_ENDPOINT
              value: http://paperless-tika:9998
            - name: PAPERLESS_TIKA_GOTENBERG_ENDPOINT
              value: http://paperless-gotenberg:3000
            - name: USERMAP_UID
              value: "1000"
            - name: USERMAP_GID
              value: "1000"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-data
        - name: media
          persistentVolumeClaim:
            claimName: paperless-media
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: paperless-worker
  namespace: paperless
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: paperless-worker
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
