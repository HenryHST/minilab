apiVersion: v1
kind: Service
metadata:
  name: paperless-web
  namespace: paperless
  labels:
    app: paperless
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
  selector:
    app: paperless
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless
  labels:
    app: paperless
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paperless
  template:
    metadata:
      labels:
        app: paperless
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      nodeSelector:
        kubernetes.io/hostname: nxk3-w01
      initContainers:
        - name: wait-for-db
          image: busybox:1.37
          command:
            - sh
            - -c
            - until nc -z paperless-pg-rw 5432; do echo waiting-for-postgres; sleep 3; done
        - name: wait-for-redis
          image: busybox:1.37
          command:
            - sh
            - -c
            - until nc -z redis.redis.svc.cluster.local 6379; do echo waiting-for-redis; sleep 3; done
      containers:
        - name: paperless
          image: ghcr.io/paperless-ngx/paperless-ngx:3.4.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PAPERLESS_DBENGINE
              value: postgresql
            - name: PAPERLESS_DBHOST
              value: paperless-pg-rw
            - name: PAPERLESS_DB_OPTIONS
              value: sslmode=require
            - name: PAPERLESS_DBNAME
              value: paperless
            - name: PAPERLESS_DBUSER
              value: paperless
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: paperless-db
                  key: POSTGRES_PASSWORD
            - name: PAPERLESS_REDIS
              value: redis://redis.redis.svc.cluster.local:6379/0
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-app
                  key: PAPERLESS_SECRET_KEY
            - name: PAPERLESS_URL
              value: https://paperless.stadthagen.dev
            - name: PAPERLESS_CSRF_TRUSTED_ORIGINS
              value: https://paperless.stadthagen.dev,https://paperless-ext.stadthagen.dev
            - name: PAPERLESS_ALLOWED_HOSTS
              value: paperless.stadthagen.dev,paperless-ext.stadthagen.dev
            - name: PAPERLESS_CORS_ALLOWED_HOSTS
              value: https://paperless.stadthagen.dev,https://paperless-ext.stadthagen.dev
            - name: PAPERLESS_TIME_ZONE
              value: Europe/Berlin
            - name: PAPERLESS_OCR_LANGUAGE
              value: deu+eng
            - name: PAPERLESS_OCR_LANGUAGES
              value: deu eng
            # Explicit upstream defaults — deskew disabled automatically if OCR_MODE=redo
            - name: PAPERLESS_OCR_DESKEW
              value: "true"
            - name: PAPERLESS_OCR_ROTATE_PAGES
              value: "true"
            - name: PAPERLESS_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: paperless-app
                  key: PAPERLESS_ADMIN_USER
            - name: PAPERLESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless-app
                  key: PAPERLESS_ADMIN_PASSWORD
            - name: PAPERLESS_ADMIN_MAIL
              value: admin@stadthagen.dev
            - name: PAPERLESS_EMAIL_HOST
              value: mail.henrystadthagen.de
            - name: PAPERLESS_EMAIL_PORT
              value: "465"
            - name: PAPERLESS_EMAIL_HOST_USER
              value: auto@henrystadthagen.de
            - name: PAPERLESS_EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless-smtp
                  key: password
            - name: PAPERLESS_EMAIL_FROM
              value: paperless@stadthagen.dev
            - name: PAPERLESS_EMAIL_USE_SSL
              value: "true"
            - name: PAPERLESS_EMAIL_USE_TLS
              value: "false"
            - name: PAPERLESS_APPS
              value: allauth.socialaccount.providers.openid_connect
            - name: PAPERLESS_SOCIALACCOUNT_PROVIDERS
              valueFrom:
                secretKeyRef:
                  name: paperless-oauth
                  key: PAPERLESS_SOCIALACCOUNT_PROVIDERS
            - name: PAPERLESS_ACCOUNT_DEFAULT_HTTP_PROTOCOL
              value: https
            # Map Authentik groups claim → Django (access + familie_*/vs-nfd; groups must exist — inbox-tag-job)
            - name: PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS
              value: "true"
            - name: PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS_CLAIM
              value: groups
            - name: PAPERLESS_SOCIAL_ACCOUNT_SYNC_STAFF_GROUP
              value: paperless_admins
            - name: PAPERLESS_SOCIAL_ACCOUNT_SYNC_SUPERUSER_GROUP
              value: paperless_admins
            - name: PAPERLESS_SOCIAL_ACCOUNT_DEFAULT_GROUPS
              value: paperless_users
            - name: PAPERLESS_TIKA_ENABLED
              value: "1"
            - name: PAPERLESS_TIKA_ENDPOINT
              value: http://paperless-tika:9998
            - name: PAPERLESS_TIKA_GOTENBERG_ENDPOINT
              value: http://paperless-gotenberg:3000
            # v3: CONSUMER_POLLING renamed
            - name: PAPERLESS_CONSUMER_POLLING_INTERVAL
              value: "60"
            - name: PAPERLESS_FILENAME_FORMAT
              value: "{{created_year}}_{{correspondent}}_{{title}}"
            - name: USERMAP_UID
              value: "1000"
            - name: USERMAP_GID
              value: "1000"
            # Extra OCR capacity comes from paperless-worker HPA
            - name: PAPERLESS_TASK_WORKERS
              value: "1"
            # Mail/consume scratch must be shared with paperless-worker (not pod-local /tmp)
            - name: PAPERLESS_SCRATCH_DIR
              value: /usr/src/paperless/data/scratch
          # NFS consume chown + migrations can take >2m on first/cold start.
          # Host header required — Django rejects probes that use the pod IP.
          readinessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: paperless.stadthagen.dev
            initialDelaySeconds: 120
            periodSeconds: 10
            failureThreshold: 36
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: paperless.stadthagen.dev
            initialDelaySeconds: 300
            periodSeconds: 30
            failureThreshold: 6
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
            - name: export
              mountPath: /usr/src/paperless/export
            - name: consume
              mountPath: /usr/src/paperless/consume
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-data
        - name: media
          persistentVolumeClaim:
            claimName: paperless-media
        - name: export
          persistentVolumeClaim:
            claimName: paperless-export
        - name: consume
          persistentVolumeClaim:
            claimName: paperless-consume
