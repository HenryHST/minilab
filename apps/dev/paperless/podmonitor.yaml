# Metrics for paperless-pg. Replaces deprecated Cluster monitoring.enablePodMonitor
# (that field omits release: kube-prometheus-stack and would not be scraped).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: paperless-pg-instances
  namespace: paperless
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: paperless
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: paperless-pg
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
