# Six-field cron (seconds first). Every 6 hours, :15. RPO is that interval.
# Consistent Longhorn snapshot, not WAL PITR. pg_dump CronJob stays the off-cluster copy.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: paperless-pg-snapshot
  namespace: paperless
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: paperless
    app.kubernetes.io/part-of: paperless
spec:
  schedule: "0 15 */6 * * *"
  immediate: true
  method: volumeSnapshot
  backupOwnerReference: cluster
  cluster:
    name: paperless-pg
  target: primary
  online: true
