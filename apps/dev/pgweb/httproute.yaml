# Migrated from Traefik IngressRoute → Cilium Gateway API HTTPRoute.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateway-tls-pgweb-tls
  namespace: pgweb
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: gateway-system
  to:
  - group: ''
    kind: Secret
    name: pgweb-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pgweb
  namespace: pgweb
  labels:
    app.kubernetes.io/name: pgweb
    app.kubernetes.io/part-of: pgweb
spec:
  parentRefs:
  - name: nxk3
    namespace: gateway-system
    sectionName: https-pgweb
  hostnames:
  - pgweb.stadthagen.dev
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: pgweb
      port: 8081
