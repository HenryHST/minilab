apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: podcraft-stadthagen-dev
  namespace: podcraft
  labels:
    app: podcraft
spec:
  secretName: podcraft-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - podcraft.stadthagen.dev
  privateKey:
    rotationPolicy: Always
