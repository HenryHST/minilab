apiVersion: v1
kind: ConfigMap
metadata:
  name: podcraft-workloads
  namespace: podcraft
  labels:
    app: podcraft
data:
  workloads.json: |
    {
      "workloads": [
        {
          "id": "drawio",
          "namespace": "drawio",
          "deployment": "drawio",
          "target_replicas": 1,
          "schedule": true,
          "description": "diagrams.net",
          "icon": "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/diagramsnet.png"
        },
        {
          "id": "it-tools",
          "namespace": "it-tools",
          "deployment": "it-tools",
          "target_replicas": 1,
          "schedule": true,
          "description": "IT Tools",
          "icon": "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/it-tools.png"
        }
      ]
    }
