# Migrated from Traefik IngressRoute / Authentik ExternalAuth.
# Native OIDC in-app: no ExternalAuth, no outpost paths.
# Rule order: Basic workloads → public shell/auth → catch-all API/SPA.
# Restore API /api/v1/restore must NEVER match the Basic bypass — only workloads PathPrefix + Basic header.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateway-tls-podcraft-tls
  namespace: podcraft
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: gateway-system
  to:
    - group: ""
      kind: Secret
      name: podcraft-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podcraft
  namespace: podcraft
  labels:
    app.kubernetes.io/name: podcraft
    app.kubernetes.io/part-of: podcraft
spec:
  parentRefs:
    - name: nxk3
      namespace: gateway-system
      sectionName: https-podcraft
  hostnames:
    - podcraft.stadthagen.dev
  rules:
    # HA machine clients: Basic Authorization (no OIDC session).
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/workloads
          headers:
            - name: Authorization
              type: RegularExpression
              value: "[Bb]asic.+"
      backendRefs:
        - name: podcraft
          port: 8080
    # Public shell, assets, health, OIDC endpoints.
    - matches:
        - path:
            type: Exact
            value: /
        - path:
            type: Exact
            value: /login
        - path:
            type: Exact
            value: /settings
        - path:
            type: Exact
            value: /schedule
        - path:
            type: Exact
            value: /logs
        - path:
            type: PathPrefix
            value: /restore
        - path:
            type: PathPrefix
            value: /static
        - path:
            type: Exact
            value: /healthz
        - path:
            type: PathPrefix
            value: /auth
      backendRefs:
        - name: podcraft
          port: 8080
    # API + SPA catch-all (session cookie enforced in FastAPI).
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: podcraft
          port: 8080
