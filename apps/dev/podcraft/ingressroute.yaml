apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: podcraft
  namespace: podcraft
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`podcraft.stadthagen.dev`)
      kind: Rule
      middlewares:
        - name: podcraft-authentik
      services:
        - name: podcraft
          port: 8080
  tls:
    secretName: podcraft-tls
