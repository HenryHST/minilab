apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: podcraft
  namespace: podcraft
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    # HA machine clients only: Basic Authorization + LAN allowlist (no ForwardAuth).
    # Browser OIDC has no Basic header → falls through to Authentik route below.
    - match: Host(`podcraft.stadthagen.dev`) && PathPrefix(`/api/v1/workloads`) && HeaderRegexp(`Authorization`, `(?i)^Basic `)
      kind: Rule
      priority: 30
      middlewares:
        - name: podcraft-api-allowlist
      services:
        - name: podcraft
          port: 8080
    # Browser UI + OIDC APIs (including /api/v1/workloads without Basic)
    - match: Host(`podcraft.stadthagen.dev`)
      kind: Rule
      priority: 10
      middlewares:
        - name: podcraft-authentik
      services:
        - name: podcraft
          port: 8080
  tls:
    secretName: podcraft-tls
