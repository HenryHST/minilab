apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: podcraft
  namespace: podcraft
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    # HA machine clients only: Basic Authorization + LAN allowlist (no ForwardAuth).
    - match: Host(`podcraft.stadthagen.dev`) && PathPrefix(`/api/v1/workloads`) && HeaderRegexp(`Authorization`, `(?i)^Basic `)
      kind: Rule
      priority: 40
      middlewares:
        - name: podcraft-api-allowlist
      services:
        - name: podcraft
          port: 8080
    # Public shell + assets so Pulse can show its login screen (Authentik button).
    - match: Host(`podcraft.stadthagen.dev`) && (Path(`/`) || Path(`/login`) || PathPrefix(`/static`) || Path(`/healthz`))
      kind: Rule
      priority: 30
      services:
        - name: podcraft
          port: 8080
    # Browser OIDC: API + authenticated SPA routes (ForwardAuth).
    - match: Host(`podcraft.stadthagen.dev`)
      kind: Rule
      priority: 10
      middlewares:
        - name: podcraft-authentik
      services:
        - name: podcraft
          port: 8080
  tls:
    secretName: podcraft-tls
