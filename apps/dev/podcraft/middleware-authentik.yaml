# Traefik ForwardAuth → Authentik Outpost for podcraft.stadthagen.dev
# Prerequisite: Day-0 blueprint day0-podcraft → Service ak-outpost-podcraft
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: podcraft-authentik
  namespace: podcraft
  labels:
    app: podcraft
spec:
  forwardAuth:
    address: http://ak-outpost-podcraft.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
