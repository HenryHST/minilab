apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: podcraft-ingress
  namespace: podcraft
  labels:
    app: podcraft
spec:
  podSelector:
    matchLabels:
      app: podcraft
  policyTypes:
    - Ingress
  ingress:
    # Cilium Gateway edge (Envoy uses reserved:ingress/host — not kube-system pods)
    - ports:
        - protocol: TCP
          port: 8080
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: podcraft-egress
  namespace: podcraft
  labels:
    app: podcraft
spec:
  endpointSelector:
    matchLabels:
      app: podcraft
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: node-local-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    # UniFi NFS for Vaultwarden backup archives (RO mount /backup)
    - toCIDRSet:
        - cidr: 192.168.0.25/32
      toPorts:
        - ports:
            - port: "2049"
              protocol: TCP
            - port: "2049"
              protocol: UDP
