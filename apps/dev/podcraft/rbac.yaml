apiVersion: v1
kind: ServiceAccount
metadata:
  name: podcraft
  namespace: podcraft
  labels:
    app: podcraft
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: podcraft-ha-basic
  namespace: podcraft
  labels:
    app: podcraft
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["podcraft-ha-basic"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: podcraft-ha-basic
  namespace: podcraft
  labels:
    app: podcraft
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: podcraft-ha-basic
subjects:
  - kind: ServiceAccount
    name: podcraft
    namespace: podcraft
