apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-demo
  namespace: {{ .Release.Namespace }}
  labels:
    app: registry-demo
    app.kubernetes.io/name: registry-demo
    app.kubernetes.io/part-of: registry-demo
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: registry-demo
  template:
    metadata:
      labels:
        app: registry-demo
        app.kubernetes.io/name: registry-demo
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
