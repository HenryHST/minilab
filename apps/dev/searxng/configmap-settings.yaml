apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: searxng
data:
  settings.yml: |
    use_default_settings:
      engines:
        keep_only:
          - brave
          - duckduckgo
          - qwant
          - wiby
          - seznam
          - naver
          - yandex
          - wikipedia
          - wikidata
          - youtube
          - imdb
          - geizhals
          - annas archive
          - github
          - gitlab
          - stackoverflow
          - huggingface
    general:
      instance_name: "SearXNG Homelab"
      # Required by wikipedia/wikidata engines (MediaWiki etiquette)
      contact_url: "https://searxng.stadthagen.dev/"
      enable_metrics: false
    server:
      base_url: https://searxng.stadthagen.dev/
      limiter: false
      image_proxy: true
    search:
      safe_search: 0
      autocomplete: "duckduckgo"
      favicon_resolver: "duckduckgo"
      default_lang: "de"
      formats:
        - html
    ui:
      default_locale: "de"
    engines:
      - name: brave
        disabled: false
      - name: qwant
        disabled: false
      - name: wiby
        disabled: false
      - name: seznam
        disabled: false
      - name: naver
        disabled: false
      - name: yandex
        disabled: false
      - name: gitlab
        disabled: false
      - name: huggingface
        disabled: false
      - name: annas archive
        disabled: false
      - name: geizhals
        disabled: false
      - name: imdb
        disabled: false
    plugins:
      searx.plugins.calculator.SXNGPlugin:
        active: true
      searx.plugins.unit_converter.SXNGPlugin:
        active: true
      searx.plugins.hash_plugin.SXNGPlugin:
        active: true
      searx.plugins.self_info.SXNGPlugin:
        active: true
      searx.plugins.tracker_url_remover.SXNGPlugin:
        active: true
      searx.plugins.ahmia_filter.SXNGPlugin:
        active: true
      searx.plugins.time_zone.SXNGPlugin:
        active: true
      searx.plugins.hostnames.SXNGPlugin:
        active: true
      searx.plugins.infinite_scroll.SXNGPlugin:
        active: true
      searx.plugins.oa_doi_rewrite.SXNGPlugin:
        active: true
      searx.plugins.tor_check.SXNGPlugin:
        active: false
    hostnames:
      high_priority:
        - '(.*\.)?wikipedia\.org$'
        - '(.*\.)?github\.com$'
        - '(.*\.)?stackoverflow\.com$'
        - '(.*\.)?archlinux\.org$'
        - '(.*\.)?docs\.python\.org$'
