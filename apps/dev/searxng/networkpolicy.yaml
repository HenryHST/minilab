# searxng: ingress allow Traefik + in-namespace (it-tools pattern).
# No Newt — LAN Traefik only. Egress left open (upstream search engines).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: searxng-ingress
  namespace: searxng
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/part-of: searxng
spec:
  podSelector:
    matchLabels:
      app: searxng
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: searxng
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080
