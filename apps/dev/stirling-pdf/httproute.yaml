# OCR / LibreOffice: request timeout 35m (was Traefik ServersTransport).
# Migrated from Traefik IngressRoute → Cilium Gateway API HTTPRoute.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateway-tls-stirling-pdf-tls
  namespace: stirling-pdf
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: gateway-system
  to:
  - group: ''
    kind: Secret
    name: stirling-pdf-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
  labels:
    app.kubernetes.io/name: stirling-pdf
    app.kubernetes.io/part-of: stirling-pdf
spec:
  parentRefs:
  - name: nxk3
    namespace: gateway-system
    sectionName: https-stirling-pdf
  hostnames:
  - stirling-pdf.stadthagen.dev
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: ExternalAuth
      externalAuth:
        protocol: HTTP
        backendRef:
          name: ak-outpost-stirling-pdf
          namespace: authentik
          port: 9000
        http:
          path: /outpost.goauthentik.io/auth/envoy
          allowedHeaders:
          - Cookie
          - Authorization
          allowedResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
    timeouts:
      request: 2100s
    backendRefs:
    - name: stirling-pdf
      port: 8080
