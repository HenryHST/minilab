# Do not use Traefik buffering for uploads: it fully buffers the request body in
# Traefik before forwarding and truncates multipart (Jetty: unexpected EOF in PREAMBLE).
# Size limit stays in the app (fileUploadLimit / SYSTEMFILEUPLOADLIMIT = 2GB).
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
spec:
  forwardingTimeouts:
    dialTimeout: 30s
    # OCR / LibreOffice can run up to processExecutor.timeoutMinutes (30)
    responseHeaderTimeout: 35m
    idleConnTimeout: 90s
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`stirling-pdf.stadthagen.dev`)
      kind: Rule
      services:
        - name: stirling-pdf
          port: 8080
          serversTransport: stirling-pdf
      middlewares:
        - name: stirling-pdf-authentik
  tls:
    secretName: stirling-pdf-tls
