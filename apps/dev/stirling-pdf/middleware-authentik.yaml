# Traefik ForwardAuth → Authentik Outpost for stirling-pdf.stadthagen.dev.
# Prerequisite: Day-0 blueprint day0-stirling-pdf → Service ak-outpost-stirling-pdf.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: stirling-pdf-authentik
  namespace: stirling-pdf
  labels:
    app.kubernetes.io/name: stirling-pdf
    app.kubernetes.io/part-of: stirling-pdf
spec:
  forwardAuth:
    address: http://ak-outpost-stirling-pdf.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
