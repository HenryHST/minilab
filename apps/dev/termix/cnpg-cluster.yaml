# Termix Postgres on CloudNativePG. The one-shot import from termix-postgres is done
# and removed: a recreated volume must not dial that Service again.
# Recovery point is a Longhorn VolumeSnapshot (ScheduledBackup termix-snapshot).
# The pg_dump CronJob remains the off-cluster copy.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: termix
  namespace: termix
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/name: termix
    app.kubernetes.io/part-of: termix
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  bootstrap:
    initdb:
      database: termix
      owner: termix
      secret:
        name: termix-db
  storage:
    size: 1Gi
    storageClass: longhorn
  # Deprecated field. false stops the operator-owned PodMonitor; podmonitor.yaml replaces it.
  monitoring:
    enablePodMonitor: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  backup:
    target: primary
    volumeSnapshot:
      className: longhorn
      online: true
      snapshotOwnerReference: backup
