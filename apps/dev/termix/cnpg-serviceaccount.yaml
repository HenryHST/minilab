# CNPG creates/uses a ServiceAccount named after the Cluster (`termix`).
# The Helm chart uses `termix-app` (see values.yaml) so it must not own this SA.
# Keep it in Git with Prune=false so Argo does not delete it after the Helm SA rename.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: termix
  namespace: termix
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    cnpg.io/cluster: termix
    app.kubernetes.io/name: termix
    app.kubernetes.io/part-of: termix
automountServiceAccountToken: true
