# LAN host redirects to vw-ext (DOMAIN / SSO / CSP require one public host).
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateway-tls-vaultwarden-tls
  namespace: vaultwarden
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: gateway-system
  to:
    - group: ""
      kind: Secret
      name: vaultwarden-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vaultwarden
  namespace: vaultwarden
  labels:
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/part-of: vaultwarden
spec:
  parentRefs:
    - name: nxk3
      namespace: gateway-system
      sectionName: https-vaultwarden
  hostnames:
    - vaultwarden.stadthagen.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: vw-ext.stadthagen.dev
            port: 443
            statusCode: 302
