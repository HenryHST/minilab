# LAN host proxies to nginx redirect → vw-ext (DOMAIN / SSO / CSP require one public host).
# Cilium returns 404 for RequestRedirect-only HTTPRoute rules (no backendRefs allowed with redirect).
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateway-tls-vaultwarden-tls
  namespace: vaultwarden
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: gateway-system
  to:
    - group: ""
      kind: Secret
      name: vaultwarden-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vaultwarden
  namespace: vaultwarden
  labels:
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/part-of: vaultwarden
spec:
  parentRefs:
    - name: nxk3
      namespace: gateway-system
      sectionName: https-vaultwarden
  hostnames:
    - vaultwarden.stadthagen.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: vaultwarden-lan-redirect
          port: 8080
