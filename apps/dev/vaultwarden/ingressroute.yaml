apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vaultwarden
  namespace: vaultwarden
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    # DOMAIN / SSO /api/config are vw-ext. Serving the web vault on LAN breaks CSP
    # (connect-src 'self' cannot call vw-ext → browser "Failed to fetch").
    - match: Host(`vaultwarden.stadthagen.dev`)
      kind: Rule
      middlewares:
        - name: sso-to-ext
        - name: default-headers
      services:
        - name: vaultwarden
          port: 80
  tls:
    secretName: vaultwarden-tls
