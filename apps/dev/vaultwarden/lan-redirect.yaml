# LAN host vaultwarden.stadthagen.dev → vw-ext (Cilium RequestRedirect-only rules 404).
apiVersion: v1
kind: ConfigMap
metadata:
  name: vaultwarden-lan-redirect
  namespace: vaultwarden
  labels:
    app.kubernetes.io/name: vaultwarden-lan-redirect
    app.kubernetes.io/part-of: vaultwarden
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      location / {
        return 302 https://vw-ext.stadthagen.dev$request_uri;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden-lan-redirect
  namespace: vaultwarden
  labels:
    app.kubernetes.io/name: vaultwarden-lan-redirect
    app.kubernetes.io/part-of: vaultwarden
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vaultwarden-lan-redirect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vaultwarden-lan-redirect
        app.kubernetes.io/part-of: vaultwarden
    spec:
      containers:
        - name: nginx
          image: mirror.gcr.io/library/nginx:1.27-alpine
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: conf
          configMap:
            name: vaultwarden-lan-redirect
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden-lan-redirect
  namespace: vaultwarden
  labels:
    app.kubernetes.io/name: vaultwarden-lan-redirect
    app.kubernetes.io/part-of: vaultwarden
spec:
  selector:
    app.kubernetes.io/name: vaultwarden-lan-redirect
  ports:
    - name: http
      port: 8080
      targetPort: http
