# Vaultwarden DOMAIN is https://vw-ext.stadthagen.dev. The web vault CSP only allows
# connect-src 'self', and SSO binding cookies are host-scoped — both require one host.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sso-to-ext
  namespace: vaultwarden
spec:
  redirectRegex:
    regex: ^https?://[^/]+/(.*)$
    replacement: https://vw-ext.stadthagen.dev/$1
    permanent: false
