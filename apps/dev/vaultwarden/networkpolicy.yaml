# Vaultwarden: ingress allow Cilium Gateway (open port) + Newt (Pangolin vw-ext) + in-namespace.
# Egress left open (Authentik OIDC, updates). Add *-egress from _templates when ready.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vaultwarden-ingress
  namespace: vaultwarden
  labels:
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/part-of: vaultwarden
spec:
  podSelector:
    matchLabels:
      app: vaultwarden
  policyTypes:
    - Ingress
  ingress:
    # Chart listens on ROCKET_PORT 8080 (Service :80 → targetPort http).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vaultwarden
      ports:
        - protocol: TCP
          port: 8080
    # Cilium Gateway edge (Envoy uses reserved:ingress/host — not kube-system pods)
    - ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: newt
      ports:
        - protocol: TCP
          port: 8080
