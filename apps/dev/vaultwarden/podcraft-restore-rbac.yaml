# Allows podcraft SA to create/observe restore Jobs and read Job pod logs in vaultwarden.
# Job pods keep SA vaultwarden-restore (scripts/PVCs). No secrets/exec/PVC verbs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: podcraft-restore
  namespace: vaultwarden
  labels:
    app: vaultwarden
    app.kubernetes.io/component: podcraft-restore
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: podcraft-restore
  namespace: vaultwarden
  labels:
    app: vaultwarden
    app.kubernetes.io/component: podcraft-restore
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: podcraft-restore
subjects:
  - kind: ServiceAccount
    name: podcraft
    namespace: podcraft
