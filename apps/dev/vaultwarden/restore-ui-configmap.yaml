# Restore UI sources (FastAPI + Jinja + Vaultwarden-look CSS). Mounted into the UI pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vaultwarden-restore-ui
  namespace: vaultwarden
  labels:
    app: vaultwarden-restore-ui
data:
  app.py: |
    import os
    import re
    import time
    from datetime import datetime, timezone
    from pathlib import Path

    from fastapi import FastAPI, Form, Request
    from fastapi.responses import HTMLResponse, RedirectResponse
    from fastapi.staticfiles import StaticFiles
    from fastapi.templating import Jinja2Templates
    from kubernetes import client, config
    from kubernetes.client.rest import ApiException

    BACKUP_DIR = Path(os.environ.get("BACKUP_DIR", "/backup"))
    NAMESPACE = os.environ.get("NAMESPACE", "vaultwarden")
    VW_REPLICAS = os.environ.get("VW_REPLICAS", "1")
    ARCHIVE_RE = re.compile(r"^vaultwarden-\d{8}-\d{6}\.tar\.gz$")

    app = FastAPI(title="Vaultwarden Restore")
    templates = Jinja2Templates(directory="/app/templates")
    app.mount("/static", StaticFiles(directory="/app/static"), name="static")

    def k8s():
        try:
            config.load_incluster_config()
        except config.ConfigException:
            config.load_kube_config()
        return client.BatchV1Api(), client.CoreV1Api()

    def list_archives():
        items = []
        if not BACKUP_DIR.is_dir():
            return items
        for p in BACKUP_DIR.glob("vaultwarden-*.tar.gz"):
            if not ARCHIVE_RE.match(p.name):
                continue
            st = p.stat()
            items.append(
                {
                    "name": p.name,
                    "size": st.st_size,
                    "size_h": _human(st.st_size),
                    "mtime": datetime.fromtimestamp(st.st_mtime, tz=timezone.utc),
                }
            )
        items.sort(key=lambda x: x["mtime"], reverse=True)
        return items

    def _human(n: int) -> str:
        for unit in ("B", "KB", "MB", "GB"):
            if n < 1024:
                return f"{n:.0f} {unit}" if unit == "B" else f"{n:.1f} {unit}"
            n /= 1024
        return f"{n:.1f} TB"

    def running_restore_jobs(batch: client.BatchV1Api):
        jobs = batch.list_namespaced_job(
            NAMESPACE, label_selector="app=vaultwarden-ui-restore"
        )
        active = []
        recent = []
        for j in jobs.items:
            name = j.metadata.name
            succeeded = (j.status.succeeded or 0) > 0
            failed = (j.status.failed or 0) > 0
            is_active = (j.status.active or 0) > 0
            entry = {
                "name": name,
                "succeeded": succeeded,
                "failed": failed,
                "active": is_active,
                "archive": (j.metadata.annotations or {}).get(
                    "vaultwarden.restore/archive", "?"
                ),
            }
            if is_active:
                active.append(entry)
            else:
                recent.append(entry)
        recent.sort(key=lambda x: x["name"], reverse=True)
        return active, recent[:5]

    def job_logs(core: client.CoreV1Api, job_name: str) -> str:
        pods = core.list_namespaced_pod(
            NAMESPACE, label_selector=f"job-name={job_name}"
        )
        if not pods.items:
            return "(no pods yet)"
        pod = pods.items[0].metadata.name
        try:
            return core.read_namespaced_pod_log(pod, NAMESPACE, tail_lines=80)
        except ApiException as e:
            return f"(logs unavailable: {e.reason})"

    @app.get("/healthz")
    def healthz():
        return {"ok": True}

    @app.get("/", response_class=HTMLResponse)
    def index(request: Request):
        batch, _ = k8s()
        archives = list_archives()
        active, recent = running_restore_jobs(batch)
        user = request.headers.get("X-authentik-username", "")
        return templates.TemplateResponse(
            "index.html",
            {
                "request": request,
                "archives": archives,
                "active": active,
                "recent": recent,
                "user": user,
                "error": None,
                "notice": None,
            },
        )

    @app.post("/restore", response_class=HTMLResponse)
    def restore(
        request: Request,
        archive: str = Form(...),
        confirm: str = Form(""),
        force: str = Form(""),
    ):
        batch, core = k8s()
        archives = list_archives()
        active, recent = running_restore_jobs(batch)
        user = request.headers.get("X-authentik-username", "")
        ctx = {
            "request": request,
            "archives": archives,
            "active": active,
            "recent": recent,
            "user": user,
            "error": None,
            "notice": None,
        }

        if active:
            ctx["error"] = "A restore job is already running."
            return templates.TemplateResponse("index.html", ctx, status_code=409)

        if confirm.strip() != "RESTORE":
            ctx["error"] = 'Type RESTORE to confirm.'
            return templates.TemplateResponse("index.html", ctx, status_code=400)

        if archive != "latest" and not ARCHIVE_RE.match(archive):
            ctx["error"] = "Invalid archive name."
            return templates.TemplateResponse("index.html", ctx, status_code=400)

        if archive != "latest" and not (BACKUP_DIR / archive).is_file():
            ctx["error"] = f"Archive not found: {archive}"
            return templates.TemplateResponse("index.html", ctx, status_code=404)

        force_flag = "true" if force == "on" else "false"
        ts = time.strftime("%y%m%d%H%M%S", time.gmtime())
        job_name = f"vaultwarden-ui-restore-{ts}"

        job = client.V1Job(
            api_version="batch/v1",
            kind="Job",
            metadata=client.V1ObjectMeta(
                name=job_name,
                namespace=NAMESPACE,
                labels={"app": "vaultwarden-ui-restore"},
                annotations={
                    "vaultwarden.restore/archive": archive,
                    "vaultwarden.restore/force": force_flag,
                    "vaultwarden.restore/by": user or "unknown",
                    "cronjob.kubernetes.io/instantiate": "manual",
                },
            ),
            spec=client.V1JobSpec(
                backoff_limit=1,
                ttl_seconds_after_finished=86400,
                template=client.V1PodTemplateSpec(
                    metadata=client.V1ObjectMeta(
                        labels={"app": "vaultwarden-ui-restore"}
                    ),
                    spec=client.V1PodSpec(
                        service_account_name="vaultwarden-restore",
                        restart_policy="Never",
                        containers=[
                            client.V1Container(
                                name="restore",
                                image="alpine/k8s:1.32.0",
                                image_pull_policy="IfNotPresent",
                                env=[
                                    client.V1EnvVar(name="RESTORE_ENABLED", value="true"),
                                    client.V1EnvVar(name="RESTORE_ARCHIVE", value=archive),
                                    client.V1EnvVar(name="RESTORE_FORCE", value=force_flag),
                                    client.V1EnvVar(name="VW_REPLICAS", value=VW_REPLICAS),
                                ],
                                command=["/bin/bash", "/scripts/orchestrate.sh"],
                                volume_mounts=[
                                    client.V1VolumeMount(
                                        name="scripts", mount_path="/scripts"
                                    ),
                                    client.V1VolumeMount(
                                        name="backup", mount_path="/backup"
                                    ),
                                ],
                            )
                        ],
                        volumes=[
                            client.V1Volume(
                                name="scripts",
                                config_map=client.V1ConfigMapVolumeSource(
                                    name="vaultwarden-restore",
                                    default_mode=0o755,
                                ),
                            ),
                            client.V1Volume(
                                name="backup",
                                persistent_volume_claim=client.V1PersistentVolumeClaimVolumeSource(
                                    claim_name="vaultwarden-backups"
                                ),
                            ),
                        ],
                    ),
                ),
            ),
        )
        try:
            batch.create_namespaced_job(NAMESPACE, job)
        except ApiException as e:
            ctx["error"] = f"Failed to create job: {e.reason}"
            return templates.TemplateResponse("index.html", ctx, status_code=500)

        return RedirectResponse(url=f"/jobs/{job_name}", status_code=303)

    @app.get("/jobs/{job_name}", response_class=HTMLResponse)
    def job_status(request: Request, job_name: str):
        batch, core = k8s()
        user = request.headers.get("X-authentik-username", "")
        try:
            j = batch.read_namespaced_job(job_name, NAMESPACE)
        except ApiException:
            return templates.TemplateResponse(
                "job.html",
                {
                    "request": request,
                    "user": user,
                    "job_name": job_name,
                    "status": "NotFound",
                    "archive": "?",
                    "logs": "Job not found",
                    "active": False,
                },
                status_code=404,
            )
        succeeded = (j.status.succeeded or 0) > 0
        failed = (j.status.failed or 0) > 0
        is_active = (j.status.active or 0) > 0
        if succeeded:
            status = "Succeeded"
        elif failed:
            status = "Failed"
        elif is_active:
            status = "Running"
        else:
            status = "Pending"
        return templates.TemplateResponse(
            "job.html",
            {
                "request": request,
                "user": user,
                "job_name": job_name,
                "status": status,
                "archive": (j.metadata.annotations or {}).get(
                    "vaultwarden.restore/archive", "?"
                ),
                "logs": job_logs(core, job_name),
                "active": is_active or status == "Pending",
            },
        )

  templates_index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Vaultwarden Restore</title>
      <link rel="stylesheet" href="/static/vaultwarden-restore.css">
      <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
    </head>
    <body>
      <main class="card">
        <header class="brand">
          <img src="/static/logo.svg" alt="" width="40" height="40">
          <div>
            <h1>Vaultwarden Restore</h1>
            <p class="muted">namespace vaultwarden · NFS backups</p>
          </div>
        </header>
        {% if user %}<p class="muted user">Signed in as {{ user }}</p>{% endif %}
        {% if error %}<div class="alert danger">{{ error }}</div>{% endif %}
        {% if notice %}<div class="alert ok">{{ notice }}</div>{% endif %}
        {% if active %}
        <div class="alert warn">
          Restore running:
          {% for j in active %}
            <a href="/jobs/{{ j.name }}">{{ j.name }}</a> ({{ j.archive }})
          {% endfor %}
        </div>
        {% endif %}
        <form method="post" action="/restore" class="form">
          <fieldset {% if active %}disabled{% endif %}>
            <legend>Archive</legend>
            <label class="row">
              <input type="radio" name="archive" value="latest" checked>
              <span><strong>latest</strong> <span class="muted">(newest by mtime)</span></span>
            </label>
            {% for a in archives %}
            <label class="row">
              <input type="radio" name="archive" value="{{ a.name }}">
              <span>
                <code>{{ a.name }}</code>
                <span class="muted">{{ a.size_h }} · {{ a.mtime.strftime('%Y-%m-%d %H:%M UTC') }}</span>
              </span>
            </label>
            {% else %}
            <p class="muted">No archives found on the backup volume.</p>
            {% endfor %}
          </fieldset>
          <div class="danger-zone">
            <label class="check">
              <input type="checkbox" name="force" {% if active %}disabled{% endif %}>
              Force overwrite if <code>db.sqlite3</code> already exists
            </label>
            <label>
              Type <strong>RESTORE</strong> to confirm
              <input type="text" name="confirm" autocomplete="off" spellcheck="false"
                     placeholder="RESTORE" {% if active %}disabled{% endif %}>
            </label>
          </div>
          <div class="actions">
            <a class="btn secondary" href="/">Refresh</a>
            <button class="btn primary" type="submit" {% if active %}disabled{% endif %}>Restore</button>
          </div>
        </form>
        {% if recent %}
        <section class="recent">
          <h2>Recent jobs</h2>
          <ul>
            {% for j in recent %}
            <li>
              <a href="/jobs/{{ j.name }}">{{ j.name }}</a>
              <span class="badge {% if j.succeeded %}ok{% elif j.failed %}bad{% else %}muted{% endif %}">
                {% if j.succeeded %}Succeeded{% elif j.failed %}Failed{% else %}Done{% endif %}
              </span>
              <span class="muted">{{ j.archive }}</span>
            </li>
            {% endfor %}
          </ul>
        </section>
        {% endif %}
      </main>
    </body>
    </html>

  templates_job.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      {% if active %}<meta http-equiv="refresh" content="5">{% endif %}
      <title>{{ job_name }} · Vaultwarden Restore</title>
      <link rel="stylesheet" href="/static/vaultwarden-restore.css">
      <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
    </head>
    <body>
      <main class="card">
        <header class="brand">
          <img src="/static/logo.svg" alt="" width="40" height="40">
          <div>
            <h1>Restore job</h1>
            <p class="muted"><code>{{ job_name }}</code></p>
          </div>
        </header>
        {% if user %}<p class="muted user">Signed in as {{ user }}</p>{% endif %}
        <p>
          Status
          <span class="badge {% if status == 'Succeeded' %}ok{% elif status == 'Failed' %}bad{% elif status == 'Running' or status == 'Pending' %}warn{% else %}muted{% endif %}">
            {{ status }}
          </span>
        </p>
        <p class="muted">Archive: <code>{{ archive }}</code></p>
        <pre class="logs">{{ logs }}</pre>
        <div class="actions">
          <a class="btn secondary" href="/">Back</a>
          <a class="btn primary" href="/jobs/{{ job_name }}">Refresh</a>
        </div>
      </main>
    </body>
    </html>

  static_vaultwarden-restore.css: |
    :root {
      --vw-bg: #0c0c0c;
      --vw-panel: #1a1a1a;
      --vw-panel-2: #222;
      --vw-border: #333;
      --vw-text: #e6e6e6;
      --vw-muted: #9a9a9a;
      --vw-primary: #175ddc;
      --vw-primary-hover: #144db8;
      --vw-danger: #c62828;
      --vw-ok: #2e7d32;
      --vw-warn: #b78103;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2.5rem 1rem;
      background: var(--vw-bg);
      color: var(--vw-text);
      font-family: "Open Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.45;
    }
    .card {
      width: 100%;
      max-width: 540px;
      background: var(--vw-panel);
      border: 1px solid var(--vw-border);
      border-radius: 6px;
      padding: 1.5rem 1.4rem 1.35rem;
    }
    .brand {
      display: flex;
      gap: 0.85rem;
      align-items: center;
      margin-bottom: 1rem;
    }
    .brand h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
    }
    .muted { color: var(--vw-muted); font-size: 0.9rem; }
    .user { margin: 0 0 1rem; }
    fieldset {
      border: 1px solid var(--vw-border);
      border-radius: 4px;
      padding: 0.75rem 0.85rem 0.5rem;
      margin: 0 0 1rem;
      background: var(--vw-panel-2);
    }
    legend { padding: 0 0.35rem; color: var(--vw-muted); font-size: 0.85rem; }
    .row {
      display: flex;
      gap: 0.65rem;
      align-items: flex-start;
      padding: 0.45rem 0;
      cursor: pointer;
    }
    .row code { display: block; word-break: break-all; }
    .danger-zone {
      border: 1px solid #5a2020;
      background: #1c1010;
      border-radius: 4px;
      padding: 0.85rem;
      margin-bottom: 1rem;
      display: grid;
      gap: 0.75rem;
    }
    .danger-zone label { display: grid; gap: 0.35rem; }
    .check {
      display: flex !important;
      flex-direction: row !important;
      align-items: center;
      gap: 0.5rem;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.55rem 0.65rem;
      border-radius: 4px;
      border: 1px solid var(--vw-border);
      background: var(--vw-bg);
      color: var(--vw-text);
      font: inherit;
    }
    input[type="text"]:focus {
      outline: 2px solid var(--vw-primary);
      outline-offset: 1px;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.6rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.55rem 1rem;
      border-radius: 4px;
      border: 1px solid transparent;
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .btn.primary {
      background: var(--vw-primary);
      color: #fff;
    }
    .btn.primary:hover:not(:disabled) { background: var(--vw-primary-hover); }
    .btn.secondary {
      background: transparent;
      color: var(--vw-text);
      border-color: var(--vw-border);
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .alert {
      padding: 0.65rem 0.75rem;
      border-radius: 4px;
      margin-bottom: 1rem;
      font-size: 0.92rem;
    }
    .alert.danger { background: #2a1212; border: 1px solid var(--vw-danger); color: #ffb4b4; }
    .alert.ok { background: #102414; border: 1px solid var(--vw-ok); color: #b7e0b9; }
    .alert.warn { background: #2a220c; border: 1px solid var(--vw-warn); color: #f0d78c; }
    .badge {
      display: inline-block;
      padding: 0.1rem 0.45rem;
      border-radius: 3px;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .badge.ok { background: #1b3d1e; color: #9fd6a3; }
    .badge.bad { background: #3d1b1b; color: #f0a0a0; }
    .badge.warn { background: #3d3214; color: #f0d78c; }
    .badge.muted { background: #2a2a2a; color: var(--vw-muted); }
    .recent h2 {
      margin: 1.25rem 0 0.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--vw-muted);
    }
    .recent ul { list-style: none; margin: 0; padding: 0; }
    .recent li {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.15rem 0.5rem;
      padding: 0.4rem 0;
      border-top: 1px solid var(--vw-border);
      font-size: 0.88rem;
    }
    .recent a { color: #7eb6ff; text-decoration: none; }
    .recent a:hover { text-decoration: underline; }
    .logs {
      background: var(--vw-bg);
      border: 1px solid var(--vw-border);
      border-radius: 4px;
      padding: 0.75rem;
      max-height: 320px;
      overflow: auto;
      font-size: 0.78rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

