    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
      <path d="M32 4L10 14v18c0 14.5 9.4 28 22 32 12.6-4 22-17.5 22-32V14L32 4z" fill="#175DDC"/>
