apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden-restore-ui
  namespace: vaultwarden
  labels:
    app: vaultwarden-restore-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vaultwarden-restore-ui
  template:
    metadata:
      labels:
        app: vaultwarden-restore-ui
    spec:
      serviceAccountName: vaultwarden-restore
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: restore-ui
          image: ghcr.io/henryhst/vw-restore:1.0.1

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HOME
              value: /tmp
            - name: BACKUP_DIR
              value: /backup
            - name: NAMESPACE
              value: vaultwarden
            - name: VW_REPLICAS
              value: "1"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: backup
              mountPath: /backup
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: backup
          persistentVolumeClaim:
            claimName: vaultwarden-backups
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden-restore-ui
  namespace: vaultwarden
  labels:
    app: vaultwarden-restore-ui
spec:
  selector:
    app: vaultwarden-restore-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
