# Migrated from Traefik IngressRoute → Cilium Gateway API HTTPRoute.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateway-tls-vw-restore-tls
  namespace: vaultwarden
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: gateway-system
  to:
  - group: ''
    kind: Secret
    name: vw-restore-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vaultwarden-restore-ui
  namespace: vaultwarden
  labels:
    app.kubernetes.io/name: vaultwarden-restore-ui
    app.kubernetes.io/part-of: vaultwarden
spec:
  parentRefs:
  - name: nxk3
    namespace: gateway-system
    sectionName: https-vw-restore
  hostnames:
  - vw-restore.stadthagen.dev
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: ExternalAuth
      externalAuth:
        protocol: HTTP
        backendRef:
          name: ak-outpost-vw-restore
          namespace: authentik
          port: 9000
        http:
          path: /outpost.goauthentik.io/auth/envoy
          allowedHeaders:
          - Cookie
          - Authorization
          allowedResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
    backendRefs:
    - name: vaultwarden-restore-ui
      port: 8080
