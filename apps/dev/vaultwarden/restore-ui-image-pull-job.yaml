# PreSync: pull/verify lab registry image before restore-ui Deploy applies.
# Keep image: in sync with restore-ui-deployment.yaml (same digest).
# SoT build: https://git.stadthagen.dev/dev/vw-restore (linux/amd64).
apiVersion: batch/v1
kind: Job
metadata:
  name: vw-restore-image-pull
  namespace: vaultwarden
  labels:
    app: vaultwarden-restore-ui
    app.kubernetes.io/component: image-pull
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: vw-restore-image-pull
    spec:
      restartPolicy: Never
      # Image is amd64-only (Forgejo Actions on w06); avoid Pi arm64 ImagePullBackOff
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: registry-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pull
          # Keep in sync with restore-ui-deployment.yaml
          # semver: 1.0.9 (git.stadthagen.dev/dev/vw-restore:1.0.9)
          image: git.stadthagen.dev/dev/vw-restore@sha256:88e7f27568d982660813b13a073d8e04948ff71aae91e8e302486c8de78c98c9
          imagePullPolicy: Always
          command: ["true"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
