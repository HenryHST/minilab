# Traefik ForwardAuth → Authentik Outpost for vw-restore.stadthagen.dev
# Prerequisite: Day-0 blueprint day0-vw-restore → Service ak-outpost-vw-restore
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: vw-restore-authentik
  namespace: vaultwarden
  labels:
    app: vaultwarden-restore-ui
spec:
  forwardAuth:
    address: http://ak-outpost-vw-restore.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
