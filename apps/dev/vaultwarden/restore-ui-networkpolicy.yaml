# Restore UI: Traefik ingress; egress DNS + kube-apiserver (Job create / status).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vaultwarden-restore-ui-ingress
  namespace: vaultwarden
  labels:
    app: vaultwarden-restore-ui
spec:
  podSelector:
    matchLabels:
      app: vaultwarden-restore-ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vaultwarden
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080
---
# Cilium labels k3s apiserver backends as reserved:kube-apiserver; plain
# NetworkPolicy ipBlock (10.0.0.0/8) does not match that identity (Hubble: DENIED).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vaultwarden-restore-ui-egress
  namespace: vaultwarden
  labels:
    app: vaultwarden-restore-ui
spec:
  endpointSelector:
    matchLabels:
      app: vaultwarden-restore-ui
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
