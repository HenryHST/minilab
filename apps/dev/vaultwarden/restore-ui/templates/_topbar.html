<header class="topbar">
  <div class="brand">
    <img src="/static/logo.svg" alt="{{ t('logo_alt') }}" width="38" height="38">
    <div>
      <h1>{{ brand_title }}</h1>
      <p class="muted">{{ brand_subtitle|safe }}</p>
    </div>
  </div>

  <div class="topbar-actions">
    <a href="?lang={{ 'en' if lang == 'de' else 'de' }}"
       class="lang-toggle is-{{ lang }}"
       role="switch"
       aria-checked="{{ 'true' if lang == 'en' else 'false' }}"
       aria-label="{{ t('lang_switch_aria') }}"
       hreflang="{{ 'en' if lang == 'de' else 'de' }}">
      <span class="lang-toggle-track" aria-hidden="true">
        <span class="lang-toggle-thumb">
          <img src="/static/flag-{{ lang }}.svg" alt="" width="14" height="14">
        </span>
      </span>
    </a>
    {% if user %}
    <div class="user-pill">{{ user }}</div>
    {% endif %}
  </div>
</header>
