        href: https://argocd.stadthagen.dev
        icon: argo-cd.png
        description: GitOps
        widget:
          type: argocd
          url: http://argo-cd-argocd-server.argocd.svc.cluster.local
          key: "{{HOMEPAGE_VAR_ARGOCD_KEY}}"
          fields: ["apps", "synced", "outOfSync", "healthy"]
