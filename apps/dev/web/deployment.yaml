apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true
      initContainers:
        - name: copy-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              cp /config-src/* /config/ && mkdir -p /config/logs
          volumeMounts:
            - name: config-src
              mountPath: /config-src
            - name: config
              mountPath: /config
      containers:
        - name: web
          # Digest-only linux/amd64 pin. Tag+digest still resolved to the multi-arch
          # index on some Talos nodes (exec format error); digest-only works.
          image: ghcr.io/gethomepage/homepage@sha256:f1c9e802a0b9de6f64ef8d3e3d3aac4283f250e0a8ff5ebd170d791811431c99
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: web.stadthagen.dev
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          envFrom:
            - secretRef:
                name: homepage
                optional: true
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: robot-vendor
              mountPath: /app/public/vendor
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config-src
          configMap:
            name: homepage-config
        - name: config
          emptyDir: {}
        - name: robot-vendor
          configMap:
            name: homepage-robot-vendor
            defaultMode: 0444
