# Migrated from Traefik IngressRoute → Cilium Gateway API HTTPRoute.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateway-tls-web-tls
  namespace: homepage
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: gateway-system
  to:
  - group: ''
    kind: Secret
    name: web-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: homepage
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: homepage
spec:
  parentRefs:
  - name: nxk3
    namespace: gateway-system
    sectionName: https-web
  hostnames:
  - web.stadthagen.dev
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: web
      port: 3000
