apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    grafana_datasource: "1"
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: https://prometheus.stadthagen.dev
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          timeInterval: 30s
          tlsSkipVerify: false

      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: https://loki.stadthagen.dev
        isDefault: false
        editable: false
        jsonData:
          maxLines: 1000
          tlsSkipVerify: false
