apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grafana
helmCharts:
  - name: grafana
    repo: https://grafana.github.io/helm-charts
    version: 10.5.15
    releaseName: grafana
    namespace: grafana
    valuesFile: values.yaml
resources:
  - pvc.yaml
  - certificate.yaml
  - ingressroute.yaml
  - datasources.yaml
