# Grafana: ingress allow Traefik + in-namespace (Vaultwarden/Termix pattern).
# Pod port 3000 (Service 80→grafana). No Newt. Egress left open (OIDC, datasources).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-ingress
  namespace: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: grafana
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: grafana
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 3000
