# Applied by Infra_LAB SecretSpec (--tags secrets) after Terraform OAuth app exists.
# Until then leave secret absent; oauth mount is optional so Grafana still starts.
#
# kubectl create secret generic grafana-oauth -n grafana \
#   --from-literal=client-id=grafana \
#   --from-literal=client-secret=FROM_TERRAFORM_OUTPUT
apiVersion: v1
kind: Secret
metadata:
  name: grafana-oauth
  namespace: grafana
type: Opaque
stringData:
  client-id: grafana
  client-secret: CHANGE_ME
