# Grafana Helm values — adapted from JimsGarage GitOps layout:
# https://github.com/JamesTurland/JimsGarage/tree/main/Kubernetes/GitOps/Grafana

ingress:
  enabled: false

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 3000

deploymentStrategy:
  type: Recreate

nodeSelector:
  worker: "true"

persistence:
  enabled: true
  type: pvc
  existingClaim: grafana-data
  storageClassName: longhorn

# Provision Prometheus + Loki from ConfigMap datasources.yaml
extraConfigmapMounts:
  - name: grafana-datasources
    configMap: grafana-datasources
    mountPath: /etc/grafana/provisioning/datasources
    readOnly: true

# Official UniFi Poller Prometheus dashboards (grafana.com / unpoller/dashboards)
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: unpoller
        orgId: 1
        folder: UniFi Poller
        type: file
        disableDeletion: false
        editable: false
        options:
          path: /var/lib/grafana/dashboards/unpoller

dashboards:
  unpoller:
    client-dpi:
      gnetId: 11310
      revision: 10
      datasource: Prometheus
    network-sites:
      gnetId: 11311
      revision: 10
      datasource: Prometheus
    usw-insights:
      gnetId: 11312
      revision: 10
      datasource: Prometheus
    usg-insights:
      gnetId: 11313
      revision: 10
      datasource: Prometheus
    uap-insights:
      gnetId: 11314
      revision: 10
      datasource: Prometheus
    client-insights:
      gnetId: 11315
      revision: 10
      datasource: Prometheus

grafana.ini:
  server:
    root_url: https://grafana.stadthagen.dev
    domain: grafana.stadthagen.dev
  users:
    allow_sign_up: false
  analytics:
    check_for_updates: true
  log:
    mode: console

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
