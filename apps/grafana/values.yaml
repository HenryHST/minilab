# Grafana Helm values — adapted from JimsGarage GitOps layout:
# https://github.com/JamesTurland/JimsGarage/tree/main/Kubernetes/GitOps/Grafana

ingress:
  enabled: false

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 3000

deploymentStrategy:
  type: Recreate

nodeSelector:
  worker: "true"

persistence:
  enabled: true
  type: pvc
  existingClaim: grafana-data
  storageClassName: longhorn

# Provision Prometheus + Loki from ConfigMap datasources.yaml
extraConfigmapMounts:
  - name: grafana-datasources
    configMap: grafana-datasources
    mountPath: /etc/grafana/provisioning/datasources
    readOnly: true

grafana.ini:
  server:
    root_url: https://grafana.stadthagen.dev
    domain: grafana.stadthagen.dev
  users:
    allow_sign_up: false
  analytics:
    check_for_updates: true
  log:
    mode: console
  auth:
    disable_login_form: false
    oauth_auto_login: false
  auth.generic_oauth:
    enabled: true
    name: authentik
    allow_sign_up: true
    client_id: $__file{/etc/secrets/grafana-oauth/client-id}
    client_secret: $__file{/etc/secrets/grafana-oauth/client-secret}
    scopes: openid profile email
    auth_url: https://idp.stadthagen.dev/application/o/authorize/
    token_url: https://idp.stadthagen.dev/application/o/token/
    api_url: https://idp.stadthagen.dev/application/o/userinfo/
    signout_redirect_url: https://idp.stadthagen.dev/application/o/grafana/end-session/
    role_attribute_path: contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor' || 'Viewer'

# Secret created by Infra_LAB --tags secrets (grafana/grafana-oauth)
extraSecretMounts:
  - name: grafana-oauth
    secretName: grafana-oauth
    mountPath: /etc/secrets/grafana-oauth
    readOnly: true
    optional: true

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
