# Grafana Helm values — adapted from JimsGarage GitOps layout:
# https://github.com/JamesTurland/JimsGarage/tree/main/Kubernetes/GitOps/Grafana

ingress:
  enabled: false

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 3000

deploymentStrategy:
  type: Recreate

nodeSelector:
  worker: "true"

persistence:
  enabled: true
  type: pvc
  existingClaim: grafana-data
  storageClassName: longhorn

# Provision Prometheus + Loki from ConfigMap datasources.yaml
extraConfigmapMounts:
  - name: grafana-datasources
    configMap: grafana-datasources
    mountPath: /etc/grafana/provisioning/datasources
    readOnly: true

# Official UniFi Poller Prometheus dashboards (grafana.com / unpoller/dashboards)
# plus Argo CD / Authentik / Home Assistant
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: unpoller
        orgId: 1
        folder: UniFi Poller
        type: file
        disableDeletion: false
        editable: false
        options:
          path: /var/lib/grafana/dashboards/unpoller
      - name: argocd
        orgId: 1
        folder: Argo CD
        type: file
        disableDeletion: false
        editable: false
        options:
          path: /var/lib/grafana/dashboards/argocd
      - name: authentik
        orgId: 1
        folder: Authentik
        type: file
        disableDeletion: false
        editable: false
        options:
          path: /var/lib/grafana/dashboards/authentik
      - name: homeassistant
        orgId: 1
        folder: Home Assistant
        type: file
        disableDeletion: false
        editable: false
        options:
          path: /var/lib/grafana/dashboards/homeassistant

dashboards:
  unpoller:
    client-dpi:
      gnetId: 11310
      revision: 10
      datasource: Prometheus
    network-sites:
      gnetId: 11311
      revision: 10
      datasource: Prometheus
    usw-insights:
      gnetId: 11312
      revision: 10
      datasource: Prometheus
    usg-insights:
      gnetId: 11313
      revision: 10
      datasource: Prometheus
    uap-insights:
      gnetId: 11314
      revision: 10
      datasource: Prometheus
    client-insights:
      gnetId: 11315
      revision: 10
      datasource: Prometheus
  argocd:
    operational-overview:
      gnetId: 19993
      datasource: Prometheus
  authentik:
    authentik:
      gnetId: 14837
      datasource: Prometheus
  homeassistant:
    overview:
      gnetId: 16888
      datasource: Prometheus

grafana.ini:
  server:
    root_url: https://grafana.stadthagen.dev
    domain: grafana.stadthagen.dev
  users:
    allow_sign_up: false
  auth:
    oauth_auto_login: false
  auth.generic_oauth:
    enabled: true
    name: authentik
    allow_sign_up: true
    client_id: $__file{/etc/secrets/auth_generic_oauth/client-id}
    client_secret: $__file{/etc/secrets/auth_generic_oauth/client-secret}
    scopes: openid profile email
    auth_url: https://idp.stadthagen.dev/application/o/authorize/
    token_url: https://idp.stadthagen.dev/application/o/token/
    api_url: https://idp.stadthagen.dev/application/o/userinfo/
    signout_redirect_url: https://idp.stadthagen.dev/application/o/grafana/end-session/
    role_attribute_path: "contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor' || 'Viewer'"
    role_attribute_strict: false
  analytics:
    check_for_updates: true
  log:
    mode: console

extraSecretMounts:
  - name: auth-generic-oauth-secret-mount
    secretName: grafana-oauth
    mountPath: /etc/secrets/auth_generic_oauth
    readOnly: true
    defaultMode: 0440

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
