apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
helmCharts:
  - name: headlamp
    repo: https://kubernetes-sigs.github.io/headlamp/
    version: 0.45.0
    releaseName: headlamp
    namespace: kube-system
    valuesFile: values.yaml
resources:
  - certificate.yaml
  - ingressroute.yaml
  - login-sa.yaml
  - oidc-rbac.yaml
  - networkpolicy.yaml
