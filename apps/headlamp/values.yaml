# Headlamp — https://kubernetes-sigs.github.io/headlamp/
# Chart 0.45.0; plugins via in-cluster Plugin Manager sidecar.
# OIDC: Authentik app slug headlamp → Secret headlamp-oidc (Ansible SecretSpec).
# API-server OIDC + CRB headlamp-oidc-admins required for cluster access after login.

fullnameOverride: headlamp

replicaCount: 1

nodeSelector:
  worker: "true"

config:
  inCluster: true
  watchPlugins: true
  oidc:
    secret:
      create: false
    externalSecret:
      enabled: true
      name: headlamp-oidc
      hasScopes: true

ingress:
  enabled: false

service:
  type: ClusterIP
  port: 80

pluginsManager:
  enabled: true
  configContent: |
    plugins:
      - name: cert-manager
        source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
        version: 0.1.1
      - name: gatekeeper
        source: https://artifacthub.io/packages/headlamp/gatekeeper-headlamp-plugin/gatekeeper
        version: 0.2.0
    installOptions:
      parallel: true
      maxConcurrent: 2
