# Traefik ForwardAuth → Authentik Outpost for hubble.stadthagen.dev.
# Prerequisite: Day-0 blueprint day0-hubble-ui → Service ak-outpost-hubble-ui.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hubble-ui-authentik
  namespace: kube-system
  labels:
    app.kubernetes.io/name: hubble-ui
    app.kubernetes.io/part-of: hubble-ui
spec:
  forwardAuth:
    address: http://ak-outpost-hubble-ui.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
