# Second policy so instance-status egress stays if Git still has the
# operator policy without TCP 8000. Rules are additive.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudnative-pg-instance-status
  namespace: cnpg-system
  labels:
    app.kubernetes.io/name: cloudnative-pg
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 8000
