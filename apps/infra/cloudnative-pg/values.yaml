# CloudNativePG operator 1.29.3 — chart 0.28.3 (image.tag pin)
# https://cloudnative-pg.io/docs/current/installation_upgrade/
# Cluster CRs live in the app namespace, not in this chart.
# 1.29.3 clears CVE-2026-84304 (google.golang.org/grpc) in bootstrap-controller;
# chart stays 0.28.3 (appVersion 1.29.1) with an explicit tag override.

image:
  tag: "1.29.3"

serviceAccount:
  create: true
  name: postgres-cloud-sa

rbac:
  create: true

config:
  clusterWide: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

monitoring:
  podMonitorEnabled: true
  podMonitorAdditionalLabels:
    release: kube-prometheus-stack
  # Dashboard is Application cnpg-grafana (chart cluster 0.0.5) in namespace monitoring.
  grafanaDashboard:
    create: false
