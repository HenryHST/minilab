# CloudNativePG operator 1.29.1 — chart 0.28.3
# https://cloudnative-pg.io/docs/current/installation_upgrade/
# Cluster CRs live in the app namespace, not in this chart.
# Chart 0.28.3 / operator 1.29.1 clears CVE-2026-33815 (pgx) and
# CVE-2025-68121 (Go crypto/tls) in the operator / bootstrap-controller image.

serviceAccount:
  create: true
  name: postgres-cloud-sa

rbac:
  create: true

config:
  clusterWide: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

monitoring:
  podMonitorEnabled: true
  podMonitorAdditionalLabels:
    release: kube-prometheus-stack
  # Dashboard is Application cnpg-grafana (chart cluster 0.0.5) in namespace monitoring.
  grafanaDashboard:
    create: false
