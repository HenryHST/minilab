# CloudNativePG operator 1.30.1 — chart 0.29.1
# https://cloudnative-pg.io/docs/current/installation_upgrade/
# Cluster CRs live in the app namespace, not in this chart.
# 1.30.1 / chart 0.29.1 clears CVE-2026-84304 (grpc) with matching RBAC
# (do not pin image.tag on an older chart — EndpointSlice rules break reconcile).

serviceAccount:
  create: true
  name: postgres-cloud-sa

rbac:
  create: true

config:
  clusterWide: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

monitoring:
  podMonitorEnabled: true
  podMonitorAdditionalLabels:
    release: kube-prometheus-stack
  # Dashboard is Application cnpg-grafana (chart cluster 0.0.5) in namespace monitoring.
  grafanaDashboard:
    create: false
