# Catch-all for unmatched hosts on websecure (priority 1 — specific routes win).
# Same-namespace Service → no allowCrossNamespace needed for this route.
# sendSameHttpCode=true on the chart so clients get real 404 (not 200).
# ingress.class must match Traefik providers.kubernetesCRD.ingressClass.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: error-pages-catch-all
  namespace: error-pages
  annotations:
    kubernetes.io/ingress.class: traefik-external
  labels:
    app.kubernetes.io/name: error-pages
    app.kubernetes.io/part-of: error-pages
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostRegexp(`.+`)
      kind: Rule
      priority: 1
      services:
        - name: error-pages
          port: 8080
  tls: {}
