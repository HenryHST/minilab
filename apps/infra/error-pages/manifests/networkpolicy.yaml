# Allow Traefik (errors middleware + catch-all) to reach error-pages.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: error-pages
  namespace: error-pages
  labels:
    app.kubernetes.io/name: error-pages
    app.kubernetes.io/part-of: error-pages
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: error-pages
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: error-pages
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # CoreDNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
