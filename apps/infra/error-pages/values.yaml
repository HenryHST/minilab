# error-pages — backend for Cilium Gateway Envoy CEC (404/5xx). Helm chart values.
# Chart: oci://ghcr.io/tarampampam/error-pages/charts/error-pages  (pin in ApplicationSet)
# Wiring: Infra_LAB cni_cilium CEC + ADR-0024 / ADR-0038 (no Traefik Middleware).
# HTML: custom lost-in-space + Gatus badges (ConfigMap error-pages-html-template)

config:
  sendSameHttpCode: true
  htmlTemplate:
    # File mounted from ConfigMap; built-in name ignored when custom is set
    custom: /templates/lost-in-space-gatus.tpl.html
  homepageUrl: https://web.stadthagen.dev
  addLink:
    - label: Status
      url: https://status.stadthagen.dev/uebersicht
    - label: Home
      url: https://web.stadthagen.dev

traefikMiddleware:
  # Traefik removed (ADR-0028 / Gateway cutover); keep chart key off.
  enabled: false
  statusCodes:
    - "500-504"
  query: "/{status}"

deployment:
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
  volumes:
    - name: html-template
      configMap:
        name: error-pages-html-template
  volumeMounts:
    - name: html-template
      mountPath: /templates
      readOnly: true

service:
  type: ClusterIP
  port: 8080
