# error-pages — Traefik errors middleware + catch-all (Helm chart values).
# Chart: oci://ghcr.io/tarampampam/error-pages/charts/error-pages  (pin in ApplicationSet)
# Guide: https://github.com/tarampampam/error-pages/blob/master/docs/guides/k8s_ingress_traefik.md
# HTML: custom lost-in-space + Gatus badges (ConfigMap error-pages-html-template)

config:
  sendSameHttpCode: true
  htmlTemplate:
    # File mounted from ConfigMap; built-in name ignored when custom is set
    custom: /templates/lost-in-space-gatus.tpl.html
  homepageUrl: https://web.stadthagen.dev
  addLink:
    - label: Status
      url: https://status.stadthagen.dev/uebersicht
    - label: Home
      url: https://web.stadthagen.dev

traefikMiddleware:
  enabled: true
  # Gateway / backend down only — do not rewrite Authentik 401/403 or API 4xx
  statusCodes:
    - "500-504"
  query: "/{status}"

deployment:
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
  volumes:
    - name: html-template
      configMap:
        name: error-pages-html-template
  volumeMounts:
    - name: html-template
      mountPath: /templates
      readOnly: true

service:
  type: ClusterIP
  port: 8080
