# Central Cilium Gateway for nXk3 edge (VIP 192.168.0.215).
# Source of truth for HTTPS listeners; Ansible bootstraps argocd until sync.
# Apps attach via HTTPRoute parentRefs → gateway-system/nxk3.
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-system
  labels:
    app.kubernetes.io/name: cilium-gateway
    app.kubernetes.io/part-of: nxk3
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nxk3
  namespace: gateway-system
  labels:
    app.kubernetes.io/name: nxk3
    app.kubernetes.io/part-of: nxk3
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  gatewayClassName: cilium
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: "192.168.0.215"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https-alert-manager
      protocol: HTTPS
      port: 443
      hostname: "alert-manager.stadthagen.dev"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: alertmanager-tls
            namespace: monitoring
      allowedRoutes:
        namespaces:
          from: All
    - name: https-argocd
      protocol: HTTPS
      port: 443
      hostname: "argocd.stadthagen.dev"
