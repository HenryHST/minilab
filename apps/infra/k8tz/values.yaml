# k8tz — timezone admission controller (Helm chart values).
# Chart: https://k8tz.github.io/k8tz/  version pinned in ApplicationSet.
timezone: Europe/Berlin
injectionStrategy: initContainer
injectAll: true
createNamespace: true
namespace: k8tz

webhook:
  failurePolicy: Ignore
  ignoredNamespaces:
    - kube-system
    - k8tz
    - trivy-system
    - kyverno
    - kubeconfig-user
  certManager:
    enabled: false

# Bootstrap initContainer must declare requests so Kyverno require-requests-limits (Audit) stays clean.
initContainerResources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi
