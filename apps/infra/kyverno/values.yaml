# Kyverno Helm values — chart pinned in ApplicationSet (kyverno 3.9.1 / app v1.19.1).
# https://kyverno.github.io/kyverno/
# Homelab: single replica; Audit policies only (see policies/).

admissionController:
  replicas: 1
  rbac:
    clusterRole:
      extraResources: []

backgroundController:
  replicas: 1

cleanupController:
  replicas: 1

reportsController:
  replicas: 1

# Policy reports CRDs installed by chart
crds:
  install: true

config:
  webhooks:
    # Exclude system namespaces from webhook matching (defense in depth; policies also exclude)
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kyverno
