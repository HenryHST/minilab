# Talos: chart hardcodes hostPath /var/lib/longhorn (system disk ~28G).
# kubelet extraMounts do not rewrite pod hostPath. Keep system path mounted for
# eviction, and add /var/mnt/longhorn (userVolume ~86G) as the schedulable disk.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-datapath
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/component: datapath-enforcer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: longhorn-datapath
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/component: datapath-enforcer
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    resourceNames: ["longhorn-manager"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["longhorn.io"]
    resources: ["nodes", "settings"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: longhorn-datapath
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/component: datapath-enforcer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: longhorn-datapath
subjects:
  - kind: ServiceAccount
    name: longhorn-datapath
    namespace: longhorn-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: longhorn-datapath
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/component: datapath-enforcer
data:
  enforce.sh: |
    #!/bin/sh
    set -eu
    NS=longhorn-system
    WANT="${LONGHORN_DATA_PATH:-/var/mnt/longhorn}"

    # Ensure manager DS mounts both system path (for eviction) and userVolume.
    has_sdb="$(kubectl -n "$NS" get ds longhorn-manager -o jsonpath='{.spec.template.spec.volumes[?(@.name=="longhorn-sdb")].hostPath.path}' 2>/dev/null || true)"
    if [ -n "$has_sdb" ]; then
      echo "ok: ds already has longhorn-sdb hostPath=$has_sdb"
    else
      echo "patch: add longhorn-sdb hostPath $WANT to longhorn-manager"
      # Append volume + volumeMount via strategic merge is awkward; use kubectl get/replace snippet.
      kubectl -n "$NS" get ds longhorn-manager -o json > /tmp/lh-ds.json
      # rancher/shell may lack python; use a minimal kubectl patch assuming chart layout.
      kubectl -n "$NS" patch ds longhorn-manager --type=json -p="[
        {\"op\":\"add\",\"path\":\"/spec/template/spec/volumes/-\",\"value\":{\"name\":\"longhorn-sdb\",\"hostPath\":{\"path\":\"${WANT}/\",\"type\":\"Directory\"}}},
        {\"op\":\"add\",\"path\":\"/spec/template/spec/containers/0/volumeMounts/-\",\"value\":{\"name\":\"longhorn-sdb\",\"mountPath\":\"${WANT}/\",\"mountPropagation\":\"Bidirectional\"}}
      ]"
    fi

    cur_setting="$(kubectl -n "$NS" get settings.longhorn.io default-data-path -o jsonpath='{.value}' 2>/dev/null || true)"
    if [ "$cur_setting" = "$WANT" ] || [ "$cur_setting" = "${WANT}/" ]; then
      echo "ok: setting default-data-path=$cur_setting"
    else
      echo "patch: setting default-data-path -> $WANT (was $cur_setting)"
      kubectl -n "$NS" patch settings.longhorn.io default-data-path --type merge -p "{\"value\":\"${WANT}\"}"
    fi

    NODES="${TALOS_LONGHORN_NODES:-talos-w01 talos-w02 talos-w03 talos-w04 talos-w05 talos-w06}"
    for n in $NODES; do
      if ! kubectl -n "$NS" get nodes.longhorn.io "$n" >/dev/null 2>&1; then
        echo "skip: nodes.longhorn.io/$n not found"
        continue
      fi
      paths="$(kubectl -n "$NS" get nodes.longhorn.io "$n" -o go-template='{{range $k,$v := .spec.disks}}{{$v.path}} {{end}}' 2>/dev/null || true)"
      case " $paths " in
        *" $WANT "*|*" ${WANT}/ "*) echo "ok: $n already has $WANT ($paths)" ;;
        *)
          echo "patch: $n add disk longhorn-sdb=$WANT"
          kubectl -n "$NS" patch nodes.longhorn.io "$n" --type=merge -p "{\"spec\":{\"disks\":{\"longhorn-sdb\":{\"path\":\"${WANT}\",\"allowScheduling\":true,\"storageReserved\":0,\"evictionRequested\":false,\"diskType\":\"filesystem\"}}}}"
          ;;
      esac
      # Evict system-disk default path so replicas move to userVolume.
      kubectl -n "$NS" get nodes.longhorn.io "$n" -o go-template='{{range $k,$v := .spec.disks}}{{$k}} {{$v.path}} {{$v.allowScheduling}}{{"\n"}}{{end}}' | while read -r key path sched; do
        [ -n "$key" ] || continue
        case "$path" in
          /var/lib/longhorn|/var/lib/longhorn/)
            if [ "$sched" = "true" ]; then
              echo "patch: $n disk $key disable+evict ($path)"
              kubectl -n "$NS" patch nodes.longhorn.io "$n" --type=merge \
                -p "{\"spec\":{\"disks\":{\"$key\":{\"allowScheduling\":false,\"evictionRequested\":true}}}}"
            else
              echo "ok: $n disk $key already unschedulable"
            fi
            ;;
        esac
      done
    done
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: longhorn-datapath
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/component: datapath-enforcer
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: longhorn
            app.kubernetes.io/component: datapath-enforcer
        spec:
          serviceAccountName: longhorn-datapath
          restartPolicy: Never
          nodeSelector:
            worker: "true"
          containers:
            - name: enforce
              image: rancher/shell:v0.2.2
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/enforce.sh"]
              env:
                - name: LONGHORN_DATA_PATH
                  value: /var/mnt/longhorn
                - name: TALOS_LONGHORN_NODES
                  value: "talos-w01 talos-w02 talos-w03 talos-w04 talos-w05 talos-w06"
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: scripts
              configMap:
                name: longhorn-datapath
                defaultMode: 0555
---
apiVersion: batch/v1
kind: Job
metadata:
  name: longhorn-datapath-bootstrap
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/component: datapath-enforcer
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookFailed
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: longhorn
        app.kubernetes.io/component: datapath-enforcer
    spec:
      serviceAccountName: longhorn-datapath
      restartPolicy: Never
      nodeSelector:
        worker: "true"
      containers:
        - name: enforce
          image: rancher/shell:v0.2.2
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/enforce.sh"]
          env:
            - name: LONGHORN_DATA_PATH
              value: /var/mnt/longhorn
            - name: TALOS_LONGHORN_NODES
              value: "talos-w01 talos-w02 talos-w03 talos-w04 talos-w05 talos-w06"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: scripts
          configMap:
            name: longhorn-datapath
            defaultMode: 0555
