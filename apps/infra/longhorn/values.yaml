# Longhorn v1.12.1 — https://longhorn.io/docs/1.12.1/deploy/install/install-with-argocd/

# CSI sidecar pins (chart v1.12.1 defaults attacher to v4.12.0)
image:
  csi:
    attacher:
      repository: longhornio/csi-attacher
      tag: v4.13.0

preUpgradeChecker:
  jobEnabled: false

ingress:
  enabled: false

persistence:
  defaultClass: true
  defaultClassReplicaCount: 3

defaultSettings:
  createDefaultDiskLabeledNodes: true
  defaultDataPath: /var/lib/longhorn
  defaultReplicaCount: 3
  # Workers have ~32Gi disks; 100% over-provision left too little schedulable headroom for new PVCs
  storageOverProvisioningPercentage: "200"

defaultBackupStore:
  # UniFi NAS export requires NFSv3 (v4 returns "No such file or directory").
  backupTarget: nfs://192.168.0.25:/var/nfs/shared/infra01/longhorn-backups?nfsOptions=nfsvers=3,nolock

metrics:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
