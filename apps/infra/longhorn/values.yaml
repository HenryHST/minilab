# Longhorn v1.13.0 — https://longhorn.io/docs/1.13.0/deploy/install/install-with-argocd/

# CSI sidecar pins (match chart v1.13.0 defaults)
image:
  csi:
    attacher:
      repository: longhornio/csi-attacher
      tag: v4.13.0
    provisioner:
      repository: longhornio/csi-provisioner
      tag: v6.3.0

preUpgradeChecker:
  jobEnabled: false

ingress:
  enabled: false

persistence:
  defaultClass: true
  defaultClassReplicaCount: 3

defaultSettings:
  createDefaultDiskLabeledNodes: true
  defaultDataPath: /var/lib/longhorn
  defaultReplicaCount: 3
  # 80G×6 Proxmox disk nodes: 200% over-provision filled root before Longhorn refused
  # schedules (DiskPressure 2026-10-28). 150% keeps headroom while allowing mild thin provision.
  storageOverProvisioningPercentage: "150"
  # On node death, force-delete Deployment/STS pods so RWO VolumeAttachments release
  # (trade-off: abrupt pod kill; prefer Proxmox-only scheduling for stateful workloads).
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
  # Percent of node allocatable CPU reserved for each Instance Manager (v1).
  # Keep low on 3-allocatable-CPU Proxmox workers so IM can schedule under request pressure
  # (incident 2026-10-21: 150m Guaranteed failed OutOfcpu). Plain integer string — JSON
  # {"v1":"5","v2":"5"} stays applied=false on Longhorn 1.12+/1.13.
  # Per-node override: manifests/im-cpu-enforcer.yaml sets instanceManagerCPURequest=50.
  guaranteedInstanceManagerCPU: "5"

defaultBackupStore:
  # RustFS on pi7cl (S3). Rollback NFS:
  # nfs://192.168.0.25:/var/nfs/shared/infra01/longhorn-backups?nfsOptions=nfsvers=3,nolock
  backupTarget: s3://longhorn-backups@us-east-1/
  backupTargetCredentialSecret: longhorn-backup-s3


metrics:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
