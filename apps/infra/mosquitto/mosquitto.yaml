# Mosquitto MQTT broker — LDAP auth via Authentik Outpost; LAN LB 192.168.0.218.
# Image: ghcr.io/henryhst/mosquitto-custom (Mosquitto 2.1.2 glibc + vendored go-auth).
# Cilium L2 pool: 215 Traefik, 216 Authentik LDAP, 217 Alloy → 218 Mosquitto.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mosquitto-data
  namespace: mosquitto
  labels:
    app: mosquitto
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: mosquitto
  labels:
    app: mosquitto
data:
  mosquitto.conf: |
    persistence true
    persistence_location /mosquitto/data/
    log_dest stdout
    log_type error
    log_type warning
    log_type notice
    allow_anonymous false
    per_listener_settings false
    # Publish $SYS/# for sapcc/mosquitto-exporter (Prometheus)
    sys_interval 10

    listener 1883
    protocol mqtt

    listener 8883
    protocol mqtt
    certfile /mosquitto/certs/tls.crt
    keyfile /mosquitto/certs/tls.key
    require_certificate false

    listener 9001
    protocol websockets
    certfile /mosquitto/certs/tls.crt
    keyfile /mosquitto/certs/tls.key
    require_certificate false

    auth_plugin /mosquitto/go-auth.so
    auth_opt_backends ldap
    auth_opt_log_level info
    auth_opt_log_dest stdout

    auth_opt_ldap_url ldap://ak-outpost-ldap-stadthagen-outpost.authentik.svc.cluster.local:389
    auth_opt_ldap_user_dn ou=users,dc=ldap,dc=stadthagen,dc=dev
    auth_opt_ldap_group_dn ou=groups,dc=ldap,dc=stadthagen,dc=dev
    auth_opt_ldap_bind_dn cn=ldapservice,ou=users,dc=ldap,dc=stadthagen,dc=dev
    # auth_opt_ldap_bind_password injected by init config-bootstrap (include_dir breaks plugin opts)
    auth_opt_ldap_user_filter (&(cn=%s)(|(memberOf=cn=mqtt_users,ou=groups,dc=ldap,dc=stadthagen,dc=dev)(memberOf=cn=mqtt_admins,ou=groups,dc=ldap,dc=stadthagen,dc=dev)))
    auth_opt_ldap_superuser_filter (&(cn=%s)(memberOf=cn=mqtt_admins,ou=groups,dc=ldap,dc=stadthagen,dc=dev))
---
apiVersion: v1
kind: Service
metadata:
  name: mqtt
  namespace: mosquitto
  labels:
    app: mosquitto
spec:
  type: LoadBalancer
  # Cilium L2 pool 215–218: Traefik/LDAP/Alloy → 218 free for Mosquitto
  loadBalancerIP: 192.168.0.218
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
      protocol: TCP
    - name: mqtts
      port: 8883
      targetPort: mqtts
      protocol: TCP
    - name: websocket
      port: 9001
      targetPort: websocket
      protocol: TCP
  selector:
    app: mosquitto
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-ldap-preflight
  namespace: mosquitto
  labels:
    app: mosquitto
data:
  ldap-preflight.sh: |
    #!/bin/bash
    # Fail in init, with a specific message, instead of letting go-auth CrashLoopBackOff the broker.
    set -euo pipefail
    CONF="${CONF:-/config/mosquitto.conf}"
    ATTEMPTS="${LDAP_PREFLIGHT_ATTEMPTS:-40}"
    INTERVAL="${LDAP_PREFLIGHT_INTERVAL:-15}"

    url=$(awk '/^auth_opt_ldap_url / {print $2; exit}' "$CONF")
    rest=${url#ldap://}
    hostport=${rest%%/*}
    host=${hostport%%:*}
    port=${hostport##*:}
    dn=$(awk '/^auth_opt_ldap_bind_dn / {sub(/^auth_opt_ldap_bind_dn /,""); print; exit}' "$CONF")
    line=$(grep -E '^auth_opt_ldap_bind_password ' "$CONF" | head -n1 || true)
    pw=${line#auth_opt_ldap_bind_password }

    if [ -z "$url" ] || [ -z "$host" ] || [ -z "$port" ] || [ "$port" = "$hostport" ]; then
      echo "ldap-preflight: rendered mosquitto.conf has no auth_opt_ldap_url ldap://host:port." >&2
      exit 1
    fi
    if [ -z "$line" ] || [ -z "$pw" ]; then
      echo "ldap-preflight: rendered mosquitto.conf has no auth_opt_ldap_bind_password." >&2
      echo "ldap-preflight: Secret mosquitto/mosquitto-ldap must contain that line. Source is SecretSpec MOSQUITTO_LDAP_BIND_PASSWORD." >&2
      exit 1
    fi
    if [[ "$pw" =~ ^[[:space:]] ]] || [[ "$pw" =~ [[:space:]]$ ]]; then
      echo "ldap-preflight: LDAP bind password has leading or trailing whitespace." >&2
      echo "ldap-preflight: Authentik then returns invalid credentials. Set MOSQUITTO_LDAP_BIND_PASSWORD to the exact Terraform ldapservice_password." >&2
      exit 1
    fi

    emit() {
      local bind_dn="$1" password="$2" dn_len pw_len body_len msg_len
      dn_len=$(printf '%s' "$bind_dn" | wc -c | tr -d ' ')
      pw_len=$(printf '%s' "$password" | wc -c | tr -d ' ')
      if [ "$dn_len" -ge 128 ] || [ "$pw_len" -ge 128 ]; then
        echo "ldap-preflight: bind DN or password is longer than 127 bytes; refusing to send a truncated LDAP packet." >&2
        exit 1
      fi
      body_len=$((3 + 2 + dn_len + 2 + pw_len))
      msg_len=$((3 + 2 + body_len))
      printf '\x30'
      printf "\\x$(printf '%02x' "$msg_len")"
      printf '\x02\x01\x01\x60'
      printf "\\x$(printf '%02x' "$body_len")"
      printf '\x02\x01\x03\x04'
      printf "\\x$(printf '%02x' "$dn_len")"
      printf '%s' "$bind_dn"
      printf '\x80'
      printf "\\x$(printf '%02x' "$pw_len")"
      printf '%s' "$password"
    }

    ldap_code() {
      local password="$1" len code
      exec 3<>"/dev/tcp/${ip}/${port}"
      emit "$dn" "$password" >&3
      dd bs=1 count=2 <&3 >/tmp/ldap.hdr status=none
      len=$(od -An -tu1 /tmp/ldap.hdr | awk '{print $2}')
      dd bs=1 count="$len" <&3 >/tmp/ldap.body status=none
      exec 3<&- || true
      exec 3>&- || true
      code=$(od -An -tu1 /tmp/ldap.hdr /tmp/ldap.body | awk '{
        for (i = 1; i <= NF; i++) a[++n] = $i
      }
      END {
        c = -1
        for (i = 1; i <= n - 2; i++) if (a[i] == 10 && a[i + 1] == 1) { c = a[i + 2]; break }
        print c
      }')
      rm -f /tmp/ldap.hdr /tmp/ldap.body
      printf '%s\n' "$code"
    }

    ip=""
    for ((n = 1; n <= ATTEMPTS; n++)); do
      ip=$(getent ahostsv4 "$host" | awk 'NR==1 {print $1}')
      if [ -n "$ip" ] && bash -c "echo >/dev/tcp/${ip}/${port}" >/dev/null 2>&1; then
        break
      fi
      if [ -z "$ip" ]; then
        echo "ldap-preflight: DNS has no A record for ${host} (attempt ${n}/${ATTEMPTS})." >&2
      else
        echo "ldap-preflight: ${host} (${ip}:${port}) is not accepting LDAP connections (attempt ${n}/${ATTEMPTS})." >&2
      fi
      echo "ldap-preflight: Mosquitto stays in init until the Authentik outpost listens. go-auth would otherwise exit immediately and CrashLoopBackOff." >&2
      echo "ldap-preflight: Check kubectl -n authentik logs deploy/ak-outpost-ldap-stadthagen-outpost -c ldap" >&2
      if [ "$n" -eq "$ATTEMPTS" ]; then
        echo "ldap-preflight: giving up after $((ATTEMPTS * INTERVAL))s." >&2
        exit 1
      fi
      sleep "$INTERVAL"
    done

    code=$(ldap_code "$pw")
    case "$code" in
      0)
        echo "ldap-preflight: LDAP simple bind succeeded for ${dn} at ldap://${host}:${port}."
        ;;
      49)
        echo "ldap-preflight: LDAP bind rejected (invalid credentials) for ${dn}." >&2
        echo "ldap-preflight: Secret mosquitto/mosquitto-ldap key 00-bind.conf does not match the Authentik user ldapservice." >&2
        echo "ldap-preflight: MOSQUITTO_LDAP_BIND_PASSWORD must be exactly Terraform ldapservice_password, then re-run ansible-playbook site.yaml --tags secrets and restart the pod." >&2
        exit 1
        ;;
      *)
        echo "ldap-preflight: LDAP bind to ldap://${host}:${port} failed with result code ${code} for ${dn}." >&2
        exit 1
        ;;
    esac
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: mosquitto
  labels:
    app: mosquitto
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      securityContext:
        fsGroup: 1883
      # Standalone image v1.1.1 is linux/amd64 (arm64 multi-arch follow-up)
      nodeSelector:
        kubernetes.io/arch: amd64
      initContainers:
        # cert-manager Secret mqtt-pro-tls may lag (DNS-01); bootstrap so 1883 can start for Grafana.
        # Also inject LDAP bind password into mosquitto.conf (include_dir + auth_opt_ is rejected by Mosquitto).
        - name: tls-bootstrap
          image: alpine/openssl:3.3.2
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              if [ -s /tls-secret/tls.crt ] && [ -s /tls-secret/tls.key ]; then
                cp /tls-secret/tls.crt /tls-secret/tls.key /mosquitto/certs/
                echo "tls-bootstrap: using cert-manager secret mqtt-pro-tls"
              else
                openssl req -x509 -nodes -newkey rsa:2048 \
                  -keyout /mosquitto/certs/tls.key \
                  -out /mosquitto/certs/tls.crt \
                  -days 30 \
                  -subj "/CN=mqtt-pro.stadthagen.dev"
                echo "tls-bootstrap: generated self-signed placeholder (await mqtt-pro-tls)"
              fi
              # Mosquitto runs as uid 1883; openssl writes root-owned files that
              # fsGroup alone does not make group-readable for the app container.
              chown 1883:1883 /mosquitto/certs/tls.crt /mosquitto/certs/tls.key
              chmod 644 /mosquitto/certs/tls.crt
              chmod 600 /mosquitto/certs/tls.key

              cp /config-src/mosquitto.conf /config/mosquitto.conf
              BIND_LINE=$(grep -E '^auth_opt_ldap_bind_password ' /ldap-secret/00-bind.conf | head -n1)
              if [ -z "${BIND_LINE}" ]; then
                echo "tls-bootstrap: Secret mosquitto/mosquitto-ldap has no line 'auth_opt_ldap_bind_password <password>'." >&2
                echo "tls-bootstrap: Set SecretSpec MOSQUITTO_LDAP_BIND_PASSWORD to Terraform ldapservice_password, then ansible-playbook site.yaml --tags secrets." >&2
                exit 1
              fi
              # Insert bind password immediately after auth_plugin line (same conf file as plugin).
              awk -v line="$BIND_LINE" '
                { print }
                /^auth_plugin / { print line }
              ' /config/mosquitto.conf > /config/mosquitto.conf.tmp
              mv /config/mosquitto.conf.tmp /config/mosquitto.conf
              echo "tls-bootstrap: rendered mosquitto.conf with LDAP bind password"
          volumeMounts:
            - name: tls
              mountPath: /mosquitto/certs
            - name: tls-secret
              mountPath: /tls-secret
              readOnly: true
            - name: config-src
              mountPath: /config-src
              readOnly: true
            - name: config
              mountPath: /config
            - name: ldap-secret
              mountPath: /ldap-secret
              readOnly: true
        # go-auth aborts the broker process when LDAP is down or the bind password is wrong.
        # Kubernetes then CrashLoopBackOffs and hides the cause. Wait here, and say which of the two it is.
        - name: ldap-preflight
          image: ghcr.io/henryhst/mosquitto-custom:1.1.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/preflight/ldap-preflight.sh"]
          env:
            - name: LDAP_PREFLIGHT_ATTEMPTS
              value: "40"
            - name: LDAP_PREFLIGHT_INTERVAL
              value: "15"
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: ldap-preflight
              mountPath: /preflight
              readOnly: true
      containers:
        - name: mosquitto
          securityContext:
            runAsUser: 1883
            runAsGroup: 1883
          image: ghcr.io/henryhst/mosquitto-custom:1.1.1
          imagePullPolicy: IfNotPresent
          args:
            - /usr/sbin/mosquitto
            - -c
            - /mosquitto/config/mosquitto.conf
          ports:
            - name: mqtt
              containerPort: 1883
            - name: mqtts
              containerPort: 8883
            - name: websocket
              containerPort: 9001
          readinessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
              readOnly: true
            - name: tls
              mountPath: /mosquitto/certs
              readOnly: true
            - name: data
              mountPath: /mosquitto/data
      volumes:
        - name: config-src
          configMap:
            name: mosquitto-config
        - name: config
          emptyDir: {}
        - name: ldap-secret
          secret:
            secretName: mosquitto-ldap
        - name: ldap-preflight
          configMap:
            name: mosquitto-ldap-preflight
            defaultMode: 0555
        - name: tls
          emptyDir: {}
        - name: tls-secret
          secret:
            secretName: mqtt-pro-tls
            optional: true
        - name: data
          persistentVolumeClaim:
            claimName: mosquitto-data
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mosquitto
  namespace: mosquitto
  labels:
    app: mosquitto
spec:
  podSelector:
    matchLabels:
      app: mosquitto
  policyTypes:
    - Ingress
  ingress:
    # LAN clients via Cilium LB .218 + in-cluster (Grafana, etc.)
    - ports:
        - protocol: TCP
          port: 1883
        - protocol: TCP
          port: 8883
        - protocol: TCP
          port: 9001
