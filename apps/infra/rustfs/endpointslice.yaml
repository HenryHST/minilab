apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: rustfs-console
  namespace: rustfs
  labels:
    kubernetes.io/service-name: rustfs-console
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/component: console
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 9001
endpoints:
  - addresses:
      - "192.168.0.107"
    conditions:
      ready: true
      serving: true
      terminating: false
