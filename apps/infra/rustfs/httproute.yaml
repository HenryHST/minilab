# Migrated from Traefik IngressRoute → Cilium Gateway API HTTPRoute.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateway-tls-rustfs-tls
  namespace: rustfs
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: gateway-system
  to:
  - group: ''
    kind: Secret
    name: rustfs-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-console
  namespace: rustfs
  labels:
    app.kubernetes.io/name: rustfs-console
    app.kubernetes.io/part-of: rustfs
spec:
  parentRefs:
  - name: nxk3
    namespace: gateway-system
    sectionName: https-rustfs
  hostnames:
  - rustfs.stadthagen.dev
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: rustfs-console
      port: 9001
