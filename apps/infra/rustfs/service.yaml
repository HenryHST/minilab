# Service without selector — backends via EndpointSlice (pi7cl host Docker :9001).
apiVersion: v1
kind: Service
metadata:
  name: rustfs-console
  namespace: rustfs
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/component: console
spec:
  ports:
    - name: http
      port: 9001
      targetPort: 9001
      protocol: TCP
