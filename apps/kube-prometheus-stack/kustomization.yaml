apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - namespace.yaml
  - grafana-pvc.yaml
  - certificate.yaml
  - ingressroute.yaml
  - homelab-alerts.yaml
  - networkpolicy.yaml
  - datasources.yaml
  - dashboard-proxmox-syslog.yaml

# Helm chart is rendered via native Argo CD Helm source (see argocd-apps/kube-prometheus-stack.yaml).
# Kustomize helmCharts would hit the repo-server CMP sidecar (:8081) and fail on this large chart.
