apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: loki
helmCharts:
  - name: loki
    repo: https://grafana-community.github.io/helm-charts
    version: 18.9.0
    releaseName: loki
    namespace: loki
    valuesFile: values.yaml
resources:
  - storageclass.yaml
  - pvc.yaml
  - certificate.yaml
  - ingressroute.yaml
