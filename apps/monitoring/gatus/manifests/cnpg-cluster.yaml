# Gatus history on CloudNativePG. Recovery point is a Longhorn VolumeSnapshot
# (ScheduledBackup gatus-snapshot). The pg_dump CronJob remains the off-cluster copy.
#
# 2026-10-21: primary recreated on healthy workers after nxk3-w02 Longhorn
# instance-manager could not schedule (OutOfcpu / stale kubelet accounting).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gatus
  namespace: status
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: gatus
    app.kubernetes.io/part-of: gatus
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:16.15-202610190958-standard-bookworm
  certificates:
    serverCASecret: gatus-server-tls
    serverTLSSecret: gatus-server-tls
  bootstrap:
    initdb:
      database: gatus
      owner: gatus
      secret:
        name: gatus-db
  storage:
    # Was 2Gi; Longhorn actualSize grew to ~3–9Gi via accumulated VolumeSnapshots
    # (filesystem use inside PG ~0.6Gi). Expand for headroom + snapshot chain.
    size: 16Gi
    storageClass: longhorn
  affinity:
    nodeSelector:
      worker: "true"
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
  monitoring:
    enablePodMonitor: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  backup:
    target: primary
    retentionPolicy: "7d"
    volumeSnapshot:
      className: longhorn
      online: true
      snapshotOwnerReference: backup
