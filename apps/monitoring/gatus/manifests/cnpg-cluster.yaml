# Gatus history on CloudNativePG.
# 2026-10-21: recover from VolumeSnapshot after primary PVC stuck on nxk3-w02.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gatus
  namespace: status
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: gatus
    app.kubernetes.io/part-of: gatus
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  certificates:
    serverCASecret: gatus-server-tls
    serverTLSSecret: gatus-server-tls
  bootstrap:
    recovery:
      volumeSnapshots:
        storage:
          apiGroup: snapshot.storage.k8s.io
          kind: VolumeSnapshot
          name: gatus-snapshot-20261021061500
      database: gatus
      owner: gatus
      secret:
        name: gatus-db
  storage:
    size: 1Gi
    storageClass: longhorn
  affinity:
    nodeSelector:
      worker: "true"
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - nxk3-w02
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
  monitoring:
    enablePodMonitor: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  backup:
    target: primary
    volumeSnapshot:
      className: longhorn
      online: true
      snapshotOwnerReference: backup
