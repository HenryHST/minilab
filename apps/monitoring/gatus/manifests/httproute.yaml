# Chart Service gatus listens on port 80 and targets container port 8080.
# More-specific /uebersicht rule listed first (longest-prefix / rule order).
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateway-tls-status-tls
  namespace: status
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: gateway-system
  to:
    - group: ""
      kind: Secret
      name: status-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gatus
  namespace: status
  labels:
    app.kubernetes.io/name: gatus
    app.kubernetes.io/part-of: status
spec:
  parentRefs:
    - name: nxk3
      namespace: gateway-system
      sectionName: https-status
  hostnames:
    - status.stadthagen.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /uebersicht
      backendRefs:
        - name: gatus-overview
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gatus
          port: 80
