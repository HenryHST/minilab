# Ingress allow Traefik, Prometheus, and in-namespace. Egress stays open (HTTP checks, OIDC, Postgres).
# Pod port is the chart targetPort 8080. Selector matches the Helm release labels.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gatus-ingress
  namespace: status
  labels:
    app.kubernetes.io/name: gatus
    app.kubernetes.io/part-of: gatus
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gatus
      app.kubernetes.io/instance: gatus
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: status
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
