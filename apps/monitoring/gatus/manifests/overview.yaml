# Anonymous health badges. The dashboard at / stays behind Authentik OIDC.
# Badge keys are group_name from values.yaml. Add a check there and an img here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-overview
  namespace: status
  labels:
    app.kubernetes.io/name: gatus-overview
    app.kubernetes.io/part-of: gatus
data:
  default.conf: |
    # alias → file under location with trailing "/" becomes index.htmlindex.html (nginx).
    # Use root + try_files so readiness GET /uebersicht/ returns 200.
    server {
      listen 8080;
      server_name _;
      absolute_redirect off;
      root /usr/share/nginx/html;

      location = /uebersicht {
        return 301 /uebersicht/;
      }

      location = /uebersicht/ {
        default_type text/html;
        add_header Content-Security-Policy "frame-ancestors https://web.stadthagen.dev" always;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
      }

      # Public brand assets for Gatus ui.logo / ui.favicon (Authentik /media not HTTP-exposed).
      location /uebersicht/branding/ {
        alias /usr/share/nginx/html/branding/;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Content-Security-Policy "frame-ancestors https://web.stadthagen.dev" always;
      }
    }
  index.html: |
    <!DOCTYPE html>
    <html lang="de">
    <head>
      <meta charset="utf-8">
      <meta http-equiv="refresh" content="60">
      <title>Stadthagen Home · Umgebung</title>
      <link rel="icon" href="/uebersicht/branding/favicon.png" type="image/png">
      <style>
        :root { --ak-accent: #2563eb; --ak-primary: #1d4ed8; }
        body { margin: 0; padding: 8px 10px; background: transparent; color: #e8e8e8; font: 13px/1.4 system-ui, sans-serif; }
        h1 { font-size: 14px; font-weight: 600; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
        h1 img { height: 22px; width: 22px; margin: 0; }
        h1 a { color: var(--ak-accent); text-decoration: none; }
        h1 a:hover { color: var(--ak-primary); }
        h2 { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; margin: 10px 0 4px; opacity: .7; color: #93c5fd; }
        img { height: 20px; margin: 0 4px 4px 0; vertical-align: middle; }
      </style>
    </head>
    <body>
      <h1><img src="/uebersicht/branding/logo.png" alt=""><a href="https://status.stadthagen.dev" title="Gatus-Dashboard (OIDC)">Stadthagen Home · Umgebung</a></h1>
      <!-- nXk3 cluster: Kromgo PromQL badges (LAN-only, ADR-0019). Not Gatus HTTP checks. -->
      <!-- title= Browser-Tooltip; alt bleibt als Fallback/Screenreader -->
      <h2 title="Kromgo PromQL (LAN)">nXk3 cluster</h2>
      <img alt="nodes_ready" title="Nodes Ready (Kromgo)" src="https://kromgo.stadthagen.dev/badges/nodes_ready">
      <img alt="nodes_notready" title="Nodes NotReady (Kromgo)" src="https://kromgo.stadthagen.dev/badges/nodes_notready">
      <img alt="disk_pressure" title="Nodes mit DiskPressure (Kromgo)" src="https://kromgo.stadthagen.dev/badges/disk_pressure">
      <img alt="memory_pressure" title="Nodes mit MemoryPressure (Kromgo)" src="https://kromgo.stadthagen.dev/badges/memory_pressure">
      <img alt="root_free_min" title="Min. freier Speicher auf / in % (Kromgo)" src="https://kromgo.stadthagen.dev/badges/root_free_min">
      <img alt="longhorn_ready" title="Longhorn Ready auf Worker-Nodes (Kromgo)" src="https://kromgo.stadthagen.dev/badges/longhorn_ready">
      <img alt="cilium_unavailable" title="Cilium DaemonSet unavailable (Kromgo)" src="https://kromgo.stadthagen.dev/badges/cilium_unavailable">
      <!-- Pi agents: Kromgo only (ADR-0034: no ICMP/node HTTP in Gatus). -->
      <h2 title="Pi-Nodes Ready via Kromgo">nXk3 pis</h2>
      <img alt="pi1cl_ready" title="pi1cl Ready (Kromgo)" src="https://kromgo.stadthagen.dev/badges/pi1cl_ready">
      <img alt="pi2cl_ready" title="pi2cl Ready (Kromgo)" src="https://kromgo.stadthagen.dev/badges/pi2cl_ready">
      <img alt="pi4cl_ready" title="pi4cl Ready (Kromgo)" src="https://kromgo.stadthagen.dev/badges/pi4cl_ready">
      <img alt="pi7cl_ready" title="pi7cl Ready (Kromgo)" src="https://kromgo.stadthagen.dev/badges/pi7cl_ready">
      <h2 title="HTTP 200 auf App-URL">homelab</h2>
      <img alt="authentik" title="Authentik — HTTP 200 (idp.stadthagen.dev)" src="/api/v1/endpoints/homelab_authentik/health/badge.svg">
      <img alt="it-tools" title="IT Tools — HTTP 200" src="/api/v1/endpoints/homelab_it-tools/health/badge.svg">
      <img alt="paperless" title="Paperless — HTTP 200" src="/api/v1/endpoints/homelab_paperless/health/badge.svg">
      <img alt="bookstack" title="BookStack — HTTP 200" src="/api/v1/endpoints/homelab_bookstack/health/badge.svg">
      <h2 title="HTTP 200 auf App-URL">apps</h2>
      <img alt="omni-tools" title="Omni Tools — HTTP 200" src="/api/v1/endpoints/apps_omni-tools/health/badge.svg">
      <img alt="searxng" title="SearXNG — HTTP 200" src="/api/v1/endpoints/apps_searxng/health/badge.svg">
      <img alt="drawio" title="Draw.io — HTTP 200" src="/api/v1/endpoints/apps_drawio/health/badge.svg">
      <img alt="termix" title="Termix — HTTP 200" src="/api/v1/endpoints/apps_termix/health/badge.svg">
      <img alt="bytestash" title="ByteStash — HTTP 200" src="/api/v1/endpoints/apps_bytestash/health/badge.svg">
      <img alt="audiobookshelf" title="Audiobookshelf — HTTP 200" src="/api/v1/endpoints/apps_audiobookshelf/health/badge.svg">
      <img alt="homepage" title="Homepage — HTTP 200" src="/api/v1/endpoints/apps_homepage/health/badge.svg">
      <img alt="pgweb" title="pgweb — HTTP 200" src="/api/v1/endpoints/apps_pgweb/health/badge.svg">
      <img alt="vaultwarden" title="Vaultwarden — HTTP 200 (/alive)" src="/api/v1/endpoints/apps_vaultwarden/health/badge.svg">
      <img alt="karakeep" title="Karakeep — HTTP 200" src="/api/v1/endpoints/apps_karakeep/health/badge.svg">
      <img alt="kromgo" title="Kromgo — HTTP 200" src="/api/v1/endpoints/apps_kromgo/health/badge.svg">
      <img alt="longhorn" title="Longhorn UI — HTTP 200" src="/api/v1/endpoints/apps_longhorn/health/badge.svg">
      <img alt="headlamp" title="Headlamp — HTTP 200" src="/api/v1/endpoints/apps_headlamp/health/badge.svg">
      <h2 title="HTTP 200 auf Health-Pfaden">plattform</h2>
      <img alt="grafana" title="Grafana — HTTP 200 (/api/health)" src="/api/v1/endpoints/plattform_grafana/health/badge.svg">
      <img alt="prometheus" title="Prometheus — HTTP 200 (/-/healthy)" src="/api/v1/endpoints/plattform_prometheus/health/badge.svg">
      <img alt="alertmanager" title="Alertmanager — HTTP 200 (/-/healthy)" src="/api/v1/endpoints/plattform_alertmanager/health/badge.svg">
      <img alt="loki" title="Loki — HTTP 200 (buildinfo)" src="/api/v1/endpoints/plattform_loki/health/badge.svg">
      <img alt="argocd" title="Argo CD — HTTP 200 (/healthz)" src="/api/v1/endpoints/plattform_argocd/health/badge.svg">
      <img alt="wud" title="WUD — HTTP 200 (/health)" src="/api/v1/endpoints/plattform_wud/health/badge.svg">
      <img alt="forgejo" title="Forgejo — HTTP 200 (/api/healthz)" src="/api/v1/endpoints/plattform_forgejo/health/badge.svg">
      <h2 title="ForwardAuth: unauth erwartet HTTP 302">sso</h2>
      <img alt="hubble" title="Hubble UI — ForwardAuth/SSO, erwartet HTTP 302" src="/api/v1/endpoints/sso_hubble/health/badge.svg">
      <img alt="stirling-pdf" title="Stirling PDF — ForwardAuth, erwartet HTTP 302" src="/api/v1/endpoints/sso_stirling-pdf/health/badge.svg">
      <h2 title="Object Storage / Console OIDC">storage</h2>
      <img alt="rustfs" title="RustFS S3 health — HTTP 200 (:9000/health)" src="/api/v1/endpoints/storage_rustfs/health/badge.svg">
      <img alt="rustfs-console-oidc" title="RustFS Console OIDC providers — HTTP 200" src="/api/v1/endpoints/storage_rustfs-console-oidc/health/badge.svg">
      <h2 title="Externe Dienste">extern</h2>
      <img alt="pangolin" title="Pangolin — HTTP 200" src="/api/v1/endpoints/extern_pangolin/health/badge.svg">
      <img alt="mail" title="Mail Web — HTTP 200 (mail.henrystadthagen.de)" src="/api/v1/endpoints/extern_mail/health/badge.svg">
      <img alt="mail-smtp" title="Mail SMTP — TCP 465 erreichbar" src="/api/v1/endpoints/extern_mail-smtp/health/badge.svg">
    </body>
    </html>
binaryData:
  favicon.png: 
  logo.png: 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus-overview
  namespace: status
  labels:
    app.kubernetes.io/name: gatus-overview
    app.kubernetes.io/part-of: gatus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gatus-overview
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gatus-overview
        app.kubernetes.io/part-of: gatus
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        worker: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /uebersicht/
              port: http
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: html
              mountPath: /usr/share/nginx/html
            - name: branding
              mountPath: /usr/share/nginx/html/branding
      volumes:
        - name: nginx-conf
          configMap:
            name: gatus-overview
            items:
              - key: default.conf
                path: default.conf
        - name: html
          configMap:
            name: gatus-overview
            items:
              - key: index.html
                path: index.html
        - name: branding
          configMap:
            name: gatus-overview
            items:
              - key: favicon.png
                path: favicon.png
              - key: logo.png
                path: logo.png
---
apiVersion: v1
kind: Service
metadata:
  name: gatus-overview
  namespace: status
  labels:
    app.kubernetes.io/name: gatus-overview
    app.kubernetes.io/part-of: gatus
spec:
  selector:
    app.kubernetes.io/name: gatus-overview
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gatus-overview-ingress
  namespace: status
  labels:
    app.kubernetes.io/name: gatus-overview
    app.kubernetes.io/part-of: gatus
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gatus-overview
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080
