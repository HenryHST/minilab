# Replaces the deprecated Cluster field monitoring.enablePodMonitor.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: gatus-instances
  namespace: status
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: gatus
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: gatus
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
