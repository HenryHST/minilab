# Cluster-scoped. Keeps the status page schedulable under mild node pressure.
# Chart value: priorityClassName: gatus-prefer
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: gatus-prefer
  labels:
    app.kubernetes.io/name: gatus
    app.kubernetes.io/part-of: gatus
value: 1000000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: Prefer Gatus (status.stadthagen.dev) over best-effort workloads
