# Six-field cron (seconds first). Every 6 hours, :15. RPO is that interval.
# This is a consistent Longhorn snapshot, not WAL PITR. pg_dump at 01:00 UTC stays.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: gatus-snapshot
  namespace: status
  labels:
    app.kubernetes.io/name: gatus
    app.kubernetes.io/part-of: gatus
spec:
  schedule: "0 15 */6 * * *"
  immediate: true
  method: volumeSnapshot
  backupOwnerReference: cluster
  cluster:
    name: gatus
  target: primary
  online: true
