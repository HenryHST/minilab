# Six-field cron (seconds first). Daily 06:15 UTC (was every 6h — LH actualSize
# ballooned to ~9Gi on a 2Gi claim from snapshot chains; FS use ~0.6Gi).
# Consistent Longhorn snapshot, not WAL PITR. pg_dump CronJob remains off-cluster copy.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: gatus-snapshot
  namespace: status
  labels:
    app.kubernetes.io/name: gatus
    app.kubernetes.io/part-of: gatus
spec:
  schedule: "0 15 6 * * *"
  immediate: false
  method: volumeSnapshot
  backupOwnerReference: cluster
  cluster:
    name: gatus
  target: primary
  online: true
