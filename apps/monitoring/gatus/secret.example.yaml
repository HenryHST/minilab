# Not applied by Argo. Create via Infra_LAB SecretSpec before the first sync.
# ansible-playbook site.yaml --tags secrets
#
# Secret gatus-db (namespace status) — CloudNativePG bootstrap:
#   username: gatus
#   password: <GATUS_DB_PASSWORD>
#   POSTGRES_PASSWORD: <GATUS_DB_PASSWORD>
#
# Secret gatus-env (namespace status):
#   GATUS_DATABASE_URL: postgres://gatus:<GATUS_DB_PASSWORD>@gatus-rw.status.svc.cluster.local:5432/gatus?sslmode=require
#   GATUS_OIDC_CLIENT_SECRET: <GATUS_OAUTH_CLIENT_SECRET>  # same value as terraform gatus_oauth_client_secret
#   PUSHOVER_APP_TOKEN: <GATUS_PUSHOVER_APP_TOKEN>          # dedicated Pushover application, not the Argo CD token
#   PUSHOVER_USER_KEY: <PUSHOVER_USER_KEY>                  # same user key as Argo CD notifications
