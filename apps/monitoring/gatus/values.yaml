# Native Argo Helm: twin/gatus 1.5.0; image pin twinproduction/gatus:v5.37.0.
# Secrets stay in Secret gatus-env (Infra_LAB SecretSpec). Gatus substitutes ${VAR} at startup.
# Chart ingress and sqlite persistence stay off: Traefik IngressRoute + CloudNativePG.

# Chart hardcodes replicas: 1 (TwiN/helm-charts). Gatus has no leader election yet
# (upstream #176 open) — do not scale the Deployment; duplicate checks/alerts.
deployment:
  strategy: RollingUpdate

image:
  repository: twinproduction/gatus
  tag: v5.37.0
  pullPolicy: IfNotPresent

# Prefer Gatus under node pressure (PriorityClass in manifests/priorityclass.yaml).
priorityClassName: gatus-prefer

readinessProbe:
  enabled: true

livenessProbe:
  enabled: true

nodeSelector:
  worker: "true"

podSecurityContext:
  fsGroup: 65534

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 768Mi

ingress:
  enabled: false

persistence:
  enabled: false

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
  path: /metrics
  interval: 1m
  # Chart default {} is truthy and would emit an empty tlsConfig block.
  tlsConfig: null

envFrom:
  - secretRef:
      name: gatus-env

config:
  metrics: true
  # Cap parallel checks so slow endpoints do not stampede the single replica.
  concurrency: 5
  storage:
    type: postgres
    path: ${GATUS_DATABASE_URL}
  security:
    oidc:
      issuer-url: https://idp.stadthagen.dev/application/o/gatus/
      client-id: gatus
      client-secret: ${GATUS_OIDC_CLIENT_SECRET}
      redirect-url: https://status.stadthagen.dev/authorization-code/callback
      scopes:
        - openid
        - profile
        - email
  alerting:
    pushover:
      application-token: ${PUSHOVER_APP_TOKEN}
      user-key: ${PUSHOVER_USER_KEY}
  endpoints:
    - name: authentik
      group: homelab
      url: https://idp.stadthagen.dev
      interval: 1m
      client:
        timeout: 10s
      # Scale-to-0 backup windows (CronJobs authentik-backup-0230 / -1150)
      maintenance-windows:
        - start: "02:30"
          duration: 30m
          timezone: Europe/Berlin
        - start: "11:50"
          duration: 30m
          timezone: Europe/Berlin
      conditions:
        - "[STATUS] == 200"
      alerts: &pushover
        - type: pushover
          failure-threshold: 4
          success-threshold: 2
          send-on-resolved: true
    - name: it-tools
      group: homelab
      url: https://it-tools.stadthagen.dev
      interval: 2m
      client:
        timeout: 10s
      conditions:
        - "[STATUS] == 200"
      alerts: *pushover
    - name: paperless
      group: homelab
      url: https://paperless.stadthagen.dev
      interval: 1m
      client:
        timeout: 10s
      # Own window (decoupled from Authentik Berlin backup slots)
      maintenance:
        start: "05:00"
        duration: 30m
        timezone: UTC
      conditions:
        - "[STATUS] == 200"
      alerts: *pushover
    - name: bookstack
      group: homelab
      url: https://book.stadthagen.dev
      interval: 1m
      client:
        timeout: 10s
      maintenance:
        start: "04:00"
        duration: 30m
        timezone: UTC
      conditions:
        - "[STATUS] == 200"
      alerts: *pushover
    - name: omni-tools
      group: apps
      url: https://omni-tools.stadthagen.dev
      interval: 2m
      client:
        timeout: 10s
      conditions:
        - "[STATUS] == 200"
      alerts: *pushover
    - name: searxng
      group: apps
      url: https://searxng.stadthagen.dev
      interval: 2m
      client:
        timeout: 10s
      conditions:
        - "[STATUS] == 200"
      alerts: *pushover
    - name: drawio
      group: apps
      url: https://drawio.stadthagen.dev
      interval: 2m
      client:
        timeout: 10s
      conditions:
        - "[STATUS] == 200"
      alerts: *pushover
    - name: termix
      group: apps
      url: https://termix.stadthagen.dev
      interval: 2m
      client:
        timeout: 10s
      maintenance: &maint-0300
        start: "03:00"
        duration: 30m
        timezone: UTC
      conditions:
        - "[STATUS] == 200"
      alerts: *pushover
    - name: bytestash
