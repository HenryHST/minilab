# Migrated from Traefik IngressRoute → Cilium Gateway API HTTPRoute.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateway-tls-kromgo-tls
  namespace: kromgo
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: gateway-system
  to:
  - group: ''
    kind: Secret
    name: kromgo-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kromgo
  namespace: kromgo
  labels:
    app.kubernetes.io/name: kromgo
    app.kubernetes.io/part-of: kromgo
spec:
  parentRefs:
  - name: nxk3
    namespace: gateway-system
    sectionName: https-kromgo
  hostnames:
  - kromgo.stadthagen.dev
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: kromgo
      port: 8080
