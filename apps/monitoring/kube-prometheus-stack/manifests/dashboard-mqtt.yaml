            "content": "## Mosquitto MQTT\n\nBroker: `mqtt.mosquitto.svc.cluster.local:1883` (in-cluster).\nLAN: `mqtt-pro.stadthagen.dev` — ports **1883** / **8883** / **9001**.\nAuth: Authentik LDAP (`mqtt-grafana` ∈ `mqtt_users`).\n\nLive panels stream only while open (grafana-mqtt-datasource). Broker counters: dashboard **Mosquitto Broker ($SYS)** (Prometheus).\n\nExplore → MQTT → Topic z. B. `wud/#` oder `#`.",
