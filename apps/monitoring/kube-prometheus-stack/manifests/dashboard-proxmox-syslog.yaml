apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-proxmox-syslog
  labels:
    grafana_dashboard: "1"
data:
  proxmox-syslog.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 4, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "options": {
            "content": "## Proxmox syslog (via Alloy → Loki)\n\n| Host | Explore query |\n|------|----------------|\n| all | `{job=\"syslog\"}` |\n| pve01 | `{job=\"syslog\"} \\| host=~\"pve01.*\" or src_ip=\"192.168.0.110\"` |\n| pve02 | `{job=\"syslog\"} \\| host=~\"pve02.*\" or src_ip=\"192.168.0.108\"` |\n| pve03 | `{job=\"syslog\"} \\| host=~\"pve03.*\" or src_ip=\"192.168.0.109\"` |\n\nNote: `or` belongs in the **pipeline** after `\\|`, not between two `{…}` selectors.",
            "mode": "markdown"
          },
          "title": "Queries",
          "type": "text"
        },
        {
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 4 },
          "id": 2,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "showLabels": true,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "editorMode": "code",
              "expr": "{job=\"syslog\"}",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "All Proxmox hosts",
          "type": "logs"
        },
        {
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 10, "w": 8, "x": 0, "y": 14 },
          "id": 3,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "editorMode": "code",
              "expr": "{job=\"syslog\"} | host=~\"pve01.*\" or src_ip=\"192.168.0.110\"",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "pve01",
          "type": "logs"
        },
        {
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 10, "w": 8, "x": 8, "y": 14 },
          "id": 4,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "editorMode": "code",
              "expr": "{job=\"syslog\"} | host=~\"pve02.*\" or src_ip=\"192.168.0.108\"",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "pve02",
          "type": "logs"
        },
        {
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 10, "w": 8, "x": 16, "y": 14 },
          "id": 5,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "editorMode": "code",
              "expr": "{job=\"syslog\"} | host=~\"pve03.*\" or src_ip=\"192.168.0.109\"",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "pve03",
          "type": "logs"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["proxmox", "syslog", "loki"],
      "templating": { "list": [] },
      "time": { "from": "now-6h", "to": "now" },
      "timezone": "browser",
      "title": "Proxmox Syslog",
      "uid": "proxmox-syslog",
      "version": 1
    }
