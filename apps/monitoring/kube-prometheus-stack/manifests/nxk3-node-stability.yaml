# nXk3 node / Longhorn / CP stability (Phase 0+2).
# Argo: kube-prometheus-stack manifests. Mirror: Infra_LAB .../nxk3-node-stability-rules.yaml
# Runbook: Infra_LAB ansible/playbooks/k3s_cluster/docs/etcd-disaster-recovery.md
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nxk3-node-stability
  namespace: monitoring
  labels:
    app.kubernetes.io/name: nxk3-node-stability
    release: kube-prometheus-stack
spec:
  groups:
    - name: nxk3.node.stability
      rules:
        - alert: NXk3NodeNotReady
          expr: |
            kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
            source: prometheus
          annotations:
            summary: "Node {{ $labels.node }} not Ready"
            description: >-
              Kubernetes node {{ $labels.node }} has been NotReady for >5m.
              See ansible/playbooks/k3s_cluster/docs/node-stability.md.

        - alert: NXk3NodeMemoryPressure
          expr: |
            kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
          for: 5m
          labels:
            severity: warning
            source: prometheus
          annotations:
            summary: "MemoryPressure on {{ $labels.node }}"
            description: >-
              Node {{ $labels.node }} reports MemoryPressure. Check VM RAM
              (terraform/proxmox_k3s/dev.tfvars) and kubelet systemReserved.

        - alert: NXk3NodeDiskPressure
          expr: |
            kube_node_status_condition{condition="DiskPressure",status="true"} == 1
          for: 5m
          labels:
            severity: warning
            source: prometheus
          annotations:
            summary: "DiskPressure on {{ $labels.node }}"
            description: >-
              Node {{ $labels.node }} reports DiskPressure. Soft eviction is 15%;
              Longhorn shares worker root. See BookStack K3s → Longhorn DiskPressure.

        # Early warning before soft eviction (15%): free < 20% on root.
        - alert: NXk3RootFilesystemLow
          expr: |
            (
              node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint="/"}
                / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint="/"}
            ) < 0.20
          for: 10m
          labels:
            severity: warning
            source: prometheus
          annotations:
            summary: "Root filesystem <20% free on {{ $labels.instance }}"
            description: >-
              Mount `/` on {{ $labels.instance }} has been under 20% free for >10m
              ({{ $value | humanizePercentage }}). Soft DiskPressure triggers at ~15%.
              Check Longhorn usage on Proxmox workers: df -h /; du -sh /var/lib/longhorn.

        - alert: NXk3LonghornManagerUnavailable
          expr: |
            kube_daemonset_status_number_unavailable{namespace="longhorn-system",daemonset="longhorn-manager"} > 0
          for: 10m
          labels:
            severity: warning
            source: prometheus
          annotations:
            summary: "longhorn-manager unavailable on {{ $value }} node(s)"
            description: >-
              DaemonSet longhorn-system/longhorn-manager has unavailable pods.
              Often follows DiskPressure (managers Evicted). Check:
              kubectl -n longhorn-system get pods -l app=longhorn-manager -o wide

        # Proxmox disk nodes only (label worker=true). Pis have allowScheduling=false and must
        # not turn the Longhorn storage amp red when kubelet is down (NodeStatusUnknown).
        - alert: NXk3LonghornNodeNotReady
          expr: |
            (longhorn_node_status{condition="ready"} == 0)
              * on(node) group_left()
              (kube_node_labels{label_worker="true"} == 1)
          for: 10m
          labels:
            severity: warning
            source: prometheus
          annotations:
            summary: "Longhorn disk node {{ $labels.node }} not ready"
            description: >-
              Longhorn reports Proxmox worker {{ $labels.node }} condition ready=0.
              Pis are excluded (no Longhorn disks). Cross-check DiskPressure / ManagerPodDown:
              kubectl -n longhorn-system get nodes.longhorn.io

        # Pi agents (compute + pi7cl RustFS host) — separate from Longhorn disk amp.
        - alert: NXk3PiNodeNotReady
          expr: |
            kube_node_status_condition{condition="Ready",status="true",node=~"pi[1247]cl"} == 0
          for: 5m
          labels:
            severity: warning
            source: prometheus
          annotations:
            summary: "Pi node {{ $labels.node }} not Ready"
            description: >-
              Raspberry Pi agent {{ $labels.node }} NotReady/Unknown >5m (power, net, or
              k3s-agent). Not a Longhorn disk node. Runbook: node-stability.md;
              identity fix: fix-pi-node-identity.yaml. pi7cl down also blocks RustFS backups.

        # Phase 2 — control-plane quorum (embedded etcd needs ≥2 Ready CPs under load)
        - alert: NXk3ControlPlaneQuorumRisk
          expr: |
            count(
              (kube_node_status_condition{condition="Ready",status="true"} == 1)
                * on(node) group_left()
              (kube_node_role{role="control-plane"} == 1)
            ) < 2
          for: 5m
          labels:
            severity: critical
            source: prometheus
          annotations:
            summary: "Fewer than 2 Ready control-plane nodes"
            description: >-
              Only {{ $value }} control-plane node(s) Ready. etcd HA needs majority.
              Check: kubectl get nodes -l node-role.kubernetes.io/control-plane;
              ansible docs/node-stability.md / etcd-disaster-recovery.

        - alert: NXk3EtcdOffsiteTimerInactive
          expr: |
            node_systemd_unit_state{name="nxk3-etcd-offsite.timer",state="active"} != 1
            and on(instance) node_uname_info{nodename="nxk3-cp01"}
          for: 30m
          labels:
            severity: warning
            source: prometheus
          annotations:
            summary: "etcd offsite timer inactive on nxk3-cp01"
            description: >-
              systemd timer nxk3-etcd-offsite.timer is not active (requires node_exporter
              systemd collector). Fallback: systemctl list-timers nxk3-etcd-offsite.timer
              on nxk3-cp01; playbook etcd_backup_offsite.yaml.
