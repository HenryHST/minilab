# kube-prometheus-stack — adapted from mortennordbye/homelab k8s/talos/apps/monitoring/kube-prometheus-stack
# Grafana dashboards/OIDC preserved from apps/grafana/values.yaml

prometheus:
  ingress:
    enabled: false
  prometheusSpec:
    replicas: 1
    # Prometheus 3.x native OTLP (/api/v1/otlp/v1/metrics on :9090).
    # Edge/LAN producers (RustFS) stay on otel-collector LB .219:4318 — see apps/monitoring/otel-collector.
    # NetworkPolicy prometheus-ingress limits :9090 to monitoring/traefik/kromgo (no public OTLP).
    enableOTLPReceiver: true
    # Proxmox only — Pis OOM during WAL replay (1Gi) → empty Endpoints → Kromgo "query error".
    nodeSelector:
      worker: "true"
    retention: 9d
    retentionSize: 2GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
    scrapeInterval: 30s
    evaluationInterval: 30s
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    podMonitorSelector: {}
    # Bearer for HA /api/prometheus (SecretSpec HA_PROMETHEUS_TOKEN → ha-prometheus-token/token)
    secrets:
      - ha-prometheus-token
    additionalScrapeConfigs:
      - job_name: pexpve01
        scrape_interval: 15s
        static_configs:
          - targets:
              - pexpve01.stadthagen.dev:9221
      - job_name: pexpve02
        scrape_interval: 15s
        static_configs:
          - targets:
              - pexpve02.stadthagen.dev:9221
      - job_name: pexpve03
        scrape_interval: 15s
        static_configs:
          - targets:
              - pexpve03.stadthagen.dev:9221
      - job_name: pangolin
        scrape_interval: 15s
        static_configs:
          - targets:
              - pangolin.stadthagen.dev:9100
      # HA OS addon prometheus_node_exporter on ha02
      - job_name: ha02-node
        scrape_interval: 15s
        static_configs:
          - targets:
              - ha02.stadthagen.dev:9100
      # Home Assistant entity metrics (package prometheus.yaml on ha02)
      - job_name: homeassistant
        scrape_interval: 30s
        metrics_path: /api/prometheus
        scheme: http
        authorization:
          type: Bearer
          credentials_file: /etc/prometheus/secrets/ha-prometheus-token/token
        static_configs:
          - targets:
              - 192.168.0.106:8123
      - job_name: unpoller
        scrape_interval: 15s
        static_configs:
          - targets:
              - unpoller.unpoller.svc.cluster.local:9130
      - job_name: authentik
        scrape_interval: 15s
        static_configs:
          - targets:
              - authentik-server-metrics.authentik.svc.cluster.local:9300
              - authentik-worker-metrics.authentik.svc.cluster.local:9300
      - job_name: argocd-server
        scrape_interval: 15s
        static_configs:
          - targets:
              - argo-cd-argocd-server-metrics.argocd.svc.cluster.local:8083
      - job_name: argocd-repo-server
        scrape_interval: 15s
        static_configs:
          - targets:
              - argo-cd-argocd-repo-server-metrics.argocd.svc.cluster.local:8084
      - job_name: argocd-application-controller
        scrape_interval: 15s
        static_configs:
          - targets:
              - argo-cd-argocd-application-controller-metrics.argocd.svc.cluster.local:8082

grafana:
  enabled: true
  replicas: 1
  image:
    repository: grafana/grafana
    tag: "13.2.3"
  ingress:
    enabled: false
  deploymentStrategy:
    type: Recreate
  nodeSelector:
    worker: "true"
  persistence:
    enabled: true
    type: pvc
    existingClaim: grafana-data
    storageClassName: longhorn
  plugins:
    - apricote-hcloud-datasource
    - grafana-mqtt-datasource
    - tim012432-calendarheatmap-panel@1.1.1
    - ventura-psychrometric-panel@5.1.0
    - neildengg-grafmaid-panel@1.0.6
    - grafana-pathfinder-app@2.20.1
    - yesoreyeram-infinity-datasource@4.1.1
    - grafana-prometheusalerting-app@1.6.1
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: argocd
          orgId: 1
          folder: Argo CD
          type: file
          disableDeletion: false
          editable: false
          options:
            path: /var/lib/grafana/dashboards/argocd
        - name: authentik
          orgId: 1
          folder: Authentik
          type: file
          disableDeletion: false
          editable: false
          options:
            path: /var/lib/grafana/dashboards/authentik
        # homeassistant: sidecar manifests/dashboard-homeassistant.yaml (folder Home Assistant).
        # gnetId 16888 was Longhorn (moved); gnetId 17500 is unrelated node-exporter "Home".
        - name: hetzner
          orgId: 1
          folder: Hetzner Cloud
          type: file
          disableDeletion: false
          editable: false
          options:
            path: /var/lib/grafana/dashboards/hetzner
        - name: proxmox
          orgId: 1
          folder: Proxmox
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/proxmox
        - name: trivy
          orgId: 1
          folder: Trivy
          type: file
          disableDeletion: false
          editable: false
          options:
            path: /var/lib/grafana/dashboards/trivy
        # cert-manager: provisioned via manifests/dashboard-cert-manager.yaml (sidecar).
        # gnetId 20340 download leaves ${DS_PROMETHEUS} unresolved → empty panels.
  dashboards:
    # unpoller: removed — grafana.com gnetId 11310–11315 return empty stubs;
    # provision via manifests/dashboard-unpoller-*.yaml (sidecar).
    argocd:
      operational-overview:
        gnetId: 19993
        datasource: Prometheus
    authentik:
      authentik:
        gnetId: 14837
        datasource: Prometheus
    # homeassistant: manifests/dashboard-homeassistant.yaml (sidecar).
    # Longhorn: manifests/dashboard-longhorn.yaml (sidecar, folder Longhorn).
    hetzner:
      servers-load-balancers:
        gnetId: 20257
        datasource: Hetzner Cloud
    trivy:
      trivy-operator-dashboard:
        gnetId: 17813
        revision: 2
        datasource: Prometheus
  grafana.ini:
    feature_toggles:
      enable: interactiveLearning
    server:
      root_url: https://grafana.stadthagen.dev
      domain: grafana.stadthagen.dev
    users:
      allow_sign_up: false
    auth:
      oauth_auto_login: false
    auth.generic_oauth:
      enabled: true
      name: authentik
      allow_sign_up: true
      client_id: $__file{/etc/secrets/auth_generic_oauth/client-id}
      client_secret: $__file{/etc/secrets/auth_generic_oauth/client-secret}
      scopes: openid profile email
      auth_url: https://idp.stadthagen.dev/application/o/authorize/
      token_url: https://idp.stadthagen.dev/application/o/token/
      api_url: https://idp.stadthagen.dev/application/o/userinfo/
      signout_redirect_url: https://idp.stadthagen.dev/application/o/grafana/end-session/
      role_attribute_path: "contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor' || 'Viewer'"
      role_attribute_strict: false
    analytics:
      check_for_updates: true
    log:
      mode: console
  envValueFrom:
    HCLOUD_API_TOKEN:
      secretKeyRef:
        name: grafana-hcloud
        key: token
        optional: true
    MQTT_USERNAME:
      secretKeyRef:
        name: grafana-mqtt
        key: username
        optional: true
    MQTT_PASSWORD:
      secretKeyRef:
        name: grafana-mqtt
        key: password
        optional: true
  extraSecretMounts:
    - name: auth-generic-oauth-secret-mount
      secretName: grafana-oauth
      mountPath: /etc/secrets/auth_generic_oauth
      readOnly: true
      defaultMode: 0440
    - name: hcloud-api-token
      secretName: grafana-hcloud
      mountPath: /etc/secrets/hcloud
      readOnly: true
      defaultMode: 0440
      optional: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  sidecar:
    image:
      registry: quay.io
      repository: kiwigrid/k8s-sidecar
      tag: "2.14.3"
    dashboards:
      enabled: true
      label: grafana_dashboard
      # Place ConfigMaps with annotation grafana_folder into that folder
      # (e.g. UniFi Poller). Without this, sidecar JSON lands in General.
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true
      label: grafana_datasource
      defaultDatasourceEnabled: false

alertmanager:
  enabled: true
  ingress:
    enabled: false
  alertmanagerSpec:
    replicas: 1
    retention: 120h
    # HA webhook URL (SecretSpec HA_NXK3_WEBHOOK_URL → Secret alertmanager-ha-webhook/url)
    secrets:
      - alertmanager-ha-webhook
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
  config:
    global:
      smtp_smarthost: mail.henrystadthagen.de:25
      smtp_from: auto@henrystadthagen.de
    # Baseline: critical vs warning → same inbox, different cadence + subject.
    # See apps/monitoring/kube-prometheus-stack/ALERTING.md
    route:
      receiver: email-warning
      group_by: [alertname, severity]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # Pi NotReady → Home Assistant remediations (ha02); continue so e-mail still fires
        - matchers:
            - alertname = NXk3PiNodeNotReady
          receiver: homeassistant-pi
          group_by: [alertname, node]
          group_wait: 0s
          group_interval: 5m
          repeat_interval: 1h
          continue: true
        - matchers:
            - severity = critical
          receiver: email-critical
          group_wait: 0s
          group_interval: 5m
          repeat_interval: 4h
          continue: false
        - matchers:
            - severity = warning
          receiver: email-warning
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          continue: false
    # equal must include alertname: kube-state-metrics node alerts share the same
    # namespace+pod labels, so equal:[namespace,pod] wrongly suppressed
    # NXk3PiNodeNotReady (warning) under NXk3NodeNotReady (critical) and blocked the HA webhook.
    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity = warning
        equal: [namespace, alertname]
      - source_matchers:
          - alertname = PVENodeDown
        target_matchers:
          - severity = warning
        equal: [instance]
    receivers:
      - name: email-critical
        email_configs:
          - to: info@henrystadthagen.de
            send_resolved: true
            headers:
              Subject: "[CRITICAL][minilab] {{ .GroupLabels.alertname }}"
      - name: email-warning
        email_configs:
          - to: info@henrystadthagen.de
            send_resolved: true
            headers:
              Subject: "[WARNING][minilab] {{ .GroupLabels.alertname }}"
      - name: homeassistant-pi
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-ha-webhook/url
            send_resolved: true
            http_config:
              follow_redirects: false

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

prometheusOperator:
  image:
    registry: quay.io
    repository: prometheus-operator/prometheus-operator
    tag: v0.95.1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

kubeApiServer:
  enabled: false

kubelet:
  enabled: true

kubeControllerManager:
  enabled: false

coreDns:
  enabled: true

kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

defaultRules:
  create: true
  disabled:
    KubeHpaMaxedOut: true
  rules:
    alertmanager: false
    etcd: false
    configReloaders: false
    general: true
    k8s: true
    kubeApiserverAvailability: false
    kubeApiserverSlos: false
    kubelet: true
    kubeProxy: false
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: false
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true
