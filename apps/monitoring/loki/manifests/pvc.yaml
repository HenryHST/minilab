apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  # Longhorn ignores PVC replica annotations (use StorageClass parameters or
  # patch volumes.longhorn.io). Replica count comes from longhorn-loki-local.
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-loki-local
  resources:
    requests:
      storage: 2Gi
