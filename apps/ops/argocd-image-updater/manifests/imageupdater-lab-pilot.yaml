# ImageUpdater CR — pilot only (registry-demo). Git write-back to minilab.
# Requires Secret argocd-image-updater-git (Infra_LAB SecretSpec ARGOCD_IMAGE_UPDATER_GIT_TOKEN).
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: lab-registry-pilot
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-image-updater
    app.kubernetes.io/part-of: argocd-image-updater
    app.kubernetes.io/component: imageupdater
spec:
  namespace: argocd
  commonUpdateSettings:
    updateStrategy: semver
    platforms:
      - linux/amd64
      - linux/arm64
  writeBackConfig:
    method: git:secret:argocd/argocd-image-updater-git
    gitConfig:
      repository: https://github.com/HenryHST/minilab.git
      branch: main
      writeBackTarget: helmvalues:/apps/dev/registry-demo/values.yaml
  applicationRefs:
    - namePattern: registry-demo
      images:
        - alias: app
          # Semver constraint in imageName (~1.27 → patch updates within 1.27.x)
          imageName: registry.stadthagen.dev/dev/registry-demo:~1.27
          commonUpdateSettings:
            updateStrategy: semver
            forceUpdate: true
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag
