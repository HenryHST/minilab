---
# Authentik full backup (online): pg_dump + media PVC → NFS + RustFS S3.
# No scale-to-0 / HPA delete / Argo suspend — IdP stays up (HA roadmap Phase 4).
# Schedules: 02:30 and 11:50 Europe/Berlin. Retention: 30 days per target.
# Upstream: https://docs.goauthentik.io/sys-mgmt/ops/backup-restore/
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-runner
  namespace: authentik
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-runner-role
  namespace: authentik
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-runner-rolebinding
  namespace: authentik
subjects:
  - kind: ServiceAccount
    name: backup-runner
    namespace: authentik
roleRef:
  kind: Role
  name: backup-runner-role
  apiGroup: rbac.authorization.k8s.io
---
# PV carries mountOptions (core Pod nfs volumes cannot); UniFi NAS needs NFSv3 + nolock.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: authentik-backups-nfs
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=3
    - nolock
  nfs:
    server: 192.168.0.25
    path: /var/nfs/shared/infra01/authentik-backups
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-backups
  namespace: authentik
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: authentik-backups-nfs
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-backup-script
  namespace: authentik
data:
  backup.sh: |
    #!/bin/bash
    set -euo pipefail

    apk add --no-cache postgresql17-client tar gzip aws-cli coreutils >/dev/null

    RETENTION_DAYS="${RETENTION_DAYS:-30}"
    S3_BUCKET="${S3_BUCKET:-authentik-backups}"
    AWS_ENDPOINT_URL="${AWS_ENDPOINT_URL:-http://192.168.0.107:9000}"

    STAMP="$(TZ=Europe/Berlin date +%Y%m%d-%H%M%S)"
    WORK="/tmp/authentik-${STAMP}"
    ARCHIVE_NAME="authentik-${STAMP}.tar.gz"
    OUT_NFS="/backup/${ARCHIVE_NAME}"
    mkdir -p "${WORK}"

    echo "Waiting for postgres (online dump; IdP stays up)..."
    until pg_isready -h "${PGHOST}" -U "${PGUSER}" -d "${PGDATABASE}" -q; do sleep 2; done

    echo "Dumping ${PGDATABASE}@${PGHOST} -> db.sql.gz"
    pg_dump --no-owner --no-acl | gzip -c > "${WORK}/db.sql.gz"

    echo "Archiving /media (RWX PVC, read-only mount) -> media.tar.gz"
    tar czf "${WORK}/media.tar.gz" -C /media .

    tar czf "${OUT_NFS}" -C "${WORK}" .
    ls -lh "${OUT_NFS}"
    rm -rf "${WORK}"

    echo "Uploading to S3 s3://${S3_BUCKET}/${ARCHIVE_NAME} @ ${AWS_ENDPOINT_URL}"
    aws configure set default.s3.addressing_style path
    aws --endpoint-url "${AWS_ENDPOINT_URL}" s3 cp "${OUT_NFS}" "s3://${S3_BUCKET}/${ARCHIVE_NAME}"
    echo "S3 upload OK"

    echo "NFS retention: delete archives older than ${RETENTION_DAYS} days"
    find /backup -maxdepth 1 -type f -name 'authentik-*.tar.gz' -mtime "+${RETENTION_DAYS}" -print -delete || true

    echo "S3 retention: delete objects older than ${RETENTION_DAYS} days"
    CUTOFF_DATE=""
    if CUTOFF_DATE="$(date -u -d "${RETENTION_DAYS} days ago" +%Y-%m-%d 2>/dev/null)"; then
      :
    elif command -v python3 >/dev/null 2>&1; then
      CUTOFF_DATE="$(python3 -c "from datetime import datetime,timedelta,timezone; print((datetime.now(timezone.utc)-timedelta(days=int('${RETENTION_DAYS}'))).strftime('%Y-%m-%d'))")"
    else
      echo "WARN: cannot compute S3 cutoff date; skipping S3 retention"
    fi
    if [[ -n "${CUTOFF_DATE}" ]]; then
      aws --endpoint-url "${AWS_ENDPOINT_URL}" s3 ls "s3://${S3_BUCKET}/" | while read -r DATE TIME SIZE KEY; do
        [[ -z "${KEY:-}" ]] && continue
        case "${KEY}" in
          authentik-*.tar.gz) ;;
          *) continue ;;
        esac
        if [[ "${DATE}" < "${CUTOFF_DATE}" ]]; then
          echo "Deleting s3://${S3_BUCKET}/${KEY} (${DATE} < ${CUTOFF_DATE})"
          aws --endpoint-url "${AWS_ENDPOINT_URL}" s3 rm "s3://${S3_BUCKET}/${KEY}"
        fi
      done
    fi

    echo "Done. NFS archives:"
    ls -1t /backup/authentik-*.tar.gz 2>/dev/null || true
    echo "S3 objects:"
    aws --endpoint-url "${AWS_ENDPOINT_URL}" s3 ls "s3://${S3_BUCKET}/" || true
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: authentik-backup-0230
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-backup
    app.kubernetes.io/component: backup-0230
spec:
  timeZone: Europe/Berlin
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: authentik-backup
        spec:
          serviceAccountName: backup-runner
          imagePullSecrets:
            - name: registry-pull
          restartPolicy: Never
          nodeSelector:
            worker: "true"
          containers:
            - name: backup
              image: git.stadthagen.dev/ops/k8s-toolbox:1.0.0
              env:
                - name: PGHOST
                  value: authentik-pg-rw
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: authentik
                - name: PGDATABASE
                  value: authentik
                - name: PGSSLMODE
                  value: require
                - name: RETENTION_DAYS
                  value: "30"
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: authentik-credentials
                      key: password
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: authentik-backup-s3
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: authentik-backup-s3
                      key: AWS_SECRET_ACCESS_KEY
                - name: AWS_ENDPOINT_URL
                  valueFrom:
                    secretKeyRef:
                      name: authentik-backup-s3
                      key: AWS_ENDPOINT_URL
                - name: AWS_DEFAULT_REGION
                  valueFrom:
                    secretKeyRef:
                      name: authentik-backup-s3
                      key: AWS_DEFAULT_REGION
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: authentik-backup-s3
                      key: S3_BUCKET
              command: ["/bin/bash", "/scripts/backup.sh"]
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: media
                  mountPath: /media
                  readOnly: true
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  memory: 1Gi
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: authentik-backups
            - name: media
              persistentVolumeClaim:
                claimName: authentik-media
            - name: scripts
              configMap:
                name: authentik-backup-script
                defaultMode: 0755
---
