---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-runner
  namespace: authentik
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-runner-role
  namespace: authentik
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-runner-rolebinding
  namespace: authentik
subjects:
  - kind: ServiceAccount
    name: backup-runner
    namespace: authentik
roleRef:
  kind: Role
  name: backup-runner-role
  apiGroup: rbac.authorization.k8s.io
---
# PV carries mountOptions (core Pod nfs volumes cannot); UniFi NAS needs NFSv3 + nolock.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: authentik-backups-nfs
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=3
    - nolock
  nfs:
    server: 192.168.0.25
    path: /var/nfs/shared/infra01/authentik-backups
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-backups
  namespace: authentik
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: authentik-backups-nfs
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: authentik-backup-cron
  namespace: authentik
spec:
  schedule: "0 5 * * *" # 05:00 UTC ≈ 07:00 CEST (after bookstack)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: backup-runner
          restartPolicy: Never
          containers:
            - name: trigger-backup
              image: alpine/k8s:1.32.0
              env:
                - name: PGHOST
                  value: authentik-postgresql
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: authentik
                - name: PGDATABASE
                  value: authentik
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: authentik-credentials
                      key: password
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  apk add --no-cache postgresql17-client tar gzip >/dev/null

                  STAMP="$(date -u +%Y%m%d-%H%M%S)"
                  WORK="/tmp/authentik-${STAMP}"
                  OUT="/backup/authentik-${STAMP}.tar.gz"
                  mkdir -p "${WORK}"

                  echo "Waiting for postgres..."
                  until pg_isready -h "${PGHOST}" -U "${PGUSER}" -d "${PGDATABASE}" -q; do sleep 2; done

                  echo "Dumping ${PGDATABASE}@${PGHOST} -> db.sql.gz"
                  pg_dump --no-owner --no-acl | gzip -c > "${WORK}/db.sql.gz"

                  SERVER_POD="$(kubectl -n authentik get pod -l app.kubernetes.io/name=authentik,app.kubernetes.io/component=server -o jsonpath='{.items[0].metadata.name}')"
                  if [[ -z "${SERVER_POD}" ]]; then
                    echo "No authentik-server pod found" >&2
                    exit 1
                  fi
                  echo "Archiving pod/${SERVER_POD} /media -> media.tar.gz"
                  kubectl -n authentik exec "${SERVER_POD}" -c server -- tar czf - -C /media . > "${WORK}/media.tar.gz"

                  tar czf "${OUT}" -C "${WORK}" .
                  ls -lh "${OUT}"
                  rm -rf "${WORK}"

                  # Retention: keep last 7 archives
                  ls -1t /backup/authentik-*.tar.gz 2>/dev/null | tail -n +8 | xargs -r rm -f
                  echo "Done. Archives:"
                  ls -1t /backup/authentik-*.tar.gz 2>/dev/null || true
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: authentik-backups
