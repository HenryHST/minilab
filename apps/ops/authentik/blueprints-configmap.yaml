apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints-day0
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/part-of: authentik-day0
data:
  day0-combined-login.yaml: |
    # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
    # Day-0: Combined username/password login on stock default-authentication-flow
    # Owner: minilab blueprints — password_stage + flow bindings (NOT Infra_LAB TF)
    # Enrollment/recovery flows on identification remain Terraform (modules/brand).
    # Stock separate password binding (order 20) is removed so login is one step.
    version: 1
    metadata:
      name: day0-combined-login
      labels:
        blueprints.goauthentik.io/description: Day-0 combined login (password_stage on identification)
    entries:
      - model: authentik_stages_identification.identificationstage
        id: default-authentication-identification
        state: present
        identifiers:
          name: default-authentication-identification
        attrs:
          name: default-authentication-identification
          user_fields:
            - email
            - username
          password_stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]

      - model: authentik_flows.flowstagebinding
        id: default-authentication-flow-identification-binding
        state: present
        identifiers:
          order: 10
          target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          stage: !Find [authentik_stages_identification.identificationstage, [name, default-authentication-identification]]
        attrs:
          order: 10
          target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          stage: !Find [authentik_stages_identification.identificationstage, [name, default-authentication-identification]]

      # Stock Day-0 binds password separately at order 20; combined login must not.
      # Identifiers only (no attrs) — safer for state: absent re-apply.
      - model: authentik_flows.flowstagebinding
        id: default-authentication-flow-password-binding
        state: absent
        identifiers:
          order: 20
          target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]
  day0-hubble-ui.yaml: |
    # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
    # Day-0: ForwardAuth for hubble.stadthagen.dev
    # Owner: minilab blueprints — NOT managed by Infra_LAB terraform/authentik
    # Service name must stay ak-outpost-hubble-ui (Traefik middleware).
    version: 1
    metadata:
      name: day0-hubble-ui
      labels:
        blueprints.goauthentik.io/description: Day-0 Proxy Provider + Outpost for Hubble UI ForwardAuth
    entries:
      - model: authentik_providers_proxy.proxyprovider
        id: hubble-ui-provider
        state: present
        identifiers:
          name: hubble-ui
        attrs:
          name: hubble-ui
          external_host: https://hubble.stadthagen.dev
          mode: forward_single
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]

      - model: authentik_core.application
        id: hubble-ui-app
        state: present
        identifiers:
          slug: hubble-ui
        attrs:
          name: Hubble UI
          slug: hubble-ui
          provider: !KeyOf hubble-ui-provider
          meta_launch_url: https://hubble.stadthagen.dev
          meta_icon: branding/hubble-light-1.svg
          open_in_new_tab: true

      - model: authentik_outposts.outpost
        id: hubble-ui-outpost
        state: present
        identifiers:
          name: hubble-ui
        attrs:
          name: hubble-ui
          type: proxy
          service_connection: !Find [authentik_outposts.kubernetesserviceconnection, [name, Local Kubernetes Cluster]]
          providers:
            - !KeyOf hubble-ui-provider
          config:
            authentik_host: http://authentik-server.authentik.svc.cluster.local:80
            authentik_host_browser: https://idp.stadthagen.dev
            authentik_host_insecure: true
            kubernetes_namespace: authentik
            kubernetes_replicas: 1
            kubernetes_service_type: ClusterIP
            object_naming_template: ak-outpost-%(name)s
  day0-n8n.yaml: |
    # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
    # Day-0: ForwardAuth for n8n.stadthagen.dev (Community n8n — no native OIDC)
    # Owner: minilab blueprints — NOT managed by Infra_LAB terraform/authentik OAuth
    # Service name must stay ak-outpost-n8n (Traefik middleware).
    # Access groups n8n_admins / n8n_users are created by Terraform; bindings here.
    version: 1
    metadata:
      name: day0-n8n
      labels:
        blueprints.goauthentik.io/description: Day-0 Proxy Provider + Outpost for n8n ForwardAuth
    entries:
      - model: authentik_providers_proxy.proxyprovider
        id: n8n-provider
        state: present
        identifiers:
          name: n8n
        attrs:
          name: n8n
          external_host: https://n8n.stadthagen.dev
          mode: forward_single
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]

      - model: authentik_core.application
        id: n8n-app
        state: present
        identifiers:
          slug: n8n
        attrs:
          name: n8n
          slug: n8n
          provider: !KeyOf n8n-provider
          meta_launch_url: https://n8n.stadthagen.dev
          meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/n8n.svg
          meta_description: Workflow-Automatisierung und Service-Integrationen.
          open_in_new_tab: true

      - model: authentik_policies.policybinding
        id: n8n-bind-admins
        state: present
        identifiers:
          order: 0
          target: !KeyOf n8n-app
        attrs:
          order: 0
          target: !KeyOf n8n-app
          group: !Find [authentik_core.group, [name, n8n_admins]]

      - model: authentik_policies.policybinding
        id: n8n-bind-users
        state: present
        identifiers:
          order: 1
          target: !KeyOf n8n-app
        attrs:
          order: 1
          target: !KeyOf n8n-app
          group: !Find [authentik_core.group, [name, n8n_users]]

      - model: authentik_outposts.outpost
        id: n8n-outpost
        state: present
        identifiers:
          name: n8n
        attrs:
          name: n8n
          type: proxy
          service_connection: !Find [authentik_outposts.kubernetesserviceconnection, [name, Local Kubernetes Cluster]]
          providers:
            - !KeyOf n8n-provider
          config:
            authentik_host: http://authentik-server.authentik.svc.cluster.local:80
            authentik_host_browser: https://idp.stadthagen.dev
            authentik_host_insecure: true
            kubernetes_namespace: authentik
            kubernetes_replicas: 1
            kubernetes_service_type: ClusterIP
            object_naming_template: ak-outpost-%(name)s
  day0-registry-ui.yaml: |
    # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
    # Day-0 (Plan B): ForwardAuth for registry-ui.stadthagen.dev
    # Owner: minilab blueprints — NOT managed by Infra_LAB terraform/authentik
    # Service name must stay ak-outpost-registry-ui (Traefik middleware).
    version: 1
    metadata:
      name: day0-registry-ui
      labels:
        blueprints.goauthentik.io/description: Day-0 Proxy Provider + Outpost for registry-ui ForwardAuth
    entries:
      - model: authentik_providers_proxy.proxyprovider
        id: registry-ui-provider
        state: present
        identifiers:
          name: registry-ui
        attrs:
          name: registry-ui
          external_host: https://registry-ui.stadthagen.dev
          mode: forward_single
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]

      - model: authentik_core.application
        id: registry-ui-app
        state: present
        identifiers:
          slug: registry-ui
        attrs:
          name: Registry UI
          slug: registry-ui
          provider: !KeyOf registry-ui-provider
          meta_launch_url: https://registry-ui.stadthagen.dev
          open_in_new_tab: true

      - model: authentik_outposts.outpost
        id: registry-ui-outpost
        state: present
        identifiers:
          name: registry-ui
        attrs:
          name: registry-ui
          type: proxy
          # Created by Authentik worker after first boot; blueprint re-applies until found.
          service_connection: !Find [authentik_outposts.kubernetesserviceconnection, [name, Local Kubernetes Cluster]]
          providers:
            - !KeyOf registry-ui-provider
          config:
            authentik_host: http://authentik-server.authentik.svc.cluster.local:80
            authentik_host_browser: https://idp.stadthagen.dev
            authentik_host_insecure: true
            kubernetes_namespace: authentik
            kubernetes_replicas: 1
            kubernetes_service_type: ClusterIP
            object_naming_template: ak-outpost-%(name)s
