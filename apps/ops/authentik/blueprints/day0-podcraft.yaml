# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Day-0: ForwardAuth for podcraft.stadthagen.dev
# Owner: minilab blueprints — NOT managed by Infra_LAB terraform/authentik OAuth
# Service name must stay ak-outpost-podcraft (Traefik middleware).
# Access group podcraft_admins is created by Terraform (authentik_podcraft.tf).
version: 1
metadata:
  name: day0-podcraft
  labels:
    blueprints.goauthentik.io/description: Day-0 Proxy Provider + Outpost for podcraft ForwardAuth
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: podcraft-provider
    state: present
    identifiers:
      name: podcraft
    attrs:
      name: podcraft
      external_host: https://podcraft.stadthagen.dev
      mode: forward_single
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]

  - model: authentik_core.application
    id: podcraft-app
    state: present
    identifiers:
      slug: podcraft
    attrs:
      name: podcraft
      slug: podcraft
      provider: !KeyOf podcraft-provider
      meta_launch_url: https://podcraft.stadthagen.dev
      meta_icon: https://podcraft.stadthagen.dev/static/brand/logo-dark.svg
      meta_description: minilab k3s workload control plane (admins only).
      open_in_new_tab: true

  - model: authentik_policies.policybinding
    id: podcraft-bind-admins
    state: present
    identifiers:
      order: 0
      target: !KeyOf podcraft-app
    attrs:
      order: 0
      target: !KeyOf podcraft-app
      group: !Find [authentik_core.group, [name, podcraft_admins]]

  - model: authentik_outposts.outpost
    id: podcraft-outpost
    state: present
    identifiers:
      name: podcraft
    attrs:
      name: podcraft
      type: proxy
      service_connection: !Find [authentik_outposts.kubernetesserviceconnection, [name, Local Kubernetes Cluster]]
      providers:
        - !KeyOf podcraft-provider
      config:
        authentik_host: http://authentik-server.authentik.svc.cluster.local:80
        authentik_host_browser: https://idp.stadthagen.dev
        authentik_host_insecure: true
        kubernetes_namespace: authentik
        kubernetes_replicas: 1
        kubernetes_service_type: ClusterIP
        object_naming_template: ak-outpost-%(name)s
