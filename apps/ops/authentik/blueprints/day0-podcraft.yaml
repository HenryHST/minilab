# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# DEPRECATED 2026-11-08: podcraft cut over to native OIDC (Terraform oauth_app).
# This blueprint removes Proxy Provider / Application / Outpost ak-outpost-podcraft.
# Access + OAuth SoT: Infra_LAB terraform/authentik/modules/dev/authentik_podcraft.tf
version: 1
metadata:
  name: day0-podcraft
  labels:
    blueprints.goauthentik.io/description: "DEPRECATED — remove podcraft ForwardAuth (native OIDC)"
entries:
  - model: authentik_outposts.outpost
    id: podcraft-outpost
    state: absent
    identifiers:
      name: podcraft

  - model: authentik_core.application
    id: podcraft-app
    state: absent
    identifiers:
      slug: podcraft

  - model: authentik_providers_proxy.proxyprovider
    id: podcraft-provider
    state: absent
    identifiers:
      name: podcraft
