# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Day-0: ForwardAuth for stirling-pdf.stadthagen.dev
# Owner: minilab blueprints — NOT managed by Infra_LAB terraform/authentik OAuth
# Service name must stay ak-outpost-stirling-pdf (Traefik middleware).
# Access groups stirling_pdf_admins / stirling_pdf_users are created by Terraform; bindings here.
version: 1
metadata:
  name: day0-stirling-pdf
  labels:
    blueprints.goauthentik.io/description: Day-0 Proxy Provider + Outpost for Stirling PDF ForwardAuth
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: stirling-pdf-provider
    state: present
    identifiers:
      name: stirling-pdf
    attrs:
      name: stirling-pdf
      external_host: https://stirling-pdf.stadthagen.dev
      mode: forward_single
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]

  - model: authentik_core.application
    id: stirling-pdf-app
    state: present
    identifiers:
      slug: stirling-pdf
    attrs:
      name: Stirling PDF
      slug: stirling-pdf
      provider: !KeyOf stirling-pdf-provider
      meta_launch_url: https://stirling-pdf.stadthagen.dev
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/stirling-pdf.svg
      meta_description: PDF toolkit (merge, OCR, convert).
      open_in_new_tab: true

  - model: authentik_policies.policybinding
    id: stirling-pdf-bind-admins
    state: present
    identifiers:
      order: 0
      target: !KeyOf stirling-pdf-app
    attrs:
      order: 0
      target: !KeyOf stirling-pdf-app
      group: !Find [authentik_core.group, [name, stirling_pdf_admins]]

  - model: authentik_policies.policybinding
    id: stirling-pdf-bind-users
    state: present
    identifiers:
      order: 1
      target: !KeyOf stirling-pdf-app
    attrs:
      order: 1
      target: !KeyOf stirling-pdf-app
      group: !Find [authentik_core.group, [name, stirling_pdf_users]]

  - model: authentik_outposts.outpost
    id: stirling-pdf-outpost
    state: present
    identifiers:
      name: stirling-pdf
    attrs:
      name: stirling-pdf
      type: proxy
      service_connection: !Find [authentik_outposts.kubernetesserviceconnection, [name, Local Kubernetes Cluster]]
      providers:
        - !KeyOf stirling-pdf-provider
      config:
        authentik_host: http://authentik-server.authentik.svc.cluster.local:80
        authentik_host_browser: https://idp.stadthagen.dev
        authentik_host_insecure: true
        kubernetes_namespace: authentik
        kubernetes_replicas: 1
        kubernetes_service_type: ClusterIP
        object_naming_template: ak-outpost-%(name)s
