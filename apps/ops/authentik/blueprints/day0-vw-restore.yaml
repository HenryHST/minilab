# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Day-0: ForwardAuth for vw-restore.stadthagen.dev (Vaultwarden Restore UI)
# Owner: minilab blueprints — NOT managed by Infra_LAB terraform/authentik OAuth
# Service name must stay ak-outpost-vw-restore (Traefik middleware).
# Access group vaultwarden_admins is created by Terraform (authentik_vaultwarden.tf).
version: 1
metadata:
  name: day0-vw-restore
  labels:
    blueprints.goauthentik.io/description: Day-0 Proxy Provider + Outpost for Vaultwarden Restore UI ForwardAuth
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: vw-restore-provider
    state: present
    identifiers:
      name: vw-restore
    attrs:
      name: vw-restore
      external_host: https://vw-restore.stadthagen.dev
      mode: forward_single
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]

  - model: authentik_core.application
    id: vw-restore-app
    state: present
    identifiers:
      slug: vw-restore
    attrs:
      name: Vaultwarden Restore
      slug: vw-restore
      provider: !KeyOf vw-restore-provider
      meta_launch_url: https://vw-restore.stadthagen.dev
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/vaultwarden-light.svg
      meta_description: Vaultwarden NFS backup restore UI (admins only).
      open_in_new_tab: true

  - model: authentik_policies.policybinding
    id: vw-restore-bind-admins
    state: present
    identifiers:
      order: 0
      target: !KeyOf vw-restore-app
    attrs:
      order: 0
      target: !KeyOf vw-restore-app
      group: !Find [authentik_core.group, [name, vaultwarden_admins]]

  - model: authentik_outposts.outpost
    id: vw-restore-outpost
    state: present
    identifiers:
      name: vw-restore
    attrs:
      name: vw-restore
      type: proxy
      service_connection: !Find [authentik_outposts.kubernetesserviceconnection, [name, Local Kubernetes Cluster]]
      providers:
        - !KeyOf vw-restore-provider
      config:
        authentik_host: http://authentik-server.authentik.svc.cluster.local:80
        authentik_host_browser: https://idp.stadthagen.dev
        authentik_host_insecure: true
        kubernetes_namespace: authentik
        kubernetes_replicas: 1
        kubernetes_service_type: ClusterIP
        object_naming_template: ak-outpost-%(name)s
