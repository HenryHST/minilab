# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# DEPRECATED 2026-11-07: vw-restore merged into podcraft (podcraft.stadthagen.dev/restore/vaultwarden).
# This blueprint removes the standalone Proxy Provider / App / Outpost.
# Access: day0-podcraft binds podcraft_admins + vaultwarden_admins.
version: 1
metadata:
  name: day0-vw-restore
  labels:
    blueprints.goauthentik.io/description: "DEPRECATED — remove vw-restore ForwardAuth (merged into podcraft)"
entries:
  - model: authentik_outposts.outpost
    id: vw-restore-outpost
    state: absent
    identifiers:
      name: vw-restore

  - model: authentik_core.application
    id: vw-restore-app
    state: absent
    identifiers:
      slug: vw-restore

  - model: authentik_providers_proxy.proxyprovider
    id: vw-restore-provider
    state: absent
    identifiers:
      name: vw-restore
