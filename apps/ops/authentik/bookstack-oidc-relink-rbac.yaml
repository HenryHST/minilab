# Cross-namespace RBAC: BookStack Job SA may exec into authentik-worker (ak shell)
# to read live user.uid for OIDC external_auth_id relink.
# Job + ConfigMap live in apps/dev/bookstack/oidc-relink.yaml (AppProject dev → bookstack only).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bookstack-oidc-relink
  namespace: authentik
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bookstack-oidc-relink
  namespace: authentik
subjects:
  - kind: ServiceAccount
    name: bookstack-oidc-relink
    namespace: bookstack
roleRef:
  kind: Role
  name: bookstack-oidc-relink
  apiGroup: rbac.authorization.k8s.io
