apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ template "authentik-remote-cluster.fullname" . }}
  namespace: {{ include "authauthentik-remote-cluster.namespace" . | quote }}
  labels:
    {{- include "authentik-remote-cluster.labels" (dict "context" .) | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  # Managed outposts need secrets/services (Trivy AVD-KSV-0113 / 0056 accepted).
  # configmaps omitted — no goauthentik.io ConfigMaps in this cluster (drops AVD-KSV-0049).
  - apiGroups:
      - ""
    resources:
      - secrets
      - services
    verbs:
      {{- include "authentik-remote-cluster.api-verbs-rw" . | nindent 6 }}
  - apiGroups:
      - extensions
      - apps
    resources:
      - deployments
    verbs:
      {{- include "authentik-remote-cluster.api-verbs-rw" . | nindent 6 }}
  - apiGroups:
      - extensions
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      {{- include "authentik-remote-cluster.api-verbs-rw" . | nindent 6 }}
  - apiGroups:
      - traefik.containo.us
      - traefik.io
    resources:
      - middlewares
    verbs:
      {{- include "authentik-remote-cluster.api-verbs-rw" . | nindent 6 }}
  # httproutes omitted — Gateway API unused here.
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - servicemonitors
    verbs:
      {{- include "authentik-remote-cluster.api-verbs-rw" . | nindent 6 }}
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - list
