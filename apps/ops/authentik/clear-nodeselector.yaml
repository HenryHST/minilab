# Enforce Proxmox-only scheduling (worker=true). Replaces the old force-clear
# patch that wiped nodeSelector and allowed Pi fallback.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-server
  namespace: authentik
spec:
  template:
    spec:
      nodeSelector:
        worker: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-worker
  namespace: authentik
spec:
  template:
    spec:
      nodeSelector:
        worker: "true"
