# Authentik Postgres on CloudNativePG. Import from Bitnami is done and removed:
# a recreated volume must not dial authentik-postgresql again.
# Recovery: Longhorn VolumeSnapshot (ScheduledBackup authentik-pg-snapshot),
# continuous WAL to RustFS (barmanObjectStore), plus online pg_dump CronJob to NFS/S3.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-pg
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    # Must precede Helm Deployments (wave 0). Wave 1 deadlocks: Argo waits for
    # server/worker healthy, but they need authentik-pg-rw from this Cluster.
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/part-of: authentik
    app.kubernetes.io/component: postgresql
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-202610190957-standard-bookworm
  # Server TLS from cert-manager (cnpg-certificates.yaml); client/replication stay operator-managed.
  certificates:
    serverCASecret: authentik-pg-server-tls
    serverTLSSecret: authentik-pg-server-tls
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      secret:
        name: authentik-credentials
  storage:
    # Expanded live 2026-10-28 (pg-2 actualSize >16Gi / DiskPressure).
    size: 32Gi
    storageClass: longhorn
  affinity:
    nodeSelector:
      worker: "true"
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
  monitoring:
    enablePodMonitor: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  backup:
    target: primary
    retentionPolicy: "7d"
    volumeSnapshot:
      className: longhorn
      online: true
      snapshotOwnerReference: backup
    # Continuous WAL + base backups to RustFS (pi7cl). Bucket must exist:
    #   aws --endpoint-url http://192.168.0.107:9000 s3 mb s3://authentik-pg-wal
    # Credentials reuse authentik-backup-s3 (same RustFS user as app archives).
    barmanObjectStore:
      destinationPath: s3://authentik-pg-wal/
      endpointURL: http://192.168.0.107:9000
      s3Credentials:
        accessKeyId:
          name: authentik-backup-s3
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: authentik-backup-s3
          key: AWS_SECRET_ACCESS_KEY
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
