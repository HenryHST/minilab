# Authentik Postgres on CloudNativePG. Import from Bitnami is done and removed:
# a recreated volume must not dial authentik-postgresql again.
# Recovery: Longhorn VolumeSnapshot (ScheduledBackup authentik-pg-snapshot),
# continuous WAL via Barman Cloud Plugin → RustFS ObjectStore authentik-pg-wal,
# plus online pg_dump CronJob to NFS/S3.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-pg
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    # Must precede Helm Deployments (wave 0). Wave 1 deadlocks: Argo waits for
    # server/worker healthy, but they need authentik-pg-rw from this Cluster.
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/part-of: authentik
    app.kubernetes.io/component: postgresql
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-202610190957-standard-bookworm
  # Server TLS from cert-manager (cnpg-certificates.yaml); client/replication stay operator-managed.
  certificates:
    serverCASecret: authentik-pg-server-tls
    serverTLSSecret: authentik-pg-server-tls
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      secret:
        name: authentik-credentials
  storage:
    # 2026-11-01: 48Gi after WAL pile-up (broken in-tree barman) + Longhorn expand.
    size: 48Gi
    storageClass: longhorn
  affinity:
    nodeSelector:
      worker: "true"
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
  # enablePodMonitor is deprecated and omits release: kube-prometheus-stack.
  # Metrics: PodMonitor authentik-pg-instances (podmonitor.yaml) — already scraping.
  monitoring:
    enablePodMonitor: false
  # Barman Cloud Plugin sidecar (standard-bookworm has no in-tree barman binaries).
  # ObjectStore: cnpg-objectstore.yaml → RustFS s3://authentik-pg-wal/
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: authentik-pg-wal
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  backup:
    target: primary
    retentionPolicy: "7d"
    volumeSnapshot:
      className: longhorn
      online: true
      snapshotOwnerReference: backup
    # In-tree barmanObjectStore removed 2026-11-01 (Incident). WAL/base via plugins above.
