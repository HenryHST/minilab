# Migrated from Traefik IngressRoute → Cilium Gateway API HTTPRoute.
# TLS ReferenceGrant: referencegrant-gateway-tls.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/part-of: authentik
spec:
  parentRefs:
    - name: nxk3
      namespace: gateway-system
      sectionName: https-idp
  hostnames:
    - idp.stadthagen.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
              - name: X-Content-Type-Options
                value: nosniff
              - name: X-XSS-Protection
                value: "1; mode=block"
              - name: X-Frame-Options
                value: DENY
      backendRefs:
        - name: authentik-server
          port: 80
