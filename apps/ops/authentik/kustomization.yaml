apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: authentik
# Plain manifests only — no helmCharts (Argo CD kustomize helm pull races:
# "failed to untar: ... already exists"). Chart is vendored + rendered like
# bookstack/headlamp/termix.
resources:
  - helm-manifest.yaml
  - namespace.yaml
  - media-pvc.yaml
  - media-sync-cronjob.yaml
  - media-sync-bootstrap-job.yaml
  - certificate.yaml
  - ingressroute.yaml
  - default-headers.yaml
  - blueprints-configmap.yaml
