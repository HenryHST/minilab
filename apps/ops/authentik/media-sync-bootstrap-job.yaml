# One-shot rsync, same as CronJob authentik-media-sync (NFS → authentik-media PVC).
# Not an Argo hook and not a sync health gate: nxk3-w04 cannot mount this NFS
# export (mount exit 32). Waiting on the Job kept the CNPG host from rolling out.
apiVersion: batch/v1
kind: Job
metadata:
  name: authentik-media-sync-bootstrap
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-options: SkipHealthCheck=true
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        worker: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nxk3-w04
      containers:
        - name: rsync
          image: instrumentisto/rsync-ssh:alpine
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              SRC="/nfs/public/branding"
              DST="/media/public/branding"
              if [[ ! -d "${SRC}" ]]; then
                echo "Missing NFS source ${SRC} — place brand assets under infra01/media/public/branding/" >&2
                exit 1
              fi
              mkdir -p "${DST}"
              echo "rsync ${SRC}/ -> ${DST}/"
              rsync -a --delete "${SRC}/" "${DST}/"
              chown -R 1000:1000 "${DST}"
              echo "Synced branding assets:"
              ls -la "${DST}"
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: nfs
              mountPath: /nfs
              readOnly: true
            - name: media
              mountPath: /media
      volumes:
        - name: nfs
          persistentVolumeClaim:
            claimName: authentik-media-nfs
        - name: media
          persistentVolumeClaim:
            claimName: authentik-media
