# One-shot rsync, same as CronJob authentik-media-sync (NFS → authentik-media PVC).
# Not an Argo hook and not a sync health gate. Waiting on this Job once blocked
# the CloudNativePG host from rolling out.
apiVersion: batch/v1
kind: Job
metadata:
  name: authentik-media-sync-bootstrap
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-options: SkipHealthCheck=true
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        worker: "true"
      containers:
        - name: rsync
          image: instrumentisto/rsync-ssh:alpine
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              SRC="/nfs/public/branding"
              DST="/media/public/branding"
              if [[ ! -d "${SRC}" ]]; then
                echo "Missing NFS source ${SRC} — place brand assets under infra01/media/public/branding/" >&2
                exit 1
              fi
              mkdir -p "${DST}"
              echo "rsync ${SRC}/ -> ${DST}/"
              rsync -a --delete "${SRC}/" "${DST}/"
              chown -R 1000:1000 "${DST}"
              echo "Synced branding assets:"
              ls -la "${DST}"

              AV_SRC="/nfs/public/user-avatars"
              AV_DST="/media/public/user-avatars"
              if [[ ! -d "${AV_SRC}" ]]; then
                echo "Skipping user-avatars sync — ${AV_SRC} not present on NFS" >&2
              else
                mkdir -p "${AV_DST}"
                echo "rsync ${AV_SRC}/ -> ${AV_DST}/"
                rsync -a --delete "${AV_SRC}/" "${AV_DST}/"
                chown -R 1000:1000 "${AV_DST}"
                echo "Synced user-avatars:"
                ls -la "${AV_DST}"
              fi
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: nfs
              mountPath: /nfs
              readOnly: true
            - name: media
              mountPath: /media
      volumes:
        - name: nfs
          persistentVolumeClaim:
            claimName: authentik-media-nfs
        - name: media
          persistentVolumeClaim:
            claimName: authentik-media
