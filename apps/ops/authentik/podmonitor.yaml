# Metrics for authentik-pg (Day-2). Replaces deprecated Cluster monitoring.enablePodMonitor
# (that field omits release: kube-prometheus-stack and would not be scraped).
# Verified: Prometheus job authentik/authentik-pg-instances scrapes cnpg_collector_up.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: authentik-pg-instances
  namespace: authentik
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: authentik
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: authentik-pg
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
