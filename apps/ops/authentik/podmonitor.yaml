# Replaces the deprecated Cluster field monitoring.enablePodMonitor.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: authentik-pg-instances
  namespace: authentik
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: authentik
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: authentik-pg
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
