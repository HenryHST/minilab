# Dedicated Valkey 9.1 for Authentik (cache / sessions / broker; Redis protocol).
# Primary + one replica (StatefulSet). Shared apps/infra/redis stays for paperless etc.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-redis-scripts
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: redis
data:
  entrypoint.sh: |
    #!/bin/sh
    set -eu
    ORDINAL="${HOSTNAME##*-}"
    if [ "$ORDINAL" = "0" ]; then
      exec valkey-server \
        --appendonly yes \
        --save 60 1 \
        --loglevel warning \
        --bind 0.0.0.0 \
        --protected-mode no
    fi
    # Replica follows primary DNS of ordinal 0
    exec valkey-server \
      --appendonly yes \
      --save 60 1 \
      --loglevel warning \
      --bind 0.0.0.0 \
      --protected-mode no \
      --replicaof authentik-redis-0.authentik-redis-hl.authentik.svc.cluster.local 6379
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-redis-hl
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: redis
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: redis
---
# Clients (Authentik) talk to the primary only.
apiVersion: v1
kind: Service
metadata:
  name: authentik-redis
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: redis
    apps.kubernetes.io/pod-index: "0"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: authentik-redis
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: redis
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: authentik-redis-hl
  replicas: 2
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik
        app.kubernetes.io/component: redis
    spec:
      nodeSelector:
        worker: "true"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: authentik
                    app.kubernetes.io/component: redis
                topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 999
      containers:
        - name: redis
          image: valkey/valkey:9.1.2-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/entrypoint.sh"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: authentik-redis-scripts
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: authentik
          app.kubernetes.io/component: redis
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 2Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: authentik-redis
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: redis
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: redis
