# Bootstrap restore from NFS and/or RustFS S3. Default is off — set ConfigMap
# enabled=true (and force=true if DB/media already have data) then Argo Sync;
# set enabled=false after.
#
# Restores PostgreSQL dump + /media (= upstream /data) from combined archive
# authentik-*.tar.gz. Official order: Postgres first, then media, then scale IdP up.
# https://docs.goauthentik.io/sys-mgmt/ops/backup-restore/
#
# MFA (TOTP/WebAuthn) is in Postgres and requires AUTHENTIK_SECRET_KEY unchanged
# since the backup (SecretSpec / authentik-credentials).
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-restore
  namespace: authentik
data:
  enabled: "false"
  archive: "latest"
  # auto | nfs | s3 — auto prefers NFS when the archive exists, else S3
  source: "auto"
  force: "false"
  serverReplicas: "2"
  workerReplicas: "2"
  worker.sh: |
    #!/bin/sh
    set -euo pipefail
    HAS_MEDIA=0
    if [ "$(ls -A /media 2>/dev/null | wc -l | tr -d ' ')" != "0" ]; then
      HAS_MEDIA=1
    fi
    echo "media non-empty=${HAS_MEDIA}"
    if [ "${HAS_MEDIA}" = "1" ] && [ "${RESTORE_FORCE}" != "true" ]; then
      echo "media not empty and force!=true — abort" >&2
      exit 1
    fi
    if [ ! -f /backup/.restore-work/media.tar.gz ]; then
      echo "missing /backup/.restore-work/media.tar.gz" >&2
      exit 1
    fi
    if [ "${HAS_MEDIA}" = "1" ] || [ "${RESTORE_FORCE}" = "true" ]; then
      echo "Clearing /media..."
      find /media -mindepth 1 -maxdepth 1 -exec rm -rf {} +
    fi
    tar xzf /backup/.restore-work/media.tar.gz -C /media
    ls -la /media
    echo "Media restore OK"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: authentik-restore
  namespace: authentik
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authentik-restore
  namespace: authentik
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authentik-restore
  namespace: authentik
subjects:
  - kind: ServiceAccount
    name: authentik-restore
    namespace: authentik
roleRef:
  kind: Role
  name: authentik-restore
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: authentik-bootstrap-restore
  namespace: authentik
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: authentik-restore
      imagePullSecrets:
        - name: registry-pull
      restartPolicy: Never
      containers:
        - name: restore
          image: git.stadthagen.dev/ops/k8s-toolbox:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              value: authentik-pg-rw
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: authentik
            - name: PGDATABASE
              value: authentik
            - name: PGSSLMODE
              value: require
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-credentials
                  key: password
            - name: RESTORE_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: authentik-restore
                  key: enabled
            - name: RESTORE_ARCHIVE
              valueFrom:
                configMapKeyRef:
                  name: authentik-restore
                  key: archive
            - name: RESTORE_SOURCE
              valueFrom:
                configMapKeyRef:
                  name: authentik-restore
                  key: source
            - name: RESTORE_FORCE
              valueFrom:
                configMapKeyRef:
                  name: authentik-restore
                  key: force
            - name: SERVER_REPLICAS
              valueFrom:
                configMapKeyRef:
                  name: authentik-restore
                  key: serverReplicas
            - name: WORKER_REPLICAS
              valueFrom:
                configMapKeyRef:
                  name: authentik-restore
                  key: workerReplicas
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: authentik-backup-s3
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: authentik-backup-s3
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            - name: AWS_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: authentik-backup-s3
                  key: AWS_ENDPOINT_URL
                  optional: true
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: authentik-backup-s3
                  key: AWS_DEFAULT_REGION
                  optional: true
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: authentik-backup-s3
                  key: S3_BUCKET
                  optional: true
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              # Skip before apk so PostSync succeeds when restore is disabled
              # (transient Alpine CDN DNS must not fail the hook).
              if [[ "${RESTORE_ENABLED}" != "true" ]]; then
                echo "authentik-restore.enabled!=true — skip"
                exit 0
              fi

              for i in 1 2 3 4 5; do
                if apk add --no-cache postgresql17-client aws-cli jq; then
                  break
                fi
                if [[ "${i}" -eq 5 ]]; then
                  echo "apk add failed after retries" >&2
                  exit 1
                fi
                sleep $((i * 3))
              done

              NS="authentik"
              SERVER="authentik-server"
              WORKER="authentik-worker"
              MEDIA_WORKER="authentik-restore-media"
              S3_BUCKET="${S3_BUCKET:-authentik-backups}"
              AWS_ENDPOINT_URL="${AWS_ENDPOINT_URL:-http://192.168.0.107:9000}"
              RESTORE_SOURCE="${RESTORE_SOURCE:-auto}"

              HPA_SERVER_MIN=""; HPA_SERVER_MAX=""; HPA_WORKER_MIN=""; HPA_WORKER_MAX=""
              HPA_SERVER_PRESENT=0; HPA_WORKER_PRESENT=0
              HPA_SNAP_DIR="/tmp/authentik-restore-hpa-$$"
              mkdir -p "${HPA_SNAP_DIR}"

              snap_delete_hpa() {
                local name="$1" prefix="$2"
                if kubectl -n "${NS}" get hpa "${name}" >/dev/null 2>&1; then
                  eval "${prefix}_PRESENT=1"
                  eval "${prefix}_MIN=\"$(kubectl -n "${NS}" get hpa "${name}" -o jsonpath='{.spec.minReplicas}')\""
                  eval "${prefix}_MAX=\"$(kubectl -n "${NS}" get hpa "${name}" -o jsonpath='{.spec.maxReplicas}')\""
                  kubectl -n "${NS}" get hpa "${name}" -o json \
                    | jq 'del(.status, .metadata.resourceVersion, .metadata.uid, .metadata.creationTimestamp, .metadata.generation, .metadata.managedFields)' \
                    > "${HPA_SNAP_DIR}/${name}.json"
                  echo "Pausing HPA ${name} (delete; Resource metrics forbid minReplicas=0)..."
                  kubectl -n "${NS}" delete hpa "${name}" --wait=true
                fi
              }

              snap_delete_hpa "${SERVER}" HPA_SERVER
              snap_delete_hpa "${WORKER}" HPA_WORKER

              scale_up() {
                if [[ "${HPA_SERVER_PRESENT}" == "1" && -f "${HPA_SNAP_DIR}/${SERVER}.json" ]]; then
                  kubectl -n "${NS}" apply -f "${HPA_SNAP_DIR}/${SERVER}.json" || true
                else
                  kubectl -n "${NS}" scale deploy/"${SERVER}" --replicas="${SERVER_REPLICAS}" || true
                fi
                if [[ "${HPA_WORKER_PRESENT}" == "1" && -f "${HPA_SNAP_DIR}/${WORKER}.json" ]]; then
                  kubectl -n "${NS}" apply -f "${HPA_SNAP_DIR}/${WORKER}.json" || true
                else
                  kubectl -n "${NS}" scale deploy/"${WORKER}" --replicas="${WORKER_REPLICAS}" || true
                fi
                rm -rf "${HPA_SNAP_DIR}" || true
              }

              echo "Scaling server+worker to 0..."
              kubectl -n "${NS}" scale deploy/"${SERVER}" --replicas=0
              kubectl -n "${NS}" scale deploy/"${WORKER}" --replicas=0
              kubectl -n "${NS}" rollout status deploy/"${SERVER}" --timeout=120s || true
              kubectl -n "${NS}" rollout status deploy/"${WORKER}" --timeout=120s || true
              for i in $(seq 1 60); do
                N="$(kubectl -n "${NS}" get pods -l 'app.kubernetes.io/name=authentik,app.kubernetes.io/component in (server,worker)' --field-selector=status.phase!=Succeeded,status.phase!=Failed -o name 2>/dev/null | wc -l | tr -d ' ')"
                [[ "${N}" == "0" ]] && break
                sleep 2
              done

              resolve_nfs() {
                if [[ "${RESTORE_ARCHIVE}" == "latest" ]]; then
                  ls -1t /backup/authentik-*.tar.gz 2>/dev/null | head -n1 || true
                else
                  local p="/backup/${RESTORE_ARCHIVE}"
                  [[ -f "${p}" ]] && echo "${p}" || true
                fi
              }

              resolve_s3_key() {
                if [[ "${RESTORE_ARCHIVE}" == "latest" ]]; then
                  aws --endpoint-url "${AWS_ENDPOINT_URL}" s3 ls "s3://${S3_BUCKET}/" \
                    | awk '{print $4}' | grep -E '^authentik-.*\.tar\.gz$' | sort -r | head -n1 || true
                else
                  echo "${RESTORE_ARCHIVE}"
                fi
              }

              ARCHIVE=""
              USED_SOURCE=""
              case "${RESTORE_SOURCE}" in
                nfs)
                  ARCHIVE="$(resolve_nfs)"
                  USED_SOURCE="nfs"
                  ;;
                s3)
                  KEY="$(resolve_s3_key)"
                  if [[ -n "${KEY}" ]]; then
                    ARCHIVE="/tmp/${KEY}"
                    echo "Downloading s3://${S3_BUCKET}/${KEY}..."
                    aws configure set default.s3.addressing_style path
                    aws --endpoint-url "${AWS_ENDPOINT_URL}" s3 cp "s3://${S3_BUCKET}/${KEY}" "${ARCHIVE}"
                    USED_SOURCE="s3"
                  fi
                  ;;
                auto|*)
                  ARCHIVE="$(resolve_nfs)"
                  if [[ -n "${ARCHIVE}" && -f "${ARCHIVE}" ]]; then
                    USED_SOURCE="nfs"
                  else
                    KEY="$(resolve_s3_key)"
                    if [[ -n "${KEY}" ]]; then
                      ARCHIVE="/tmp/${KEY}"
                      echo "NFS miss; downloading s3://${S3_BUCKET}/${KEY}..."
                      aws configure set default.s3.addressing_style path
                      aws --endpoint-url "${AWS_ENDPOINT_URL}" s3 cp "s3://${S3_BUCKET}/${KEY}" "${ARCHIVE}"
                      USED_SOURCE="s3"
                    fi
                  fi
                  ;;
              esac

              if [[ -z "${ARCHIVE}" || ! -f "${ARCHIVE}" ]]; then
                echo "No backup archive found (archive=${RESTORE_ARCHIVE} source=${RESTORE_SOURCE})" >&2
                scale_up
                exit 1
              fi
              echo "Restoring from ${ARCHIVE} (source=${USED_SOURCE})"
              echo "SECRET_KEY guard: MFA devices only work if AUTHENTIK_SECRET_KEY matches the backup era."

              WORK="/tmp/restore-work"
              rm -rf "${WORK}"
              mkdir -p "${WORK}"
              tar xzf "${ARCHIVE}" -C "${WORK}"

              echo "Waiting for postgres..."
              until pg_isready -h "${PGHOST}" -U "${PGUSER}" -d "${PGDATABASE}" -q; do sleep 2; done

              TABLES="$(psql -h "${PGHOST}" -U "${PGUSER}" -d "${PGDATABASE}" -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';")"
              echo "public tables: ${TABLES}"
              if [[ "${TABLES}" != "0" && "${RESTORE_FORCE}" != "true" ]]; then
                echo "DB not empty and force!=true — abort" >&2
                scale_up
                exit 1
              fi

              if [[ "${TABLES}" != "0" ]]; then
                echo "DROP SCHEMA public CASCADE..."
                psql -h "${PGHOST}" -U "${PGUSER}" -d "${PGDATABASE}" -v ON_ERROR_STOP=1 -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public; GRANT ALL ON SCHEMA public TO authentik; GRANT ALL ON SCHEMA public TO public;"
              fi

              echo "Importing db.sql.gz (Postgres first per upstream docs)..."
              gunzip -c "${WORK}/db.sql.gz" | psql -h "${PGHOST}" -U "${PGUSER}" -d "${PGDATABASE}" -v ON_ERROR_STOP=1

              # Stage media.tar.gz on NFS (avoids ConfigMap 1MiB limit), then extract via worker
              mkdir -p /backup/.restore-work
              cp "${WORK}/media.tar.gz" /backup/.restore-work/media.tar.gz

              kubectl -n "${NS}" delete pod "${MEDIA_WORKER}" --ignore-not-found --wait=true

              cat <<EOF | kubectl apply -f -
              apiVersion: v1
              kind: Pod
              metadata:
                name: ${MEDIA_WORKER}
                namespace: ${NS}
                labels:
                  app: authentik-restore-media
              spec:
                restartPolicy: Never
                nodeSelector:
                  worker: "true"
                containers:
                  - name: restore
                    image: alpine:3.20
                    imagePullPolicy: IfNotPresent
                    env:
                      - name: RESTORE_FORCE
                        value: "${RESTORE_FORCE}"
                    command: ["/bin/sh", "/scripts/worker.sh"]
                    volumeMounts:
                      - name: media
                        mountPath: /media
                      - name: backup
                        mountPath: /backup
                      - name: scripts
                        mountPath: /scripts
                volumes:
                  - name: media
                    persistentVolumeClaim:
                      claimName: authentik-media
                  - name: backup
                    persistentVolumeClaim:
                      claimName: authentik-backups
                  - name: scripts
                    configMap:
                      name: authentik-restore
                      defaultMode: 0755
              EOF

              echo "Waiting for media worker ${MEDIA_WORKER}..."
              for i in $(seq 1 120); do
                PHASE="$(kubectl -n "${NS}" get pod "${MEDIA_WORKER}" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
                case "${PHASE}" in
                  Succeeded)
                    kubectl -n "${NS}" logs "${MEDIA_WORKER}" || true
                    break
                    ;;
                  Failed)
                    kubectl -n "${NS}" logs "${MEDIA_WORKER}" || true
                    scale_up
                    kubectl -n "${NS}" delete pod "${MEDIA_WORKER}" --ignore-not-found
                    rm -rf /backup/.restore-work
                    exit 1
                    ;;
                esac
                sleep 2
              done
              PHASE="$(kubectl -n "${NS}" get pod "${MEDIA_WORKER}" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
              if [[ "${PHASE}" != "Succeeded" ]]; then
                echo "Media worker did not succeed (phase=${PHASE})" >&2
                kubectl -n "${NS}" logs "${MEDIA_WORKER}" || true
                scale_up
                kubectl -n "${NS}" delete pod "${MEDIA_WORKER}" --ignore-not-found
                rm -rf /backup/.restore-work
                exit 1
              fi
              kubectl -n "${NS}" delete pod "${MEDIA_WORKER}" --ignore-not-found --wait=true
              rm -rf /backup/.restore-work

              echo "Scaling server=${SERVER_REPLICAS} worker=${WORKER_REPLICAS}..."
              scale_up
              kubectl -n "${NS}" rollout status deploy/"${SERVER}" --timeout=180s
              kubectl -n "${NS}" rollout status deploy/"${WORKER}" --timeout=180s
              echo "Done. Set authentik-restore.enabled=false in Git immediately."
              echo "Post-restore smoke: login + TOTP/Passkey for a known user (SECRET_KEY must match backup)."
          volumeMounts:
            - name: backup
              mountPath: /backup
      volumes:
        - name: backup
          persistentVolumeClaim:
            claimName: authentik-backups
