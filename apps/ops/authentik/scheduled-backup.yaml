# Six-field cron (seconds first). VolumeSnapshot every 6h.
# barmanObjectStore ScheduledBackup removed 2026-11-01 (standard image lacks barman-cloud;
# migrate to Barman Cloud Plugin before re-enabling). Online pg_dump CronJob remains.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: authentik-pg-snapshot
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/part-of: authentik
spec:
  schedule: "0 15 */6 * * *"
  immediate: true
  method: volumeSnapshot
  backupOwnerReference: cluster
  cluster:
    name: authentik-pg
  target: primary
  online: true
