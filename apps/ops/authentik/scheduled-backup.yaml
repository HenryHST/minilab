# Six-field cron (seconds first). VolumeSnapshot every 6h + barman base backup daily.
# WAL streams continuously via Cluster.spec.backup.barmanObjectStore (RustFS).
# Online pg_dump CronJob remains the portable off-cluster copy (NFS + S3 archive).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: authentik-pg-snapshot
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/part-of: authentik
spec:
  schedule: "0 15 */6 * * *"
  immediate: true
  method: volumeSnapshot
  backupOwnerReference: cluster
  cluster:
    name: authentik-pg
  target: primary
  online: true
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: authentik-pg-barman
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/part-of: authentik
    app.kubernetes.io/component: barman-backup
spec:
  schedule: "0 30 3 * * *"
  immediate: false
  method: barmanObjectStore
  backupOwnerReference: cluster
  cluster:
    name: authentik-pg
  target: primary
