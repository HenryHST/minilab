# Secrets via Infra_LAB SecretSpec → authentik-credentials (envFrom overlay)
# Pre-cutover: curl --resolve idp.stadthagen.dev:443:192.168.0.215 -skI https://idp.stadthagen.dev/
#
# Day-0 blueprints (Plan B): ConfigMap authentik-blueprints-day0 → /blueprints
# Owner matrix: Infra_LAB docs/adr/0017-authentik-day0-blueprints-und-tf-reconcile.md

authentik:
  log_level: info
  error_reporting:
    enabled: false
  # Seeds System Settings → Base URL when empty (AUTHENTIK_WEB__BASE_URL).
  # Existing installs: set once in Admin → System → Settings if still blank.
  web:
    base_url: "https://idp.stadthagen.dev"
  # Shared cluster Redis (apps/infra/redis) — required for cache/sessions/broker.
  redis:
    host: redis.redis.svc.cluster.local
  postgresql:
    host: authentik-pg-rw
    name: authentik
    user: authentik
  email:
    host: mail.henrstadthagen.de
    port: 465
    use_tls: false
    use_ssl: true
    from: authentik@henrystadthagen.de

# Mount GitOps blueprints (keys ending in .yaml are applied by the worker).
blueprints:
  configMaps:
    - authentik-blueprints-day0

global:
  nodeSelector:
    worker: "true"
  deploymentStrategy:
    type: Recreate
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  envFrom:
    - secretRef:
        name: authentik-credentials
  volumes:
    - name: media
      persistentVolumeClaim:
        claimName: authentik-media
  volumeMounts:
    - name: media
      mountPath: /media

server:
  replicas: 1
  ingress:
    enabled: false
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
  # Observed ~1 CPU / ~2Gi under login-flow load without Redis; raise floor + cap.
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 3Gi
  initContainers:
    - name: volume-permissions
      image: busybox:1.38
      command: ["sh", "-c", "chown -R 1000:1000 /media"]
      securityContext:
        runAsUser: 0
      volumeMounts:
        - name: media
          mountPath: /media

worker:
  replicas: 1
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  initContainers:
    - name: volume-permissions
      image: busybox:1.38
      command: ["sh", "-c", "chown -R 1000:1000 /media"]
      securityContext:
        runAsUser: 0
      volumeMounts:
        - name: media
          mountPath: /media

# Postgres on CloudNativePG Cluster authentik-pg (Service authentik-pg-rw).
postgresql:
  enabled: false
