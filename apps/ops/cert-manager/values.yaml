crds:
  enabled: true

# Scrape cert-manager metrics (docs Helm tip: PodMonitor).
# https://cert-manager.io/docs/devops-tips/prometheus-metrics/
# Feeds Grafana gnetId 20340 + CertificateExpiringSoon.
prometheus:
  enabled: true
  # PodMonitor XOR ServiceMonitor — chart rejects both enabled.
  servicemonitor:
    enabled: false
  podmonitor:
    enabled: true
    # Live Prometheus selects monitors with this label.
    labels:
      release: kube-prometheus-stack

# DNS01 self-check: use Hetzner recursive nameservers (controller flags, not ClusterIssuer fields).
dns01RecursiveNameservers: "helium.ns.hetzner.de:53,oxygen.ns.hetzner.com:53"
dns01RecursiveNameserversOnly: true

# Chart extras-objects.yaml runs `tpl` on each item — must be a YAML string (block scalar), not a map.
extraObjects:
  - |
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: letsencrypt-prod
    spec:
      acme:
        email: admin@stadthagen.dev
        server: https://acme-v02.api.letsencrypt.org/directory
        privateKeySecretRef:
          name: letsencrypt-prod-account-key
        solvers:
          - dns01:
              webhook:
                groupName: acme.hetzner.com
                solverName: hetzner
                config:
                  tokenSecretKeyRef:
                    name: hetzner
                    key: token
