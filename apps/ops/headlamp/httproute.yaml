# Migrated from Traefik IngressRoute → Cilium Gateway API HTTPRoute.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateway-tls-headlamp-tls
  namespace: kube-system
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: gateway-system
  to:
  - group: ''
    kind: Secret
    name: headlamp-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  namespace: kube-system
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: kube-system
spec:
  parentRefs:
  - name: nxk3
    namespace: gateway-system
    sectionName: https-headlamp
  hostnames:
  - headlamp.stadthagen.dev
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: headlamp
      port: 80
