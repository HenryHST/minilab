apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hubble-ui
  namespace: kube-system
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`hubble.stadthagen.dev`)
      kind: Rule
      services:
        # Cilium Helm chart Service (Ansible cni_cilium) — not owned by this app
        - name: hubble-ui
          port: 80
      middlewares:
        - name: hubble-ui-authentik
  tls:
    secretName: hubble-tls
