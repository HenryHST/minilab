# Hubble UI: allow Cilium Gateway (open port) to frontend port.
# Workload owned by Cilium Helm (Ansible); labels k8s-app=hubble-ui.
# Frontend container listens on 8081 (Service maps 80→8081).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hubble-ui-ingress
  namespace: kube-system
  labels:
    app.kubernetes.io/name: hubble-ui
    app.kubernetes.io/part-of: hubble-ui
spec:
  podSelector:
    matchLabels:
      k8s-app: hubble-ui
  policyTypes:
    - Ingress
  ingress:
    # Cilium Gateway edge (Envoy uses reserved:ingress/host — not kube-system pods)
    - ports:
        - protocol: TCP
          port: 8081
    # Cilium Gateway edge (Envoy uses reserved:ingress/host — not kube-system pods)
    - ports:
        - protocol: TCP
          port: 8081
