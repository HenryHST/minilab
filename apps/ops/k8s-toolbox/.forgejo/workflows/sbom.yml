# Downloadable CycloneDX/SPDX SBOM for ops/k8s-toolbox (BuildKit OCI attest stays on image.yml).
# Sync into https://git.stadthagen.dev/ops/k8s-toolbox (.forgejo/workflows/sbom.yml).
#
# Secrets: REGISTRY_USER / REGISTRY_TOKEN (Forgejo OCI pull/read:package)
name: sbom

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: SemVer override (empty = VERSION file)
        required: false
        default: ""

env:
  FORGEJO_IMAGE: git.stadthagen.dev/ops/k8s-toolbox

jobs:
  sbom:
    runs-on: docker
    strategy:
      fail-fast: false
      matrix:
        variant: [full, slim]
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          FILE_VER="$(tr -d '[:space:]' < VERSION)"
          VER="${{ github.event.inputs.tag }}"
          if [ -z "${VER}" ]; then
            if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
              VER="${GITHUB_REF_NAME#v}"
            else
              VER="${FILE_VER}"
            fi
          fi
          if ! [[ "${VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "::error::Invalid SemVer '${VER}'"
            exit 1
          fi
          VARIANT="${{ matrix.variant }}"
          if [ "${VARIANT}" = "slim" ]; then
            TAG="${VER}-slim"
          else
            TAG="${VER}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "variant=${VARIANT}" >> "$GITHUB_OUTPUT"

      - name: Log in to Forgejo OCI
        uses: https://data.forgejo.org/docker/login-action@v3
        with:
          registry: git.stadthagen.dev
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Pull image
        run: |
          set -euo pipefail
          docker pull "${FORGEJO_IMAGE}:${{ steps.version.outputs.tag }}"

      - name: Generate SBOM (Syft CycloneDX + SPDX)
        run: |
          set -euo pipefail
          # DinD: do not bind-mount job workspace (daemon FS ≠ act container). Write via stdout.
          TAG="${{ steps.version.outputs.tag }}"
          OUT="${PWD}/sbom"
          mkdir -p "${OUT}"
          REF="${FORGEJO_IMAGE}:${TAG}"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/syft:latest \
            "${REF}" -o cyclonedx-json > "${OUT}/k8s-toolbox-${TAG}.cdx.json"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/syft:latest \
            "${REF}" -o spdx-json > "${OUT}/k8s-toolbox-${TAG}.spdx.json"
          ls -la "${OUT}"
          test -s "${OUT}/k8s-toolbox-${TAG}.cdx.json"
          test -s "${OUT}/k8s-toolbox-${TAG}.spdx.json"

      - name: Upload SBOM artifacts
        # v4+ needs GitHub artifact backend; Forgejo/act supports v3.
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: sbom-k8s-toolbox-${{ steps.version.outputs.tag }}
          path: sbom/
          if-no-files-found: error
