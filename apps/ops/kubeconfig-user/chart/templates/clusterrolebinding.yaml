{{- if and .Values.enabled .Values.clusterRoleBinding.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubeconfig-user.crbName" . }}
  labels:
    {{- include "kubeconfig-user.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.clusterRoleBinding.clusterRoleName }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeconfig-user.saName" . }}
    namespace: {{ include "kubeconfig-user.namespace" . }}
{{- end }}
