{{- if and .Values.enabled .Values.kubeconfigJob.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubeconfig-user.jobSaName" . }}
  namespace: {{ include "kubeconfig-user.namespace" . }}
  labels:
    {{- include "kubeconfig-user.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubeconfig-user.jobSaName" . }}
  namespace: {{ include "kubeconfig-user.namespace" . }}
  labels:
    {{- include "kubeconfig-user.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubeconfig-user.jobSaName" . }}
  namespace: {{ include "kubeconfig-user.namespace" . }}
  labels:
    {{- include "kubeconfig-user.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubeconfig-user.jobSaName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeconfig-user.jobSaName" . }}
    namespace: {{ include "kubeconfig-user.namespace" . }}
{{- end }}
