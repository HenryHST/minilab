{{- if .Values.enabled }}
# Classic long-lived SA token (controller fills .data.token / ca.crt).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubeconfig-user.tokenSecretName" . }}
  namespace: {{ include "kubeconfig-user.namespace" . }}
  labels:
    {{- include "kubeconfig-user.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ include "kubeconfig-user.saName" . }}
    {{- with .Values.tokenSecret.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: kubernetes.io/service-account-token
{{- end }}
