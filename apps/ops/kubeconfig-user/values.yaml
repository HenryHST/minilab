# Site values for nXk3 — used by: helm template … -f values.yaml
# Flag: set enabled/kubeconfigJob.enabled false and re-render to disable pieces
# without removing the ApplicationSet entry.
enabled: true
createNamespace: true

serviceAccount:
  name: cluster-admin-sa
  labels:
    userType: human

clusterRoleBinding:
  create: true
  clusterRoleName: cluster-admin

apiServer: https://192.168.0.40:6443
clusterName: nXk3

kubeconfigJob:
  enabled: true
  secretName: kubeconfig-user-kubeconfig
  # Lab toolbox (bash+kubectl+certifi); replaces alpine/k8s for GHSA-6q48 / CVE-2025-68121
  image: git.stadthagen.dev/ops/k8s-toolbox:1.0.0
  imagePullSecrets:
    - name: registry-pull
  shell: /bin/sh
