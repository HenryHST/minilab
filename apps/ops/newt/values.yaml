# Credentials live in Secret newt-main-tunnel-auth (SecretSpec via Infra_LAB).
# Chart fossorial/newt 1.5.0 appVersion is 1.12.5 — pin image ahead of chart.
# Trivy AVD-KSV-0118/0104/0030/0021: pod SC is schema-limited to scalars
# (no nested seccompProfile); RuntimeDefault via container SC + pod annotation.
global:
  image:
    registry: docker.io
    repository: fosrl/newt
    tag: "1.19.1"
  podAnnotations:
    # Chart values.schema forbids nested objects under podSecurityContext.
    container.seccomp.security.alpha.kubernetes.io/pod: runtime/default
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

newtInstances:
  - name: main-tunnel
    enabled: true
    acceptClients: true
    auth:
      existingSecretName: newt-main-tunnel-auth
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/arch
                  operator: In
                  values:
                    - arm64
