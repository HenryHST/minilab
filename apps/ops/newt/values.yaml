# Credentials live in Secret newt-main-tunnel-auth (SecretSpec via Infra_LAB).
newtInstances:
  - name: main-tunnel
    enabled: true
    acceptClients: true
    auth:
      existingSecretName: newt-main-tunnel-auth
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/arch
                  operator: In
                  values:
                    - arm64
