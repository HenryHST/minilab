apiVersion: v1
kind: Service
metadata:
  name: node-local-dns-metrics
  namespace: kube-system
  labels:
    k8s-app: node-local-dns
    app.kubernetes.io/name: node-local-dns
    app.kubernetes.io/part-of: node-local-dns
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9253
      protocol: TCP
      targetPort: metrics
  selector:
    k8s-app: node-local-dns
