apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: registry-stadthagen-dev
  namespace: kube-system
  labels:
    app: kube-registry
    app.kubernetes.io/name: kube-registry
    app.kubernetes.io/part-of: registry
spec:
  secretName: registry-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - registry.stadthagen.dev
