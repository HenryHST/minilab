apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-registry
  namespace: kube-system
  labels:
    app: kube-registry
    app.kubernetes.io/name: kube-registry
    app.kubernetes.io/part-of: registry
    app.kubernetes.io/component: registry
spec:
  # RWO PVC — cannot RollingUpdate across nodes.
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: kube-registry
  template:
    metadata:
      labels:
        app: kube-registry
        app.kubernetes.io/name: kube-registry
        app.kubernetes.io/part-of: registry
        app.kubernetes.io/component: registry
    spec:
      nodeSelector:
        worker: "true"
      containers:
        - name: registry
          # Pin digest (registry:3 as of 2026-06); Renovate can bump.
          image: docker.io/library/registry:3@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          volumeMounts:
            - name: registry-config
              mountPath: /etc/distribution/config.yml
              subPath: config.yml
              readOnly: true
            - name: registry-data
              mountPath: /var/lib/registry
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /v2/
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v2/
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: registry-config
          configMap:
            name: kube-registry-config
        - name: registry-data
          persistentVolumeClaim:
            claimName: kube-registry
