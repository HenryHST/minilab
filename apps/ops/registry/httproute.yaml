# Migrated from Traefik IngressRoute → Cilium Gateway API HTTPRoute.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateway-tls-registry-tls
  namespace: kube-system
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: gateway-system
  to:
  - group: ''
    kind: Secret
    name: registry-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kube-registry
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-registry
    app.kubernetes.io/part-of: kube-system
spec:
  parentRefs:
  - name: nxk3
    namespace: gateway-system
    sectionName: https-registry
  hostnames:
  - registry.stadthagen.dev
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: kube-registry
      port: 5000
