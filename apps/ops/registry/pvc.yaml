apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kube-registry
  namespace: kube-system
  labels:
    app: kube-registry
    app.kubernetes.io/name: kube-registry
    app.kubernetes.io/part-of: registry
    app.kubernetes.io/component: storage
spec:
  # 1-replica local SC — default longhorn (3×50Gi) cannot schedule on ~32Gi worker disks
  storageClassName: longhorn-loki-local
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Fresh lab registry; expand later if image cache grows (online expand via Longhorn)
      storage: 2Gi
