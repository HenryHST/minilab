# Ingress from Traefik only. Egress stays open (Authentik OIDC discovery/token).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik-manager-ingress
  namespace: traefik-manager
  labels:
    app.kubernetes.io/name: traefik-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik-manager
  policyTypes:
    - Ingress
  ingress:
    # Cilium Gateway edge (Envoy uses reserved:ingress/host — not kube-system pods)
    - ports:
        - protocol: TCP
          port: 5000
