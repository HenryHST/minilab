apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traefik-manager-config
  namespace: traefik-manager
  labels:
    app.kubernetes.io/name: traefik-manager
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traefik-manager-backups
  namespace: traefik-manager
  labels:
    app.kubernetes.io/name: traefik-manager
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
