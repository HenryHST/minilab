# Example only — do not commit real tokens.
# Create out-of-band (kubectl / SecretSpec) in the app namespace that needs private pulls.
# Prefer attaching the same Secret as imagePullSecrets on the workload (Aqua option 2).
# Fallback: set operator.privateRegistryScanSecretsNames in values.yaml, e.g.
#   operator:
#     privateRegistryScanSecretsNames:
#       my-app-ns: dockerconfigjson-private
#
# Docs: https://aquasecurity.github.io/trivy-operator/latest/tutorials/private-registries/
apiVersion: v1
kind: Secret
metadata:
  name: dockerconfigjson-private
  namespace: CHANGE_ME_NAMESPACE
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "registry.example.com": {
          "username": "CHANGE_ME",
          "password": "CHANGE_ME",
          "auth": "CHANGE_ME_BASE64_USER_COLON_PASS"
        }
      }
    }
