# Trivy Operator — Aqua Security vulnerability & config auditor for nXk3.
# Chart 0.32.1 (app ~0.30.1): https://aquasecurity.github.io/trivy-operator/
# Align ignoreUnfixed with Infra_LAB CI (.github/workflows/trivy-scan.yml).

excludeNamespaces: "kube-system,trivy-system"

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack

trivy:
  ignoreUnfixed: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
