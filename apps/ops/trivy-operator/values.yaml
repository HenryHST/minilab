# Trivy Operator — Aqua Security vulnerability & config auditor for nXk3.
# Chart 0.37.0 (app 0.35.0): https://aquasecurity.github.io/trivy-operator/
# Trivy server image pinned to 0.76.0 (chart default may lag).
# Align ignoreUnfixed with Infra_LAB CI (.github/workflows/trivy-scan.yml).
# Issue #91: builtInTrivyServer, ClusterIP Service, Grafana dashboard via kube-prometheus-stack.

global:
  image:
    registry: ""

excludeNamespaces: "kube-system,trivy-system"

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack

service:
  # ClusterIP so Prometheus can scrape via ServiceMonitor (Aqua Grafana tutorial).
  headless: false

operator:
  builtInTrivyServer: true

trivy:
  ignoreUnfixed: true
  image:
    tag: "0.76.0"

trivyOperator:
  # Skip API-server RBAC defaults (system:controller:*, aggregate-to-*, cluster-admin/edit/admin, …).
  skipResourceByLabels: kubernetes.io/bootstrapping

resources:
  requests:
    cpu: 50m
    memory: 512Mi
  limits:
    # 512Mi OOMs during controller startup (exit 137); RBAC/config scans need headroom.
    memory: 1Gi
