# UniFi SMS Bridge — Authentik MFA OTP + event notify + optional Podcraft-style UI.
# Secrets: Secret unifi-sms (Infra_LAB k3s_secrets / SecretSpec UNIFI_SMS_*).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi-sms
  namespace: authentik
  labels:
    app.kubernetes.io/name: unifi-sms
    app.kubernetes.io/part-of: unifi-sms
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: unifi-sms
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unifi-sms
        app.kubernetes.io/part-of: unifi-sms
    spec:
      nodeSelector:
        worker: "true"
      imagePullSecrets:
        - name: registry-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: unifi-sms
          # Manifest list from Forgejo Actions run #3 (image.yml).
          image: git.stadthagen.dev/ops/unifi-sms:0.1.0@sha256:80731e1757cb20577965542b279989d38fc7115a7a00ffd55c0be9e1483dd5f8
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: unifi-sms
          env:
            - name: HOME
              value: /tmp
            - name: APP_VERSION
              value: "0.1.0"
            - name: UNIFI_SMS_UI_ENABLED
              value: "true"
            - name: UNIFI_SMS_UI_PUBLIC_URL
              value: "https://sms.stadthagen.dev"
            - name: UNIFI_SMS_AUTH_MODE
              value: "oidc"
            - name: UNIFI_SMS_OIDC_CLIENT_ID
              value: "unifi-sms"
            - name: UNIFI_SMS_OIDC_ISSUER_URL
              value: "https://idp.stadthagen.dev/application/o/unifi-sms/"
            - name: UNIFI_SMS_OIDC_AUTHORIZATION_URL
              value: "https://idp.stadthagen.dev/application/o/authorize/"
            - name: UNIFI_SMS_OIDC_TOKEN_URL
              value: "http://authentik-server.authentik.svc.cluster.local/application/o/token/"
            - name: UNIFI_SMS_OIDC_USERINFO_URL
              value: "http://authentik-server.authentik.svc.cluster.local/application/o/userinfo/"
            - name: UNIFI_SMS_OIDC_END_SESSION_URL
              value: "https://idp.stadthagen.dev/application/o/unifi-sms/end-session/"
            - name: UNIFI_SMS_OIDC_REDIRECT_URI
              value: "https://sms.stadthagen.dev/auth/oidc/callback"
            - name: UNIFI_SMS_OIDC_SCOPES
              value: "openid email profile"
            - name: UNIFI_SMS_OIDC_GROUP_CLAIM
              value: "groups"
            - name: UNIFI_SMS_ALLOW_PREFIXES
              value: "+49"
            - name: UNIFI_SMS_RATE_PER_MINUTE
              value: "10"
            - name: UNIFI_SMS_DAILY_CAP
              value: "50"
            - name: U5G_PORT
              value: "22"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: unifi-sms
  namespace: authentik
  labels:
    app.kubernetes.io/name: unifi-sms
spec:
  selector:
    app.kubernetes.io/name: unifi-sms
  ports:
    - name: http
      port: 8080
      targetPort: http
