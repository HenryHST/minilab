# Ingress: Gateway. Egress: DNS + Authentik OIDC + U5G SSH on LAN.
# Use networking.k8s.io NetworkPolicy — Argo excludes cilium.io/CiliumNetworkPolicy
# (resource.exclusions) so CNPs never sync (ExcludedResourceWarning).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unifi-sms-ingress
  namespace: authentik
  labels:
    app.kubernetes.io/name: unifi-sms
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: unifi-sms
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unifi-sms-egress
  namespace: authentik
  labels:
    app.kubernetes.io/name: unifi-sms
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: unifi-sms
  policyTypes:
    - Egress
  egress:
    # DNS (kube-dns / node-local-dns)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Authentik OIDC (same namespace — token/userinfo + public IdP via Gateway)
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9443
    # U5G modem SSH on LAN
    - to:
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - protocol: TCP
          port: 22
