# Read-only: WUD only reports updates (notify-only). Argo CD owns the workloads — no patch/update verbs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wud
  namespace: wud
  labels:
    app.kubernetes.io/name: wud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wud-reader
  labels:
    app.kubernetes.io/name: wud
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wud-reader
  labels:
    app.kubernetes.io/name: wud
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wud-reader
subjects:
  - kind: ServiceAccount
    name: wud
    namespace: wud
