apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
      scrape_timeout: 10s

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager.alertmanager.svc.cluster.local:9093

    rule_files:
      - /etc/prometheus/rules/*.yaml

    # Base job: Prometheus scrapes itself
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

    # Additional jobs live under scrape_configs/ (see scrape-config.yaml)
    scrape_config_files:
      - /etc/prometheus/scrape_configs/*.yaml
