apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-scrape-config
data:
  # Add scrape jobs under scrape_configs. Prometheus loads all *.yaml from
  # /etc/prometheus/scrape_configs via scrape_config_files (see config.yaml).
  # After editing scrape jobs, the config-reloader sidecar POSTs to /-/reload
  # automatically when this ConfigMap changes. Manual reload still works:
  # curl -X POST https://prometheus.stadthagen.dev/-/reload
  #
  # Example:
  # scrape_configs:
  #   - job_name: node
  #     static_configs:
  #       - targets:
  #           - 192.168.0.10:9100
  #         labels:
  #           instance: example
  #   - job_name: unpoller
  #     static_configs:
  #       - targets:
  #           - 192.168.0.50:9130
  jobs.yaml: |
    scrape_configs:
      - job_name: pexpve01
        scrape_interval: 15s
        static_configs:
          - targets:
              - pexpve01.stadthagen.dev:9221
      - job_name: pexpve02
        scrape_interval: 15s
        static_configs:
          - targets:
              - pexpve02.stadthagen.dev:9221
      - job_name: pexpve03
        scrape_interval: 15s
        static_configs:
          - targets:
              - pexpve03.stadthagen.dev:9221
      - job_name: pangolin
        scrape_interval: 15s
        static_configs:
          - targets:
              - pangolin.stadthagen.dev:9100
      - job_name: homeassistant
        scrape_interval: 15s
        static_configs:
          - targets:
              - ha02.stadthagen.dev:9100
      - job_name: unpoller
        scrape_interval: 15s
        static_configs:
          - targets:
              - unpoller.unpoller.svc.cluster.local:9130
      - job_name: authentik
        scrape_interval: 15s
        static_configs:
          - targets:
              - authentik-server-metrics.authentik.svc.cluster.local:9300
              - authentik-worker-metrics.authentik.svc.cluster.local:9300
      - job_name: argocd-server
        scrape_interval: 15s
        static_configs:
          - targets:
              - argo-cd-argocd-server-metrics.argocd.svc.cluster.local:8083
      - job_name: argocd-repo-server
        scrape_interval: 15s
        static_configs:
          - targets:
              - argo-cd-argocd-repo-server-metrics.argocd.svc.cluster.local:8084
      - job_name: argocd-application-controller
        scrape_interval: 15s
        static_configs:
          - targets:
              - argo-cd-argocd-application-controller-metrics.argocd.svc.cluster.local:8082
