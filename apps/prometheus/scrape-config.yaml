apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-scrape-config
data:
  # Add scrape jobs under scrape_configs. Prometheus loads all *.yaml from
  # /etc/prometheus/scrape_configs via scrape_config_files (see config.yaml).
  # After editing: POST to /-/reload (lifecycle enabled) or restart the Deployment.
  #
  # Example:
  # scrape_configs:
  #   - job_name: node
  #     static_configs:
  #       - targets:
  #           - 192.168.0.10:9100
  #         labels:
  #           instance: example
  #   - job_name: unpoller
  #     static_configs:
  #       - targets:
  #           - 192.168.0.50:9130
  jobs.yaml: |
    scrape_configs:
      - job_name: pexpve01
        scrape_interval: 15s
        static_configs:
          - targets:
              - pexpve01.stadthagen.dev:9100
      - job_name: pexpve02
        scrape_interval: 15s
        static_configs:
          - targets:
              - pexpve02.stadthagen.dev:9221
      - job_name: pexpve03
        scrape_interval: 15s
        static_configs:
          - targets:
              - pexpve03.stadthagen.dev:9100
      - job_name: pangolin
        scrape_interval: 15s
        static_configs:
          - targets:
              - pangolin.stadthagen.dev:9100
      - job_name: homeassistant
        scrape_interval: 15s
        static_configs:
          - targets:
              - ha02.stadthagen.dev:9100
