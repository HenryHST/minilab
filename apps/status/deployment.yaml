apiVersion: apps/v1
kind: Deployment
metadata:
  name: status
  namespace: uptimekuma
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: status
  template:
    metadata:
      labels:
        app: status
    spec:
      nodeSelector:
        kubernetes.io/hostname: pi4cl
      containers:
        - name: status
          image: louislam/uptime-kuma:2.5.3
          env:
            - name: UPTIME_KUMA_PORT
              value: "3001"
          ports:
            - name: http
              containerPort: 3001
          startupProbe:
            exec:
              command: ["extra/healthcheck"]
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["extra/healthcheck"]
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          hostPath:
            path: /var/lib/uptimekuma
            type: DirectoryOrCreate
