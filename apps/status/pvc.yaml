# Longhorn PVC — cluster has no pi4cl; local PV nodeAffinity would never schedule.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptimekuma-data
  namespace: uptimekuma
  annotations:
    longhorn.io/volume-replica-count: "1"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 4Gi
