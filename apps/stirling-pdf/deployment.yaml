apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stirling-pdf
  template:
    metadata:
      labels:
        app: stirling-pdf
    spec:
      nodeSelector:
        worker: "true"
      containers:
        - name: stirling-pdf
          image: stirlingtools/stirling-pdf:2.14.3-fat
          ports:
            - containerPort: 8080
          env:
            # Fat image defaults MaxMetaspaceSize=96m — OOM during Spring/Uno startup under 512Mi
            - name: JAVA_CUSTOM_OPTS
              value: "-XX:MaxMetaspaceSize=256m -XX:MaxRAMPercentage=70"
          readinessProbe:
            httpGet:
              path: /api/v1/info/status
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /api/v1/info/status
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
