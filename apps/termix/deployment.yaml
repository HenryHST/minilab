apiVersion: apps/v1
kind: Deployment
metadata:
  name: termix
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: termix
  template:
    metadata:
      labels:
        app: termix
    spec:
      nodeSelector:
        worker: "true"
        kubernetes.io/hostname: nxk3-w01
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: termix
          image: ghcr.io/lukegus/termix:release-2.7.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATA_DIR
              value: /app/data
            - name: NODE_ENV
              value: production
            - name: DATABASE_DIALECT
              value: sqlite
            - name: ALLOW_REGISTRATION
              value: "false"
            - name: ALLOW_PASSWORD_RESET
              value: "true"
            - name: OIDC_FORCE_HTTPS
              value: "true"
            - name: OIDC_ALLOW_REGISTRATION
              value: "true"
            - name: OIDC_CLIENT_ID
              value: termix
            - name: OIDC_ISSUER_URL
              value: https://idp.stadthagen.dev/application/o/termix/
            - name: OIDC_AUTHORIZATION_URL
              value: https://idp.stadthagen.dev/application/o/authorize/
            - name: OIDC_TOKEN_URL
              value: https://idp.stadthagen.dev/application/o/token/
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: termix-oauth
                  key: client-secret
            - name: GUACD_HOST
              value: "127.0.0.1"
            - name: GUACD_TUNNEL_HOST
              value: termix
            - name: GUACD_RECORDING_PATH
              value: /termix-data/session_recordings/guacamole
            - name: GUACD_RECORDING_BACKEND_PATH
              value: /app/data/session_recordings/guacamole
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
        - name: guacd
          image: guacamole/guacd:1.6.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: guacd
              containerPort: 4822
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /termix-data
      volumes:
        - name: data
          hostPath:
            path: /var/lib/termix
            type: DirectoryOrCreate
