apiVersion: v1
kind: Service
metadata:
  name: termix-postgres
  labels:
    app: termix-postgres
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app: termix-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: termix-postgres
  labels:
    app: termix-postgres
spec:
  serviceName: termix-postgres
  replicas: 1
  selector:
    matchLabels:
      app: termix-postgres
  template:
    metadata:
      labels:
        app: termix-postgres
    spec:
      # Pin to one Proxmox worker — Longhorn currently has insufficient disk for new volumes
      nodeSelector:
        kubernetes.io/hostname: nxk3-w01
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: termix
            - name: POSTGRES_USER
              value: termix
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: termix-db
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "termix", "-d", "termix"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "termix", "-d", "termix"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          hostPath:
            path: /var/lib/termix-postgres
            type: DirectoryOrCreate
