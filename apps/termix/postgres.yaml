apiVersion: v1
kind: Service
metadata:
  name: termix-postgres
  labels:
    app: termix-postgres
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app: termix-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: termix-postgres
  labels:
    app: termix-postgres
spec:
  serviceName: termix-postgres
  replicas: 1
  selector:
    matchLabels:
      app: termix-postgres
  template:
    metadata:
      labels:
        app: termix-postgres
    spec:
      nodeSelector:
        worker: "true"
      # Prefer Proxmox Longhorn workers over Pis
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node.longhorn.io/create-default-disk
                    operator: In
                    values:
                      - "true"
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: termix
            - name: POSTGRES_USER
              value: termix
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: termix-db
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "termix", "-d", "termix"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "termix", "-d", "termix"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          # Lab disk pressure: one replica is enough for Termix PG
          longhorn.io/numberOfReplicas: "1"
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 1Gi
