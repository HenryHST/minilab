apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: web
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`web.stadthagen.dev`)
      kind: Rule
      services:
        - name: web
          port: 3000
  tls:
    secretName: web-tls
