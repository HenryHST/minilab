# Alloy syslog: metrics only from same NS; syslog ports open (LB SNAT breaks ipBlock matching).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy-syslog-ingress
  namespace: alloy
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: alloy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: alloy
      ports:
        - protocol: TCP
          port: 12345
    # No `from` ⇒ any source (required for Cilium LB → pod path).
    - ports:
        - protocol: UDP
          port: 1514
        - protocol: TCP
          port: 1514
