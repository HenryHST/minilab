crds:
  enabled: true

# DNS01 self-check: use Hetzner recursive nameservers (controller flags, not ClusterIssuer fields).
dns01RecursiveNameservers: "helium.ns.hetzner.de:53,oxygen.ns.hetzner.com:53"
dns01RecursiveNameserversOnly: true

extraObjects:
  - apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: letsencrypt-prod
    spec:
      acme:
        email: admin@stadthagen.dev
        server: https://acme-v02.api.letsencrypt.org/directory
        privateKeySecretRef:
          name: letsencrypt-prod-account-key
        solvers:
          - dns01:
              webhook:
                groupName: acme.hetzner.com
                solverName: hetzner
                config:
                  tokenSecretKeyRef:
                    name: hetzner
                    key: token
