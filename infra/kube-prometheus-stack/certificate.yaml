apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-stadthagen-dev
spec:
  secretName: grafana-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - grafana.stadthagen.dev
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: prometheus-stadthagen-dev
spec:
  secretName: prometheus-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - prometheus.stadthagen.dev
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: alertmanager-stadthagen-dev
spec:
  secretName: alertmanager-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - alert-manager.stadthagen.dev
