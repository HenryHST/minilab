deploymentMode: Monolithic

minio:
  enabled: false

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 168h
  # Baseline V2: evaluate LogQL rules and send to Alertmanager.
  # Rule files: manifests/loki-alerting-rules.yaml (label loki_rule, tenant fake).
  rulerConfig:
    enable_api: true
    enable_alertmanager_v2: true
    alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
    storage:
      type: local
      local:
        directory: /rules
    rule_path: /tmp/loki/rules-temp
    ring:
      kvstore:
        store: inmemory
    wal:
      dir: /var/loki/ruler-wal

singleBinary:
  replicas: 1
  nodeSelector:
    kubernetes.io/hostname: nxk3-w01
  persistence:
    enabled: false
    dataVolumeParameters:
      persistentVolumeClaim:
        claimName: loki-data
  # Sidecar ingests ConfigMaps labeled loki_rule (chart default).
  sidecar: true

sidecar:
  rules:
    enabled: true
    label: loki_rule
    folder: /rules
    # ConfigMap annotation loki_ruler_tenant: fake → /rules/fake (auth off).
    folderAnnotation: loki_ruler_tenant

ruler:
  enabled: true

gateway:
  enabled: true
  nodeSelector:
    kubernetes.io/hostname: nxk3-w01

lokiCanary:
  enabled: false

test:
  enabled: false

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0
