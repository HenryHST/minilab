apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: registry-ui
  namespace: registry-ui
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`registry-ui.stadthagen.dev`)
      kind: Rule
      services:
        # Helm release name registry-ui + global.name → registry-ui-user-interface
        - name: registry-ui-user-interface
          port: 80
      # Authentik ForwardAuth (optional): uncomment after creating the Middleware
      # from ../authentik-forwardauth.example.yaml and an Authentik Proxy Provider /
      # Outpost for this host.
      # middlewares:
      #   - name: registry-ui-authentik
  tls:
    secretName: registry-ui-tls
