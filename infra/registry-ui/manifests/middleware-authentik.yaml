# Traefik ForwardAuth → Authentik Outpost for registry-ui.stadthagen.dev.
# Prerequisite: Authentik Proxy Provider + Outpost named so the Service is
# ak-outpost-registry-ui in namespace authentik (see README).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: registry-ui-authentik
  namespace: registry-ui
  labels:
    app.kubernetes.io/name: docker-registry-ui
    app.kubernetes.io/part-of: registry-ui
spec:
  forwardAuth:
    address: http://ak-outpost-registry-ui.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
