# ConfigMap for GC script — keep in sync with scripts/run-garbage-collection.sh
# (no kustomization.yaml; avoids Argo CMP :8081).
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-registry-gc-scripts
  namespace: kube-system
  labels:
    app: kube-registry
    app.kubernetes.io/name: kube-registry
    app.kubernetes.io/part-of: registry
    app.kubernetes.io/component: maintenance
data:
  run-garbage-collection.sh: |
    #!/bin/bash
    # Restore writes on every exit path. A failed run that left
    # the registry read-only would 503 every pull until fixed.
    restore_writes() {
      echo "[gc] restoring writes (trap)"
      kubectl -n kube-system set env deploy/kube-registry \
        REGISTRY_STORAGE_MAINTENANCE- || true
      kubectl -n kube-system rollout status deploy/kube-registry --timeout=180s || true
    }
    trap restore_writes EXIT

    # Set the whole maintenance map: on registry:3 the leaf var
    # REGISTRY_STORAGE_MAINTENANCE_READONLY_ENABLED panics at boot or is silently dropped.
    echo "[gc] flipping registry to read-only"
    kubectl -n kube-system set env deploy/kube-registry \
      'REGISTRY_STORAGE_MAINTENANCE={readonly: {enabled: true}}'
    kubectl -n kube-system rollout status deploy/kube-registry --timeout=180s

    echo "[gc] running garbage-collect -m"
    POD=$(kubectl -n kube-system get pod -l app=kube-registry \
      -o jsonpath='{.items[0].metadata.name}')
    kubectl -n kube-system exec "$POD" -- \
      registry garbage-collect -m /etc/distribution/config.yml

    echo "[gc] done"
